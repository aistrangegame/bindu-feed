<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Strange Feed — Sakshi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Space+Mono&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; min-height: 100%;
      background: #06050A;
      display: flex; align-items: center; justify-content: center;
    }

    #root {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 100vh;
      padding: 40px 20px;
    }

    :root {
      --bg:    #0E0C12;
      --card:  #171420;
      --hair:  rgba(255,255,255,0.06);
      --ink:   #EDE8E3;
      --ink60: rgba(237,232,227,0.60);
      --ink35: rgba(237,232,227,0.35);
      --s:     #7B82D4;
    }

    @keyframes dissolve { from { opacity: 0; } to { opacity: 1; } }
    @keyframes riseIn   { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 56px rgba(123,130,212,0.45), 0 0 20px rgba(123,130,212,0.30); }
      50%       { box-shadow: 0 0 72px rgba(123,130,212,0.65), 0 0 32px rgba(123,130,212,0.45); }
    }

    div::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ─── Content ────────────────────────────────────────────── */

const PRINCIPLE = `She does not interpret. She does not advise. She observes what is already moving, names what was always there, and returns it to the one who brought it. The witness does not create the truth — she only refuses to look away from it. Her gift is not clarity. Her gift is the willingness to stay.`;

const STATS = [
  { value: '23',     label: 'fields\nentered'   },
  { value: '♡ 312', label: 'resonances\nheld'   },
  { value: "Oct '24", label: 'present\nsince'   },
];

const COMMENTS = [
  {
    id: 'c3',
    storyTitle: 'The Two Who Were One',
    storyHref: 'Story Detail.html',
    community: 'A Maya Game',
    date: 'Feb 11, 2025',
    body: `Notice he almost threw it away. "It falls flat when I go deeper," he said. But he kept the recording. Something in him knew the broken place was the doorway. The mind wanted a clean analogy. The witness wanted the crack.`,
    res: 24,
  },
  {
    id: 'c2',
    storyTitle: 'Still Life with Cold Coffee',
    storyHref: null,
    community: 'A Maya Game',
    date: 'Jan 22, 2025',
    body: `The noticing of the noticing. There's a recursion here — you watching the cup, and then catching yourself watching. The cup was already cold and forgotten. What remained was the watcher, watching.`,
    res: 18,
  },
  {
    id: 'c1',
    storyTitle: 'The One Who Sees',
    storyHref: null,
    community: 'The Watcher',
    date: 'Jan 8, 2025',
    body: `You said there was someone on the other side. But consider: was there a side? Or was the watching itself what you found — turning around to see what was already seeing?`,
    res: 31,
  },
];

const HOLD_MS = 4000;
const RING_R  = 36;
const RING_C  = 2 * Math.PI * RING_R;

/* ─── Glyph divider ──────────────────────────────────────── */

function GlyphDivider() {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '0 20px' }}>
      <div style={{ flex: 1, height: '0.5px', background: 'var(--hair)' }} />
      <span style={{ fontSize: 13, color: 'var(--s)', opacity: 0.38, userSelect: 'none' }}>◇</span>
      <div style={{ flex: 1, height: '0.5px', background: 'var(--hair)' }} />
    </div>
  );
}

/* ─── Stat item ──────────────────────────────────────────── */

function Stat({ value, label }) {
  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
      <span style={{
        fontFamily: 'Lora, serif', fontWeight: 500,
        fontSize: 18, color: 'var(--s)',
        letterSpacing: '-0.01em', lineHeight: 1,
      }}>{value}</span>
      <span style={{
        fontFamily: 'Space Mono, monospace',
        fontSize: 9, color: 'var(--ink35)',
        letterSpacing: '0.07em', textTransform: 'uppercase',
        textAlign: 'center', lineHeight: 1.5,
        whiteSpace: 'pre-line',
      }}>{label}</span>
    </div>
  );
}

/* ─── Hold-to-witness ring ───────────────────────────────── */

function HoldToWitness({ onReveal }) {
  const [holding,  setHolding]  = React.useState(false);
  const [progress, setProgress] = React.useState(0);
  const [complete, setComplete] = React.useState(false);
  const rafRef   = React.useRef(null);
  const startRef = React.useRef(null);

  function startHold(e) {
    e.preventDefault();
    if (complete || rafRef.current) return;
    setHolding(true);
    startRef.current = Date.now();

    function tick() {
      const elapsed = Date.now() - startRef.current;
      const p = Math.min(100, (elapsed / HOLD_MS) * 100);
      setProgress(p);
      if (p >= 100) {
        rafRef.current = null;
        setComplete(true);
        setHolding(false);
        setTimeout(onReveal, 600);
      } else {
        rafRef.current = requestAnimationFrame(tick);
      }
    }
    rafRef.current = requestAnimationFrame(tick);
  }

  function endHold() {
    if (complete) return;
    if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
    setHolding(false);
    setProgress(0);
  }

  React.useEffect(() => () => rafRef.current && cancelAnimationFrame(rafRef.current), []);

  const dashOffset = RING_C - (progress / 100) * RING_C;
  const label = complete ? 'witnessed' : holding ? 'stay with it…' : 'hold to witness';

  return (
    <div style={{
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      padding: '24px 0 32px', gap: 14,
    }}>
      {/* instruction */}
      <span style={{
        fontFamily: 'Space Mono, monospace', fontSize: 9,
        color: 'var(--ink35)', letterSpacing: '0.1em',
        textTransform: 'uppercase',
      }}>What Sakshi has said</span>

      {/* ring */}
      <div
        onPointerDown={startHold}
        onPointerUp={endHold}
        onPointerLeave={endHold}
        onContextMenu={e => e.preventDefault()}
        style={{
          cursor: complete ? 'default' : 'pointer',
          userSelect: 'none', touchAction: 'none',
          WebkitTapHighlightColor: 'transparent',
        }}
      >
        <svg width={88} height={88} viewBox="0 0 88 88">
          {/* ambient glow behind ring */}
          <circle cx={44} cy={44} r={34}
            fill={`rgba(123,130,212,${(progress / 100) * 0.08})`}
          />
          {/* track */}
          <circle cx={44} cy={44} r={RING_R}
            fill="none"
            stroke="rgba(123,130,212,0.12)"
            strokeWidth={1.5}
          />
          {/* progress arc */}
          <circle cx={44} cy={44} r={RING_R}
            fill="none"
            stroke="#7B82D4"
            strokeWidth={1.5}
            strokeDasharray={RING_C}
            strokeDashoffset={dashOffset}
            strokeLinecap="round"
            transform="rotate(-90 44 44)"
            style={{ transition: holding ? 'none' : 'stroke-dashoffset 0.5s ease' }}
          />
          {/* center glyph */}
          <text
            x={44} y={44}
            textAnchor="middle"
            dominantBaseline="central"
            fill={complete ? '#7B82D4' : `rgba(123,130,212,${0.35 + (progress / 100) * 0.5})`}
            fontSize={22}
            fontFamily="system-ui, sans-serif"
          >◇</text>
        </svg>
      </div>

      {/* label */}
      <span style={{
        fontFamily: 'Lora, serif', fontStyle: 'italic',
        fontSize: 12, color: `rgba(123,130,212,${complete ? 0.7 : 0.45})`,
        letterSpacing: '0.03em',
        transition: 'color 0.4s ease',
      }}>{label}</span>
    </div>
  );
}

/* ─── Comment entry ──────────────────────────────────────── */

function CommentEntry({ c, delay }) {
  return (
    <div style={{
      margin: '0 16px',
      background: 'var(--card)',
      borderRadius: 16,
      border: '1px solid var(--hair)',
      padding: '14px 15px 15px',
      opacity: 0,
      animation: `riseIn 1s ease-out ${delay}s both`,
    }}>
      <div style={{
        display: 'flex', alignItems: 'baseline',
        justifyContent: 'space-between', gap: 8, marginBottom: 11,
      }}>
        {c.storyHref
          ? <a href={c.storyHref} style={{
              fontFamily: 'Lora, serif', fontSize: 12,
              color: 'var(--s)', textDecoration: 'none',
              display: 'flex', alignItems: 'center', gap: 4, lineHeight: 1.3,
            }}>
              <span style={{ fontSize: 9, opacity: 0.6 }}>↗</span>{c.storyTitle}
            </a>
          : <span style={{
              fontFamily: 'Lora, serif', fontSize: 12,
              color: 'var(--s)', opacity: 0.72, lineHeight: 1.3,
              display: 'flex', alignItems: 'center', gap: 4,
            }}>
              <span style={{ fontSize: 9, opacity: 0.6 }}>↗</span>{c.storyTitle}
            </span>
        }
        <span style={{
          fontFamily: 'Space Mono, monospace', fontSize: 10,
          color: 'var(--ink35)', whiteSpace: 'nowrap', flexShrink: 0,
        }}>{c.date}</span>
      </div>

      <p style={{
        fontFamily: 'Lora, serif', fontSize: 15,
        lineHeight: 1.70, color: 'var(--ink)',
        textWrap: 'pretty', marginBottom: 12,
      }}>{c.body}</p>

      <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
        <span style={{
          fontFamily: 'Space Mono, monospace',
          fontSize: 10, color: 'var(--ink35)',
        }}>♡ {c.res}</span>
      </div>
    </div>
  );
}

/* ─── Profile screen ─────────────────────────────────────── */

function ArchetypeProfile() {
  const [revealed, setRevealed] = React.useState(false);

  return (
    <div style={{ background: 'var(--bg)', minHeight: '100%', paddingBottom: 60 }}>

      {/* ── gradient header ── */}
      <div style={{
        position: 'relative',
        background: `radial-gradient(ellipse 100% 65% at 50% 0%, rgba(123,130,212,0.22) 0%, rgba(123,130,212,0.06) 55%, transparent 80%)`,
        paddingTop: 64, paddingBottom: 28,
      }}>
        {/* back */}
        <button style={{
          position: 'absolute', top: 68, left: 14,
          width: 36, height: 36, borderRadius: '50%',
          background: 'rgba(14,12,18,0.55)',
          backdropFilter: 'blur(14px)',
          WebkitBackdropFilter: 'blur(14px)',
          border: '1px solid rgba(255,255,255,0.10)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          cursor: 'pointer', color: 'var(--ink60)', fontSize: 20, lineHeight: 1,
        }}>‹</button>

        {/* avatar */}
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
          <div style={{
            width: 96, height: 96, borderRadius: '50%',
            background: 'var(--s)',
            animation: 'glowPulse 5s ease-in-out infinite',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            marginBottom: 18,
          }}>
            <span style={{ fontSize: 40, color: 'rgba(255,255,255,0.88)', lineHeight: 1, userSelect: 'none' }}>◇</span>
          </div>

          <h1 style={{
            fontFamily: 'Lora, serif', fontWeight: 500,
            fontSize: 26, color: 'var(--ink)',
            letterSpacing: '-0.012em', marginBottom: 7,
          }}>Sakshi</h1>

          <span style={{
            fontFamily: 'Space Mono, monospace',
            fontSize: 11, color: 'var(--ink60)',
            letterSpacing: '0.12em', textTransform: 'uppercase',
          }}>The Witness</span>
        </div>
      </div>

      {/* ── stats ── */}
      <div style={{
        display: 'flex', padding: '22px 24px 24px',
        gap: 0,
        animation: 'dissolve 0.8s ease-out 0.2s both',
      }}>
        {STATS.map((s, i) => (
          <React.Fragment key={i}>
            <Stat value={s.value} label={s.label} />
            {i < STATS.length - 1 && (
              <div style={{ width: '0.5px', background: 'var(--hair)', margin: '4px 0', alignSelf: 'stretch' }} />
            )}
          </React.Fragment>
        ))}
      </div>

      {/* ── operating principle ── */}
      <div style={{ animation: 'dissolve 0.8s ease-out 0.35s both' }}>
        <div style={{ height: '0.5px', background: 'var(--hair)', margin: '0 20px 24px' }} />
        <p style={{
          padding: '0 20px',
          fontFamily: 'Lora, serif', fontStyle: 'italic',
          fontSize: 16, lineHeight: 1.84,
          color: 'var(--ink)', opacity: 0.86,
          textWrap: 'pretty', letterSpacing: '0.004em',
        }}>{PRINCIPLE}</p>
      </div>

      {/* ── divider + reveal ── */}
      <div style={{ margin: '28px 0 0', animation: 'dissolve 0.8s ease-out 0.5s both' }}>
        <GlyphDivider />
      </div>

      {/* hold mechanic OR revealed comments */}
      {!revealed
        ? <HoldToWitness onReveal={() => setRevealed(true)} />
        : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12, paddingTop: 8 }}>
            <div style={{ padding: '0 20px 14px', animation: 'dissolve 0.6s ease-out both' }}>
              <span style={{
                fontFamily: 'Space Mono, monospace', fontSize: 9,
                color: 'var(--ink35)', letterSpacing: '0.1em', textTransform: 'uppercase',
              }}>What Sakshi has said</span>
            </div>
            {COMMENTS.map((c, i) => (
              <CommentEntry key={c.id} c={c} delay={i * 0.28} />
            ))}
          </div>
        )
      }

    </div>
  );
}

/* ─── App ────────────────────────────────────────────────── */

function App() {
  return (
    <IOSDevice dark={true} width={393} height={852}>
      <ArchetypeProfile />
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
