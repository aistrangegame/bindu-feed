<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Strange Feed — The System</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    #root { width: 100%; height: 100%; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

function Screen({ src, w = 393, h = 852 }) {
  return (
    <iframe
      src={src}
      width={w} height={h}
      style={{ border: 'none', display: 'block', borderRadius: 0 }}
      scrolling="no"
    />
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="system"
        title="A Strange Feed"
        subtitle="Slow · Intimate · Already there"
      >
        <DCArtboard id="home"   label="01  Home Feed"          width={393} height={852}>
          <Screen src="Home Feed.html" />
        </DCArtboard>

        <DCArtboard id="detail" label="02  Story Detail"        width={393} height={852}>
          <Screen src="Story Detail.html" />
        </DCArtboard>

        <DCArtboard id="sakshi" label="03  Archetype · Sakshi"  width={393} height={852}>
          <Screen src="Archetype Profile.html" />
        </DCArtboard>

        <DCArtboard id="ash"    label="04  Ash's Voice"         width={393} height={852}>
          <Screen src="Ash's Voice.html" />
        </DCArtboard>

        <DCArtboard id="rooms"  label="05  Room Selection"      width={393} height={852}>
          <Screen src="Room Selection.html" />
        </DCArtboard>

        <DCArtboard id="game"   label="06  Game View"           width={393} height={852}>
          <Screen src="Game View.html" />
        </DCArtboard>

        <DCArtboard id="settings" label="07  Settings"          width={393} height={852}>
          <Screen src="Settings.html" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
