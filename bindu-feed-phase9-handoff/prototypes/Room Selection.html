<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Strange Feed — Rooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Space+Mono&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; min-height: 100%;
      background: #06050A;
      display: flex; align-items: center; justify-content: center;
    }
    #root {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 100vh;
      padding: 40px 20px;
    }
    :root {
      --bg:    #0E0C12;
      --card:  #171420;
      --hair:  rgba(255,255,255,0.06);
      --ink:   #EDE8E3;
      --ink60: rgba(237,232,227,0.60);
      --ink35: rgba(237,232,227,0.35);
    }

    /* ── each room's own rhythm ─────────────────────────── */

    /* Maya — the wheel of illusion, slow */
    @keyframes glyphRotate   { to { transform: rotate(360deg); } }

    /* Garden — earth breathing */
    @keyframes glyphBreathe  {
      0%,100% { transform: scale(1);    opacity: 0.80; }
      50%      { transform: scale(1.07); opacity: 1.00; }
    }

    /* Descent — ember in darkness */
    @keyframes glyphEmber    {
      0%,100% { opacity: 0.55; }
      50%      { opacity: 1.00; }
    }

    /* Return — star in gentle orbit */
    @keyframes glyphOrbit    {
      0%,100% { transform: rotate(0deg)   scale(1);    opacity: 0.82; }
      33%      { transform: rotate(12deg)  scale(1.05); opacity: 1.00; }
      66%      { transform: rotate(-8deg)  scale(0.97); opacity: 0.88; }
    }

    /* Forgetting — the human loop that stutters */
    @keyframes glyphStutter  {
      0%   { transform: translate(0,0);      opacity: 0.68; }
      14%  { transform: translate(0,0);      opacity: 0.68; }
      16%  { transform: translate(2px,-1px); opacity: 0.50; }
      18%  { transform: translate(-1px,1px); opacity: 0.72; }
      20%  { transform: translate(0,0);      opacity: 0.68; }
      48%  { transform: translate(0,0);      opacity: 0.68; }
      50%  { transform: translate(-2px,1px); opacity: 0.50; }
      52%  { transform: translate(1px,-1px); opacity: 0.72; }
      54%  { transform: translate(0,0);      opacity: 0.68; }
      78%  { transform: translate(0,0);      opacity: 0.50; }
      80%  { transform: translate(1px,2px);  opacity: 0.70; }
      82%  { transform: translate(0,0);      opacity: 0.68; }
      100% { transform: translate(0,0);      opacity: 0.68; }
    }

    /* Remembering — dawn rising slowly */
    @keyframes glyphDawn     {
      0%   { opacity: 0.32; transform: scale(0.94); }
      55%  { opacity: 0.85; transform: scale(1.01); }
      72%  { opacity: 1.00; transform: scale(1.03); }
      84%  { opacity: 1.00; transform: scale(1.03); }
      100% { opacity: 0.32; transform: scale(0.94); }
    }

    /* Body — full 8-second breath */
    @keyframes glyphBreath8  {
      0%,100% { transform: scale(1);    opacity: 0.76; }
      50%      { transform: scale(1.08); opacity: 1.00; }
    }

    /* Thread — the shuttle crossing */
    @keyframes glyphWeave    {
      0%,100% { transform: translateX(0px);  }
      28%      { transform: translateX(6px);  }
      72%      { transform: translateX(-6px); }
    }

    /* Circle — barely perceptible orbit */
    @keyframes glyphCircle   { to { transform: rotate(360deg); } }

    /* Signal — long quiet, then arrival */
    @keyframes glyphSignal   {
      0%,62%  { opacity: 0.36; transform: scale(1); }
      67%     { opacity: 1.00; transform: scale(1.20); }
      72%     { opacity: 0.36; transform: scale(1); }
      100%    { opacity: 0.36; transform: scale(1); }
    }

    /* Forge — assembling from formlessness */
    @keyframes glyphAssemble {
      0%   { opacity: 0.18; transform: scale(0.80); }
      42%  { opacity: 1.00; transform: scale(1.00); }
      70%  { opacity: 1.00; transform: scale(1.00); }
      100% { opacity: 0.18; transform: scale(0.80); }
    }

    /* Field — the Möbius turn */
    @keyframes glyphField    {
      0%   { transform: perspective(100px) rotateY(0deg);   }
      100% { transform: perspective(100px) rotateY(360deg); }
    }

    /* Mirror — the surface catching changing light */
    @keyframes mirrorFace  {
      0%,100% { opacity: 0.60; transform: scale(0.99); }
      50%      { opacity: 1.00; transform: scale(1.03); }
    }

    /* Signal Space — a transmission landing in the dark */
    @keyframes signalLand  {
      0%,60%  { opacity: 0.40; transform: scale(1); }
      68%      { opacity: 1.00; transform: scale(1.18); }
      76%      { opacity: 0.46; transform: scale(1); }
      100%     { opacity: 0.46; transform: scale(1); }
    }

    /* Transition overlays */
    @keyframes overlayIn   { to   { opacity: 0.92; } }
    @keyframes glyphExpand { from { transform: scale(1); } to { transform: scale(11); opacity: 0.35; } }

    div::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ─── The thirteen rooms ─────────────────────────────────── */

const ROOMS = [
  {
    id: 'maya',        name: 'A Maya Game',      color: '#D4AE4A',
    glyph: '◈', gSize: 48, glow: 20,
    anim: 'glyphRotate 26s linear infinite',
  },
  {
    id: 'garden',      name: 'The Garden',        color: '#4A9E6B',
    glyph: '◆', gSize: 44, glow: 16,
    anim: 'glyphBreathe 4.5s ease-in-out infinite',
  },
  {
    id: 'watcher',     name: 'The Watcher',       color: '#7B82D4',
    glyph: '◇', gSize: 42, glow: 13,
    anim: 'none',
  },
  {
    id: 'descent',     name: 'The Descent',       color: '#E5533C',
    glyph: '·', gSize: 34, glow: 24,
    anim: 'glyphEmber 2.8s ease-in-out infinite',
  },
  {
    id: 'return',      name: 'The Return',        color: '#9B6BD6',
    glyph: '✦', gSize: 50, glow: 18,
    anim: 'glyphOrbit 7s ease-in-out infinite',
  },
  {
    id: 'forgetting',  name: 'The Forgetting',    color: '#C4A882',
    glyph: '○', gSize: 44, glow: 13,
    anim: 'glyphStutter 20s ease-in-out infinite',
  },
  {
    id: 'remembering', name: 'The Remembering',   color: '#8AB5A0',
    glyph: '△', gSize: 44, glow: 14,
    anim: 'glyphDawn 9s ease-in-out infinite',
  },
  {
    id: 'body',        name: 'The Body',          color: '#C45A50',
    glyph: '⬡', gSize: 46, glow: 18,
    anim: 'glyphBreath8 8s ease-in-out infinite',
  },
  {
    id: 'thread',      name: 'The Thread',        color: '#C4923A',
    glyph: '⊕', gSize: 44, glow: 15,
    anim: 'glyphWeave 3.5s ease-in-out infinite',
  },
  {
    id: 'circle',      name: 'The Circle',        color: '#D4607A',
    glyph: '◎', gSize: 44, glow: 15,
    anim: 'glyphCircle 42s linear infinite',
  },
  {
    id: 'signal',      name: 'The Signal',        color: '#3AADA8',
    glyph: '✧', gSize: 44, glow: 20,
    anim: 'glyphSignal 7s ease-in-out infinite',
  },
  {
    id: 'forge',       name: 'The Forge',         color: '#D4AE4A',
    glyph: '▲', gSize: 42, glow: 15,
    anim: 'glyphAssemble 5.5s ease-in-out infinite',
  },
  {
    id: 'field',       name: 'The Field',         color: '#9B6BD6',
    glyph: '∞', gSize: 52, glow: 22,
    anim: 'glyphField 10s linear infinite',
  },
];

/* ─── The two turns of the field ─────────────────────────── */
/* Not story-rooms (3rd person) but the spine's other persons:    */
/* the Mirror reflects you (1st), the Signal Space gives to you    */
/* (2nd). They open into their own spaces, not the feed.           */

const TURNS = [
  {
    id: 'mirror', name: 'The Mirror', person: 'first person', color: '#C47A52',
    glyph: '◐', gSize: 30, glow: 18, anim: 'mirrorFace 9s ease-in-out infinite',
    href: 'The Mirror.html', desc: 'What you have already seen, handed back.',
  },
  {
    id: 'signalspace', name: 'The Signal Space', person: 'second person', color: '#3AADA8',
    glyph: '⊙', gSize: 31, glow: 18, anim: 'signalLand 7s ease-in-out infinite',
    href: 'The Signal Space.html', desc: 'One transmission, received whole — then you leave.',
  },
];

/* name style overrides per room */
function nameStyle(room) {
  if (room.id === 'watcher') return { letterSpacing: '0.14em', textTransform: 'uppercase', fontSize: 10 };
  if (['descent','return','field'].includes(room.id)) return { fontStyle: 'italic' };
  return {};
}

/* ─── Portal card ────────────────────────────────────────── */

function PortalCard({ room, onEnter }) {
  const [pressed, setPressed] = React.useState(false);

  return (
    <div
      onPointerDown={() => setPressed(true)}
      onPointerUp={() => { setPressed(false); onEnter(room); }}
      onPointerLeave={() => setPressed(false)}
      onContextMenu={e => e.preventDefault()}
      style={{
        background: `${room.color}0D`,
        border: `1px solid ${room.color}22`,
        borderRadius: 18,
        padding: '22px 8px 16px',
        display: 'flex', flexDirection: 'column',
        alignItems: 'center', gap: 12,
        cursor: 'pointer',
        transform: pressed ? 'scale(0.95)' : 'scale(1)',
        transition: 'transform 0.14s ease',
        userSelect: 'none',
        WebkitTapHighlightColor: 'transparent',
        touchAction: 'none',
      }}
    >
      {/* the living glyph */}
      <div style={{
        width: 56, height: 56,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>
        <span style={{
          fontSize: room.gSize,
          color: room.color,
          lineHeight: 1,
          animation: room.anim,
          filter: `drop-shadow(0 0 ${room.glow}px ${room.color}65)`,
          userSelect: 'none',
          display: 'block',
        }}>{room.glyph}</span>
      </div>

      {/* name */}
      <span style={{
        fontFamily: 'Lora, serif', fontSize: 11,
        color: room.color, opacity: 0.80,
        textAlign: 'center', lineHeight: 1.3,
        letterSpacing: '0.01em',
        ...nameStyle(room),
      }}>{room.name}</span>
    </div>
  );
}

/* ─── A turn-of-the-field card ───────────────────────────── */

function TurnCard({ turn, onEnter }) {
  const [pressed, setPressed] = React.useState(false);
  return (
    <div
      onPointerDown={() => setPressed(true)}
      onPointerUp={() => { setPressed(false); onEnter(turn); }}
      onPointerLeave={() => setPressed(false)}
      onContextMenu={e => e.preventDefault()}
      style={{
        display: 'flex', alignItems: 'center', gap: 16,
        background: `${turn.color}0D`,
        border: `1px solid ${turn.color}22`,
        borderRadius: 18, padding: '15px 18px',
        cursor: 'pointer',
        transform: pressed ? 'scale(0.97)' : 'scale(1)',
        transition: 'transform 0.14s ease',
        userSelect: 'none', WebkitTapHighlightColor: 'transparent', touchAction: 'none',
      }}
    >
      <div style={{ width: 50, height: 50, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <span style={{
          fontSize: turn.gSize, color: turn.color, lineHeight: 1,
          animation: turn.anim, filter: `drop-shadow(0 0 ${turn.glow}px ${turn.color}65)`,
          userSelect: 'none', display: 'block',
        }}>{turn.glyph}</span>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 9 }}>
          <span style={{ fontFamily: 'Lora, serif', fontSize: 15, color: turn.color, opacity: 0.92, letterSpacing: '0.01em' }}>{turn.name}</span>
          <span style={{ fontFamily: 'Space Mono, monospace', fontSize: 8, color: turn.color, opacity: 0.5, letterSpacing: '0.12em', textTransform: 'uppercase' }}>{turn.person}</span>
        </div>
        <span style={{ fontFamily: 'Lora, serif', fontStyle: 'italic', fontSize: 12.5, color: 'var(--ink60)', lineHeight: 1.45, textWrap: 'pretty' }}>{turn.desc}</span>
      </div>
      <span style={{ marginLeft: 'auto', color: `${turn.color}70`, fontSize: 18, lineHeight: 1, flexShrink: 0 }}>›</span>
    </div>
  );
}

/* ─── Selection screen ───────────────────────────────────── */

function RoomSelection() {
  const [entering, setEntering] = React.useState(null);

  function handleEnter(item) {
    if (entering) return;
    setEntering(item);
    const dest = item.href ? item.href : ('Game View.html#' + item.id);
    setTimeout(() => { window.location.href = dest; }, 700);
  }

  const isLastAlone = ROOMS.length % 2 === 1;

  return (
    <div style={{ background: 'var(--bg)', minHeight: '100%', paddingBottom: 52 }}>

      {/* nav */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '66px 16px 0' }}>
        <button onClick={() => { window.location.href = 'Home Feed.html'; }} style={{
          background: 'none', border: 'none', cursor: 'pointer',
          color: 'var(--ink60)', fontSize: 24, lineHeight: 1,
          padding: '2px 6px 2px 0',
        }}>‹</button>
        <span style={{
          fontFamily: 'Space Mono, monospace',
          fontSize: 10, color: 'var(--ink35)',
          letterSpacing: '0.14em',
        }}>THIRTEEN ROOMS</span>
      </div>

      <p style={{
        padding: '10px 20px 22px',
        fontFamily: 'Lora, serif', fontStyle: 'italic',
        fontSize: 13, color: 'var(--ink35)',
        lineHeight: 1.6,
      }}>Each one already alive when you arrive.</p>

      {/* portal grid */}
      <div style={{
        display: 'grid',
        gridTemplateColumns: '1fr 1fr',
        gap: 11,
        padding: '0 16px',
      }}>
        {ROOMS.map((room, i) => {
          const isLast = isLastAlone && i === ROOMS.length - 1;
          if (isLast) {
            return (
              <div key={room.id} style={{
                gridColumn: '1 / -1',
                display: 'flex', justifyContent: 'center',
              }}>
                <div style={{ width: 'calc(50% - 5.5px)' }}>
                  <PortalCard room={room} onEnter={handleEnter} />
                </div>
              </div>
            );
          }
          return <PortalCard key={room.id} room={room} onEnter={handleEnter} />;
        })}
      </div>

      {/* the two turns of the field — Mirror & Signal Space */}
      <div style={{ padding: '30px 16px 0' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
          <div style={{ flex: 1, height: '0.5px', background: 'var(--hair)' }} />
          <span style={{ fontFamily: 'Space Mono, monospace', fontSize: 9, color: 'var(--ink35)', letterSpacing: '0.18em', textTransform: 'uppercase' }}>and the field turns to you</span>
          <div style={{ flex: 1, height: '0.5px', background: 'var(--hair)' }} />
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 11 }}>
          {TURNS.map(t => <TurnCard key={t.id} turn={t} onEnter={handleEnter} />)}
        </div>
      </div>

      {/* entering overlay — glyph expands into the space */}
      {entering && (
        <div style={{
          position: 'fixed', inset: 0, zIndex: 100,
          background: entering.color,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          animation: 'overlayIn 0.70s ease-in forwards',
          opacity: 0,
          pointerEvents: 'none',
        }}>
          <span style={{
            fontSize: 72, color: 'rgba(255,255,255,0.55)',
            lineHeight: 1, display: 'block',
            animation: 'glyphExpand 0.70s ease-in forwards',
            userSelect: 'none',
          }}>{entering.glyph}</span>
        </div>
      )}
    </div>
  );
}

/* ─── App ────────────────────────────────────────────────── */

function App() {
  return (
    <IOSDevice dark={true} width={393} height={852}>
      <RoomSelection />
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
