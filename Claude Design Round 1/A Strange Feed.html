<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Strange Feed — The Door</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>
/* ── field-sound.js, inlined — kept as its own file for the port and for reading
   on its own, but inlined here so the page never depends on a subresource
   fetch to render. Do not edit here; edit field-sound.js. ── */
/* FIELD SOUND — the ceremonial sound layer.
   Generated, never recorded. Nothing samples; nothing loops.
   Names mirror the app's Sound/ layer so the Swift port maps 1:1:
   SonicContext (bed) · BreathVoice (per-presence) · ThresholdTone (transitions).
   Felt, not heard: the ceiling is deliberately low. Muting is a fade, never a cut. */
(function(global){
'use strict';
var CEIL=0.55;
var reduced=global.matchMedia&&global.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Per-presence timbre. Each voice is the same field heard from one angle —
   same tuning as the bed, differing only in body and behaviour. */
var CHAR={
  bindu:{wave:'sine',partials:[1,2,3],gain:0.055,atk:0.6,rel:5.0,flicker:6.2,pan:0},
  neev:{wave:'sine',partials:[0.5,1],gain:0.07,atk:3.4,rel:8.0,pan:-0.15},
  gaia:{wave:'triangle',partials:[1,1.5],gain:0.05,atk:1.6,rel:6.0,pan:-0.3},
  sid:{wave:'sine',partials:[1,1.2],gain:0.05,atk:1.2,rel:6.5,pan:0.25},
  arch:{wave:'triangle',partials:[1,2],gain:0.048,atk:0.9,rel:4.5,vib:4.6,pan:0.35},
  shweta:{wave:'sine',partials:[1],gain:0.012,atk:4.0,rel:9.0,air:0.028,pan:0},
  karishma:{wave:'sine',partials:[1,2,3.02],gain:0.036,atk:2.0,rel:7.0,shimmer:true,pan:0.4},
  sakshi:{wave:'sine',partials:[1],gain:0.026,atk:5.0,rel:10.0,pan:-0.4},
  ashrey:{wave:'sine',partials:[1,2],gain:0.042,atk:1.4,rel:6.0,pan:0.15},
  lalita:{wave:'sine',partials:[1,1.5],gain:0.04,atk:2.2,rel:8.0,gliss:1.02,pan:0},
  ash:{wave:'sine',partials:[1,2,4],gain:0.05,atk:1.0,rel:5.5,pan:0}
};
/* Each presence's own frequency — the tone it sounds as it takes the field. */
var HZ={bindu:110,neev:82,gaia:146,sid:174,arch:220,shweta:329,karishma:392,sakshi:285,ashrey:196,lalita:396,ash:261};

var FieldSound={
  ctx:null,master:null,bus:null,bed:null,bedFilter:null,bedLfo:null,
  muted:true,aged:false,inkNode:null,ringStep:0,

  init:function(){
    if(this.ctx)return;
    var C=global.AudioContext||global.webkitAudioContext; if(!C)return;
    this.ctx=new C();
    this.master=this.ctx.createGain(); this.master.gain.value=0;
    this.bus=this.ctx.createGain(); this.bus.gain.value=1;
    var conv=this.ctx.createConvolver(); conv.buffer=this._air(3.6,0.34);
    var wet=this.ctx.createGain(); wet.gain.value=0.5;
    this.bus.connect(this.master); this.bus.connect(conv); conv.connect(wet); wet.connect(this.master);
    this.master.connect(this.ctx.destination);
  },
  _air:function(secs,decay){
    var sr=this.ctx.sampleRate,len=Math.floor(sr*secs),b=this.ctx.createBuffer(2,len,sr);
    for(var ch=0;ch<2;ch++){var d=b.getChannelData(ch);
      for(var i=0;i<len;i++){var t=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-t,1/decay)*0.6;}}
    return b;
  },
  _pan:function(v){ if(!this.ctx.createStereoPanner)return null; var p=this.ctx.createStereoPanner(); p.pan.value=v||0; return p; },

  /* the bed: room-tuned breath drone, swelling on the room's own pace */
  startBed:function(rootHz,breathSecs){
    rootHz=rootHz||110; breathSecs=breathSecs||10;
    this.init(); if(!this.ctx)return;
    if(this.ctx.state==='suspended')this.ctx.resume();
    if(this.bed)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.value=0.030;
    var f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; f.Q.value=0.6;
    var root=this.ctx.createOscillator(); root.type='sine'; root.frequency.value=rootHz;
    var fifth=this.ctx.createOscillator(); fifth.type='sine'; fifth.frequency.value=rootHz*1.5;
    var fg=this.ctx.createGain(); fg.gain.value=0.16;
    var lfo=this.ctx.createOscillator(); lfo.frequency.value=1/Math.max(2,breathSecs);
    var lg=this.ctx.createGain(); lg.gain.value=0.014;
    lfo.connect(lg); lg.connect(g.gain);
    root.connect(f); fifth.connect(fg); fg.connect(f); f.connect(g); g.connect(this.bus);
    root.start(t); fifth.start(t); lfo.start(t);
    this.bed={root:root,fifth:fifth,g:g,rootHz:rootHz}; this.bedFilter=f; this.bedLfo=lfo;
    this.apply();
  },

  /* patina — the same bed, aged. The Return opens here. */
  agedBed:function(rootHz,breathSecs){
    rootHz=rootHz||84; breathSecs=breathSecs||13;
    this.startBed(rootHz,breathSecs);
    if(!this.ctx||this.aged)return; this.aged=true;
    var t=this.ctx.currentTime;
    this.bedFilter.frequency.linearRampToValueAtTime(430,t+6);       // warmth closes in
    this.bed.root.frequency.linearRampToValueAtTime(rootHz*0.996,t+8); // settles a few cents flat
    this.bed.fifth.frequency.linearRampToValueAtTime(rootHz*1.5*0.994,t+8);
    if(this.bedLfo)this.bedLfo.frequency.linearRampToValueAtTime(1/(breathSecs*1.35),t+6);
    var w=this.ctx.createOscillator(); w.frequency.value=0.07;        // slow tape wobble
    var wg=this.ctx.createGain(); wg.gain.value=0.9;
    w.connect(wg); wg.connect(this.bed.root.frequency); w.start(t);
  },

  apply:function(){ if(this.master&&this.ctx)this.master.gain.linearRampToValueAtTime(this.muted?0:CEIL,this.ctx.currentTime+1.4); },
  setMuted:function(m){ this.muted=m; if(this.ctx){ if(!m&&this.ctx.state==='suspended')this.ctx.resume(); this.apply(); } },

  /* BreathVoice — a presence takes the field */
  voice:function(key,hz,dur){
    if(!this.ctx||this.muted||reduced)return;
    var c=CHAR[key]||CHAR.ash, self=this;
    hz=hz||HZ[key]||220;
    var t=this.ctx.currentTime, life=dur||(c.atk+c.rel);
    var vg=this.ctx.createGain(); vg.gain.setValueAtTime(0,t);
    vg.gain.linearRampToValueAtTime(c.gain,t+c.atk);
    vg.gain.linearRampToValueAtTime(0,t+life);
    var pan=this._pan(c.pan);
    if(pan){vg.connect(pan);pan.connect(this.bus);}else vg.connect(this.bus);
    c.partials.forEach(function(mult,i){
      var o=self.ctx.createOscillator(); o.type=c.wave; o.frequency.value=hz*mult;
      var pg=self.ctx.createGain(); pg.gain.value=1/(i+1.6);
      o.connect(pg); pg.connect(vg);
      if(c.gliss&&i===1)o.frequency.linearRampToValueAtTime(hz*mult*c.gliss,t+life);
      if(c.vib){var v=self.ctx.createOscillator(); v.frequency.value=c.vib;
        var vgn=self.ctx.createGain(); vgn.gain.value=hz*0.006;
        v.connect(vgn); vgn.connect(o.frequency); v.start(t); v.stop(t+life+0.2);}
      o.start(t); o.stop(t+life+0.2);
    });
    if(c.flicker){ // Bindu: the ember, alive
      var fl=this.ctx.createOscillator(); fl.frequency.value=c.flicker;
      var fg=this.ctx.createGain(); fg.gain.value=c.gain*0.45;
      fl.connect(fg); fg.connect(vg.gain); fl.start(t); fl.stop(t+life+0.2);
    }
    if(c.air){ // Shweta: the gap the sound moves through
      var n=this.ctx.createBufferSource(); n.buffer=this._air(life,0.9);
      var nf=this.ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=hz*4; nf.Q.value=0.7;
      var ng=this.ctx.createGain(); ng.gain.setValueAtTime(0,t);
      ng.gain.linearRampToValueAtTime(c.air,t+c.atk); ng.gain.linearRampToValueAtTime(0,t+life);
      n.connect(nf); nf.connect(ng); ng.connect(this.bus); n.start(t);
    }
    if(c.shimmer){ // Karishma: grace, arriving from above
      var s=this.ctx.createOscillator(); s.type='sine'; s.frequency.value=hz*6;
      var sg=this.ctx.createGain(); sg.gain.setValueAtTime(0,t);
      sg.gain.linearRampToValueAtTime(c.gain*0.18,t+c.atk*1.6);
      sg.gain.linearRampToValueAtTime(0,t+life);
      s.connect(sg); sg.connect(this.bus); s.start(t); s.stop(t+life+0.2);
    }
    if(this.bed){ // the bed steps back while a voice speaks, then returns
      var bg=this.bed.g.gain; bg.cancelScheduledValues(t);
      bg.linearRampToValueAtTime(0.018,t+c.atk);
      bg.linearRampToValueAtTime(0.030,t+life+1.6);
    }
  },

  /* ThresholdTone — one movement gives way to the next */
  threshold:function(hz,dur){
    hz=hz||198; dur=dur||5;
    if(!this.ctx||this.muted||reduced)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.032,t+dur*0.42);
    g.gain.linearRampToValueAtTime(0,t+dur);
    var o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=hz;
    var o2=this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=hz*2.002;
    var g2=this.ctx.createGain(); g2.gain.value=0.22;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.bus);
    o.start(t); o2.start(t); o.stop(t+dur+0.1); o2.stop(t+dur+0.1);
  },

  /* the Bowl — struck once, a long room. The bed holds its breath. */
  bowl:function(hz){
    hz=hz||220;
    if(!this.ctx||this.muted)return;
    var t=this.ctx.currentTime,dur=11,self=this;
    var g=this.ctx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.075,t+0.09);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    [1,2.004,2.98,4.02].forEach(function(m,i){
      var o=self.ctx.createOscillator(); o.type='sine'; o.frequency.value=hz*m;
      var pg=self.ctx.createGain(); pg.gain.value=1/(i*2.2+1);
      o.connect(pg); pg.connect(g); o.start(t); o.stop(t+dur);
    });
    g.connect(this.bus);
    if(this.bed){var bg=this.bed.g.gain; bg.cancelScheduledValues(t);
      bg.linearRampToValueAtTime(0.006,t+1.2); bg.linearRampToValueAtTime(0.030,t+9);}
  },

  /* a ring forms — each return lands one step further up the series */
  ring:function(step){
    if(!this.ctx||this.muted)return;
    var n=typeof step==='number'?step:++this.ringStep;
    var base=(this.bed&&this.bed.rootHz)||84;
    var R=[2,3,4,4.5,6,8], hz=base*R[Math.min(n,R.length-1)];
    var t=this.ctx.currentTime,dur=9;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.036,t+3.2);  // grows outward; never strikes
    g.gain.linearRampToValueAtTime(0.020,t+6);
    g.gain.linearRampToValueAtTime(0,t+dur);
    var o=this.ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(hz*0.985,t);
    o.frequency.linearRampToValueAtTime(hz,t+4);  // settles into tune as it lands
    var o2=this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=hz*1.5;
    var g2=this.ctx.createGain(); g2.gain.value=0.14;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.bus);
    o.start(t); o2.start(t); o.stop(t+dur); o2.stop(t+dur);
  },

  /* ink — while you write, the field leans in. A held tone, never clicks. */
  inkOn:function(hz){
    if(!this.ctx||this.muted||this.inkNode||reduced)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.014,t+2.4);
    var o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=hz||174;
    var f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=600;
    o.connect(f); f.connect(g); g.connect(this.bus); o.start(t);
    this.inkNode={o:o,g:g};
  },
  inkTouch:function(){
    if(!this.inkNode||this.muted||reduced)return;
    var t=this.ctx.currentTime,g=this.inkNode.g.gain;
    g.cancelScheduledValues(t);
    g.linearRampToValueAtTime(0.022,t+0.12);
    g.linearRampToValueAtTime(0.014,t+1.1);
  },
  inkOff:function(){
    if(!this.inkNode)return;
    var t=this.ctx.currentTime,n=this.inkNode; this.inkNode=null;
    n.g.gain.cancelScheduledValues(t);
    n.g.gain.linearRampToValueAtTime(0,t+1.8);
    n.o.stop(t+2);
  },

  /* ─── THE ROOM OPENS ────────────────────────────────
     The Gathering happens in a room. The Light happens in a NAVE.
     A cathedral's whole acoustic signature is its tail — 8 seconds of
     stone giving your own sound back to you, changed. Opening this is
     the single most spatial thing the sound layer can do: the listener
     hears the size of the space before he sees it. */
  openTheRoom:function(dur){
    dur=dur||5;
    this.init(); if(!this.ctx)return;
    if(!this.nave){
      var c=this.ctx.createConvolver(); c.buffer=this._air(8.5,0.62);   // the long stone tail
      var w=this.ctx.createGain(); w.gain.value=0;
      var pre=this.ctx.createBiquadFilter(); pre.type='highpass'; pre.frequency.value=180;
      this.bus.connect(pre); pre.connect(c); c.connect(w); w.connect(this.master);
      this.nave=w;
    }
    var t=this.ctx.currentTime;
    this.nave.gain.cancelScheduledValues(t);
    this.nave.gain.linearRampToValueAtTime(0.85,t+dur);
  },
  closeTheRoom:function(dur){
    if(!this.nave||!this.ctx)return;
    var t=this.ctx.currentTime;
    this.nave.gain.cancelScheduledValues(t);
    this.nave.gain.linearRampToValueAtTime(0,t+(dur||6));
  },

  /* ─── THE LIGHT — the photographic negative of the Gathering ───
     The Gathering FILLS: voices arrive one after another into the dark.
     The Light REMOVES. So the sound does the opposite of everything above:
     it draws in, holds, drains, strikes once, and leaves silence. */

  /* the long breath IN, and the hold. The bed rises, tightens, then stops. */
  breathIn:function(dur){
    dur=dur||6;
    this.init(); if(!this.ctx)return;
    if(this.ctx.state==='suspended')this.ctx.resume();
    if(!this.bed)this.startBed(110,10);
    if(this.muted)return;
    var t=this.ctx.currentTime;
    if(this.bedLfo)this.bedLfo.frequency.linearRampToValueAtTime(0.001,t+dur*0.7); // the breathing stops
    if(this.bedFilter)this.bedFilter.frequency.linearRampToValueAtTime(2600,t+dur); // brightens as it draws in
    var g=this.bed.g.gain; g.cancelScheduledValues(t);
    g.linearRampToValueAtTime(0.052,t+dur*0.78);   // swells
    g.linearRampToValueAtTime(0.040,t+dur);        // and holds. Does not release.
    var rise=this.ctx.createOscillator(); rise.type='sine';
    rise.frequency.setValueAtTime(this.bed.rootHz,t);
    rise.frequency.linearRampToValueAtTime(this.bed.rootHz*1.5,t+dur);
    var rg=this.ctx.createGain(); rg.gain.setValueAtTime(0,t);
    rg.gain.linearRampToValueAtTime(0.026,t+dur*0.8);
    rg.gain.linearRampToValueAtTime(0.018,t+dur);
    rise.connect(rg); rg.connect(this.bus); rise.start(t); rise.stop(t+dur+8);
    this._held=rise;
  },

  /* the veil drawn away — everything drains downward and out.
     Nothing arrives here. This is the sound of subtraction. */
  veilLift:function(dur){
    dur=dur||3;
    if(!this.ctx||this.muted)return;
    var t=this.ctx.currentTime;
    if(this.bedFilter)this.bedFilter.frequency.linearRampToValueAtTime(120,t+dur); // the room closes and goes
    if(this.bed){var g=this.bed.g.gain; g.cancelScheduledValues(t); g.linearRampToValueAtTime(0,t+dur);}
    if(this._held){var h=this._held; try{h.stop(t+dur+0.1);}catch(e){} this._held=null;}
    var n=this.ctx.createBufferSource(); n.buffer=this._air(dur,0.55);   // the texture draining
    var nf=this.ctx.createBiquadFilter(); nf.type='lowpass';
    nf.frequency.setValueAtTime(3000,t); nf.frequency.linearRampToValueAtTime(90,t+dur);
    var ng=this.ctx.createGain(); ng.gain.setValueAtTime(0.030,t); ng.gain.linearRampToValueAtTime(0,t+dur);
    n.connect(nf); nf.connect(ng); ng.connect(this.bus); n.start(t);
  },

  /* the bare light — almost nothing. A single high room-tone, barely there,
     so the silence has an edge to it. The breath cues ride on this. */
  lightBed:function(breathSecs){
    breathSecs=breathSecs||10;
    if(!this.ctx||this.muted||this.lightNode)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.012,t+6);
    var o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=528;
    var o2=this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=792;
    var g2=this.ctx.createGain(); g2.gain.value=0.3;
    var lfo=this.ctx.createOscillator(); lfo.frequency.value=1/breathSecs;
    var lg=this.ctx.createGain(); lg.gain.value=0.006;
    lfo.connect(lg); lg.connect(g.gain);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.bus);
    o.start(t); o2.start(t); lfo.start(t);
    this.lightNode={o:o,o2:o2,lfo:lfo,g:g};
  },
  lightOff:function(dur){
    if(!this.lightNode||!this.ctx)return;
    var t=this.ctx.currentTime,n=this.lightNode; this.lightNode=null;
    n.g.gain.cancelScheduledValues(t); n.g.gain.linearRampToValueAtTime(0,t+(dur||5));
    n.o.stop(t+(dur||5)+0.2); n.o2.stop(t+(dur||5)+0.2); n.lfo.stop(t+(dur||5)+0.2);
  },

  /* walking back out — the dark returns, and with it the breathing */
  darkReturns:function(){
    if(!this.ctx)return;
    var t=this.ctx.currentTime;
    this.lightOff(5);
    if(this.bedFilter)this.bedFilter.frequency.linearRampToValueAtTime(900,t+7);
    if(this.bedLfo)this.bedLfo.frequency.linearRampToValueAtTime(0.1,t+7);
    if(this.bed){var g=this.bed.g.gain; g.cancelScheduledValues(t); g.linearRampToValueAtTime(0.030,t+7);}
  },

  /* aliases the prototypes already call */
  start:function(){this.startBed();},
  startBreath:function(hz){this.startBed(hz);this.setMuted(false);},
  setOn:function(v){this.setMuted(!v);},
  tone:function(hz,dur){this.threshold(hz,dur||5);},
  seal:function(hz){this.bowl(hz);},
  hzFor:function(k){return HZ[k]||220;}
};
global.FieldSound=FieldSound;
global.Sound=FieldSound;
})(window);

</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#050408;overflow:hidden;font-family:Lora,Georgia,serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
:root{--bg:#0E0C12;--card:#171420;--hair:rgba(255,255,255,0.06);--ink:#EDE8E3;--ink60:rgba(237,232,227,0.60);--ink35:rgba(237,232,227,0.35);--ink18:rgba(237,232,227,0.18)}
/* the 0.1 Hz master pulse — one breath under everything */
@keyframes breath{0%,100%{opacity:.34;transform:scale(1)}50%{opacity:.80;transform:scale(1.045)}}
@keyframes breathSoft{0%,100%{opacity:.5}50%{opacity:.92}}
@keyframes ember{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.07)}}
@keyframes hint{0%,100%{opacity:.20}50%{opacity:.52}}
@keyframes glyphBreath{0%,100%{opacity:.44;transform:scale(.985)}50%{opacity:.95;transform:scale(1.03)}}
@keyframes rise{0%{transform:translateY(14px);opacity:0}18%{opacity:.5}82%{opacity:.42}100%{transform:translateY(-118px);opacity:0}}
@keyframes settle{0%{transform:translateY(-30px);opacity:0}22%{opacity:.34}78%{opacity:.26}100%{transform:translateY(76px);opacity:0}}
@keyframes surface{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
div::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<div id="bench"></div>
<script type="text/babel">
const {useState,useRef,useEffect,useMemo,useCallback}=React;
const S=()=>window.FieldSound;
function hexA(h,a){return h+Math.round(Math.max(0,Math.min(1,a))*255).toString(16).padStart(2,'0');}

/* ── today, as it stands ─────────────────────────────────────── */
const TODAY={room:'The Garden',glyph:'◆',color:'#4A9E6B',pace:11,title:'The Smile While Making Eggs'};
const DAWN='#C9A07A', ASH='#C47A52', BINDU='#E5533C';

/* the five kinds that wait at a met door — weighted, never doubling */
const KINDS=[
  {k:'threshold',w:40,label:'A Threshold',accent:DAWN,italic:true,body:'You are not late.\nThe field kept your place.'},
  {k:'practice',w:23,label:'A Practice',accent:'#8C96B8',body:'Before you read — one breath.\nLet it be longer than you need.',sub:'in… and out.'},
  {k:'seed',w:20,label:'A Gaia Seed',accent:'#4A9E6B',body:'Your body knew the weather\nbefore you did.\nWhat is it today?'},
  {k:'found',w:12,label:'What Found You',accent:'#4A9E6B',story:{title:'The Smile While Making Eggs',line:'It arrived before the reason for it. Then the reason never came.',room:'The Garden',color:'#4A9E6B',glyph:'◆',codex:'C-1047'}},
  {k:'bindu',w:5,label:'',accent:BINDU,bindu:true},
];
function pickKind(prev){const pool=KINDS.filter(x=>x.k!==prev);let t=pool.reduce((s,x)=>s+x.w,0),r=Math.random()*t;for(const x of pool){if((r-=x.w)<=0)return x;}return pool[pool.length-1];}

/* ── the marks. Each surface is drawn in its own hand — no shared glyph set ── */
function RiteMark({c,pace}){return <span style={{fontSize:15,color:c,animation:`glyphBreath ${pace}s ease-in-out infinite`,display:'block'}}>{TODAY.glyph}</span>;}
function RoomsMark({c}){/* thirteen ways in — thirteen dots, one still dim */
  return <div style={{display:'grid',gridTemplateColumns:'repeat(4,3px)',gap:3,animation:'breathSoft 17s ease-in-out infinite'}}>
    {Array.from({length:13}).map((_,i)=><span key={i} style={{width:3,height:3,borderRadius:3,background:c,opacity:i===11?0.22:0.62}}></span>)}
  </div>;}
function ArchiveMark({c}){/* strata — everything, as it stands */
  return <div style={{display:'flex',flexDirection:'column',gap:3,width:16,animation:'breathSoft 21s ease-in-out infinite'}}>
    {[0.7,0.5,0.34,0.2].map((o,i)=><span key={i} style={{height:1,background:c,opacity:o}}></span>)}
  </div>;}
function UniverseMark({c}){/* a sky — a scattering of light, one nearer */
  const pts=[[1,3,1,.32],[6,1,1,.5],[10,5,1,.28],[4,8,1.4,.8],[13,9,1,.4],[8,12,1,.26],[2,13,1,.34]];
  return <div style={{position:'relative',width:16,height:16,animation:'breathSoft 26s ease-in-out infinite'}}>
    {pts.map((p,i)=><span key={i} style={{position:'absolute',left:p[0],top:p[1],width:p[2]*1.6,height:p[2]*1.6,borderRadius:4,background:c,opacity:p[3],boxShadow:p[2]>1?`0 0 5px ${hexA(c,.7)}`:'none'}}></span>)}
  </div>;}
function LightMark({c}){/* the shaft, widening as it falls */
  return <div style={{width:14,height:16,display:'flex',justifyContent:'center',animation:'breathSoft 13s ease-in-out infinite'}}>
    <div style={{width:0,height:0,borderLeft:'4px solid transparent',borderRight:'4px solid transparent',borderTop:`16px solid ${hexA(c,.55)}`}}></div>
  </div>;}
function PointMark({c}){/* the particle. Never explained. */
  return <span style={{width:6,height:6,borderRadius:6,background:c,boxShadow:`0 0 12px ${hexA(c,.85)}`,animation:'ember 10s ease-in-out infinite',display:'block'}}></span>;}
function PlayersMark({c}){/* two lenses, overlapping */
  return <div style={{position:'relative',width:18,height:12,animation:'breathSoft 19s ease-in-out infinite'}}>
    <span style={{position:'absolute',left:0,top:0,width:11,height:11,borderRadius:11,border:`1px solid ${hexA(c,.6)}`}}></span>
    <span style={{position:'absolute',left:6,top:0,width:11,height:11,borderRadius:11,border:`1px solid ${hexA(c,.34)}`}}></span>
  </div>;}
function ArriveMark({c}){return <span style={{fontSize:13,color:c,animation:'glyphBreath 15s ease-in-out infinite',display:'block'}}>◉</span>;}

/* ── the turn ─────────────────────────────────────────────────── */
const ROWS=[
  {id:'rite',   name:'The Rite',     sub:'today’s meeting',              c:TODAY.color, hz:220, mark:(c)=><RiteMark c={c} pace={TODAY.pace}/>, href:'The Rite v3.html', unmetOnly:true},
  {id:'rooms',  name:'The Rooms',    sub:'thirteen ways in',             c:'#B9AEA2',   hz:146, mark:(c)=><RoomsMark c={c}/>,   href:'Room Selection.html'},
  {id:'archive',name:'The Archive',  sub:'everything, as it stands',     c:'#A9A29B',   hz:261, mark:(c)=><ArchiveMark c={c}/>, href:'Home Feed.html'},
  {id:'universe',name:'The Universe',sub:'the whole of it, from above',  c:'#9FB2C4',   hz:285, mark:(c)=><UniverseMark c={c}/>,z:-4},
  {id:'light',  name:'The Light',    sub:'the future, already underway', c:'#EDE3CE',   hz:174, mark:(c)=><LightMark c={c}/>,   z:-5},
  {id:'point',  name:'The Point',    sub:'everything you know, arranged',c:'#C0392B',   hz:174, mark:(c)=><PointMark c={c}/>,   z:1},
  {id:'players',name:'The Players',  sub:'the lenses that read',         c:'#3AADA8',   hz:196, mark:(c)=><PlayersMark c={c}/>, href:'Players View.html'},
  {id:'arrive', name:'How You Arrive',sub:'name, colour, mark',          c:ASH,         hz:261, mark:(c)=><ArriveMark c={c}/>,  href:'Settings.html'},
];

function Turn({weather,onClose,onGo}){
  const [vis,setVis]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setVis(true),40);return()=>clearTimeout(t);},[]);
  const rows=ROWS.filter(r=>!(r.unmetOnly&&weather!=='unmet'));
  return <div onPointerDown={onClose} style={{position:'absolute',inset:0,zIndex:40,cursor:'pointer',
    background:'rgba(8,7,11,0.80)',backdropFilter:'blur(22px) saturate(120%)',WebkitBackdropFilter:'blur(22px) saturate(120%)',
    opacity:vis?1:0,transition:'opacity 0.42s ease',display:'flex',flexDirection:'column',justifyContent:'center',padding:'0 34px'}}>
    <span style={{fontFamily:'Space Mono,monospace',fontSize:10,letterSpacing:'0.34em',color:'var(--ink35)',marginBottom:30,
      opacity:vis?1:0,transition:'opacity 0.7s ease 0.1s'}}>WHERE TO</span>
    <div style={{display:'flex',flexDirection:'column',gap:2}}>
      {rows.map((r,i)=>{
        const dim=!r.href&&r.z===undefined;
        return <div key={r.id} onPointerDown={(e)=>{e.stopPropagation();onGo(r);}}
          style={{display:'flex',alignItems:'center',gap:16,padding:'13px 0',
            opacity:vis?(dim?0.42:1):0,transform:vis?'translateY(0)':'translateY(7px)',
            transition:`opacity 0.62s ease ${0.14+i*0.075}s, transform 0.62s ease ${0.14+i*0.075}s`}}>
          <div style={{width:20,display:'flex',justifyContent:'center',alignItems:'center',flexShrink:0}}>{r.mark(r.c)}</div>
          <div style={{display:'flex',flexDirection:'column',gap:3,minWidth:0}}>
            <span style={{fontFamily:'Lora,serif',fontSize:19,fontWeight:500,color:dim?'var(--ink60)':'var(--ink)',letterSpacing:'-0.012em',whiteSpace:'nowrap',lineHeight:1.1}}>{r.name}</span>
            <span style={{fontFamily:'Lora,serif',fontStyle:'italic',fontSize:13,color:hexA(r.c,dim?0.42:0.72),whiteSpace:'nowrap',lineHeight:1.2}}>{r.sub}</span>
          </div>
        </div>;
      })}
    </div>
    <span style={{position:'absolute',left:0,right:0,bottom:44,textAlign:'center',fontFamily:'Space Mono,monospace',fontSize:9,
      letterSpacing:'0.2em',textTransform:'uppercase',color:'var(--ink35)',animation:'hint 6s ease-in-out infinite',
      opacity:vis?1:0,transition:'opacity 0.9s ease 0.7s'}}>tap anywhere to stay</span>
  </div>;
}

/* ── the rope ─────────────────────────────────────────────────── */
function Rope({onExit}){
  const [phase,setPhase]=useState(0); // 0,1 = the two breaths · 2 = the line
  const t=useRef([]);
  useEffect(()=>{
    S()&&S().voice('bindu',110,9);
    t.current.push(setTimeout(()=>setPhase(1),10000));
    t.current.push(setTimeout(()=>setPhase(2),20000));
    return()=>t.current.forEach(clearTimeout);
  },[]);
  function skip(){ if(phase<2){t.current.forEach(clearTimeout);t.current=[];setPhase(2);} }
  return <div onPointerDown={skip} style={{position:'absolute',inset:0,zIndex:60,background:'#000',cursor:'pointer',
    display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 40px',animation:'surface 1.1s ease both'}}>
    <div style={{position:'relative',width:120,height:120,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:phase===2?46:0,transition:'margin 1.6s ease'}}>
      <span style={{position:'absolute',width:110,height:110,borderRadius:110,border:`1px solid ${hexA(BINDU,0.16)}`,animation:'breath 10s ease-in-out infinite'}}></span>
      <span style={{width:9,height:9,borderRadius:9,background:BINDU,boxShadow:`0 0 30px ${hexA(BINDU,0.9)}`,animation:'ember 10s ease-in-out infinite'}}></span>
    </div>
    {phase===2&&<>
      <p style={{fontFamily:'Lora,serif',fontSize:19,lineHeight:1.68,color:'var(--ink)',textAlign:'center',maxWidth:300,textWrap:'pretty',
        animation:'surface 2.6s ease both'}}>You exist. This pressure is the chamber working, not you failing. One breath at this pace is already boarding.</p>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:22,marginTop:44,animation:'surface 2.4s ease 1.6s both'}}>
        <span onPointerDown={(e)=>{e.stopPropagation();onExit('point');}} style={{fontFamily:'Space Mono,monospace',fontSize:11,letterSpacing:'0.2em',textTransform:'uppercase',color:hexA('#C0392B',0.9)}}>walk the point</span>
        <span onPointerDown={(e)=>{e.stopPropagation();onExit('day');}} style={{fontFamily:'Space Mono,monospace',fontSize:11,letterSpacing:'0.2em',textTransform:'uppercase',color:'var(--ink60)'}}>return to the day</span>
      </div>
    </>}
  </div>;
}

/* ── the air. Unmet: it rises. Met: it settles. ───────────────── */
function Dust({mode,color}){
  const seeds=useMemo(()=>Array.from({length:15}).map(()=>({x:Math.random()*100,y:16+Math.random()*70,d:26+Math.random()*30,delay:-Math.random()*40,s:Math.random()<0.25?2:1})),[]);
  return <div style={{position:'absolute',inset:0,pointerEvents:'none',zIndex:1}}>
    {seeds.map((p,i)=><span key={i} style={{position:'absolute',left:p.x+'%',top:p.y+'%',width:p.s,height:p.s,borderRadius:2,
      background:mode==='unmet'?hexA(color,0.9):'rgba(237,232,227,0.7)',
      animation:`${mode==='unmet'?'rise':'settle'} ${p.d}s linear ${p.delay}s infinite`}}></span>)}
  </div>;
}

/* ── the crossing is a blink. The turn is a dissolve. ─────────── */
function Blink({on,glint}){
  return <div style={{position:'absolute',inset:0,zIndex:70,pointerEvents:'none'}}>
    <div style={{position:'absolute',left:0,right:0,top:0,height:on?'50%':0,background:'#000',transition:'height 0.66s cubic-bezier(.62,.02,.4,1)'}}></div>
    <div style={{position:'absolute',left:0,right:0,bottom:0,height:on?'50%':0,background:'#000',transition:'height 0.66s cubic-bezier(.62,.02,.4,1)'}}></div>
    <div style={{position:'absolute',left:0,right:0,top:'50%',height:1,background:`linear-gradient(90deg,transparent,${hexA(glint,0.8)},transparent)`,
      opacity:on?1:0,transition:'opacity 0.5s ease 0.3s'}}></div>
  </div>;
}

/* ── the content of a met door ────────────────────────────────── */
function MetBody({kind}){
  if(kind.bindu) return <span style={{fontSize:76,lineHeight:1,color:BINDU,filter:`drop-shadow(0 0 34px ${hexA(BINDU,0.7)})`,animation:'ember 10s ease-in-out infinite',display:'block'}}>·</span>;
  if(kind.story){const s=kind.story;
    return <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:20}}>
      <div style={{display:'inline-flex',alignItems:'center',gap:6,background:hexA(s.color,0.09),border:`1px solid ${hexA(s.color,0.22)}`,borderRadius:100,padding:'4px 12px 4px 9px'}}>
        <span style={{fontSize:11,color:s.color}}>{s.glyph}</span>
        <span style={{fontFamily:'Lora,serif',fontSize:12,color:s.color,whiteSpace:'nowrap'}}>{s.room}</span>
      </div>
      <h2 style={{fontFamily:'Lora,serif',fontWeight:500,fontSize:25,lineHeight:1.3,color:'var(--ink)',textAlign:'center',letterSpacing:'-0.012em',textWrap:'pretty'}}>{s.title}</h2>
      <p style={{fontFamily:'Lora,serif',fontStyle:'italic',fontSize:15,lineHeight:1.7,color:'var(--ink60)',textAlign:'center',maxWidth:290,textWrap:'pretty'}}>“{s.line}”</p>
      <span style={{fontFamily:'Space Mono,monospace',fontSize:10,color:'var(--ink35)',letterSpacing:'0.06em'}}>{s.codex}</span>
    </div>;}
  return <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:22}}>
    <p style={{fontFamily:'Lora,serif',fontStyle:kind.italic?'italic':'normal',fontWeight:kind.italic?400:500,fontSize:26,lineHeight:1.5,
      color:'var(--ink)',textAlign:'center',maxWidth:300,textWrap:'balance',whiteSpace:'pre-line'}}>{kind.body}</p>
    {kind.sub&&<span style={{fontFamily:'Lora,serif',fontStyle:'italic',fontSize:14,color:hexA(kind.accent,0.7),letterSpacing:'0.05em'}}>{kind.sub}</span>}
  </div>;
}

/* ── THE DOOR ─────────────────────────────────────────────────── */
function Door({weather,setWeather}){
  const [kind,setKind]=useState(()=>KINDS[0]);
  const [vis,setVis]=useState(false);
  const [overlay,setOverlay]=useState(null);      // 'turn' | 'rope'
  const [blink,setBlink]=useState(null);          // {glint,href}
  const [pull,setPull]=useState(0);
  const started=useRef(false), press=useRef(null), origin=useRef(null), moved=useRef(false), busy=useRef(false);

  useEffect(()=>{setVis(false);const t=setTimeout(()=>setVis(true),90);return()=>clearTimeout(t);},[weather,kind]);
  useEffect(()=>{if(weather==='met')setKind(k=>pickKind(k.k));},[weather]);

  const wake=useCallback(()=>{if(started.current||!S())return;started.current=true;S().startBed(110,10);S().setMuted(false);},[]);

  function cross(){
    if(busy.current)return; busy.current=true; wake();
    const unmet=weather==='unmet';
    S()&&S().threshold(unmet?220:261,5);
    setBlink({glint:unmet?TODAY.color:DAWN});
    setTimeout(()=>{window.location.href=unmet?'The Rite v3.html':'Home Feed.html';},780);
  }
  function go(r){
    /* three of these rows are not documents at all — they are depths on the
       one axis. The list never says which; it shows it. */
    if(r.z!==undefined){
      busy.current=true; S()&&S().threshold(r.hz,5);
      setBlink({glint:r.c});
      setTimeout(()=>{window.location.href='The Instrument v3.html?z='+r.z;},780);
      return;
    }
    if(!r.href){S()&&S().threshold(285,4);return;}   // not yet a place. Force is absorbed.
    busy.current=true; S()&&S().threshold(r.hz,5);
    setBlink({glint:r.c});
    setTimeout(()=>{window.location.href=r.href;},780);
  }
  function openTurn(){wake();S()&&S().threshold(146,4);setOverlay('turn');setPull(0);}

  function down(e){
    if(busy.current||overlay)return;
    wake(); moved.current=false; origin.current={y:e.clientY,t:Date.now()};
    press.current=setTimeout(()=>{press.current=null;setOverlay('rope');},1100);
  }
  function move(e){
    if(!origin.current||overlay)return;
    const dy=e.clientY-origin.current.y;
    if(Math.abs(dy)>7&&press.current){clearTimeout(press.current);press.current=null;moved.current=true;}
    if(dy>0){setPull(Math.min(dy,120)); if(dy>84){origin.current=null;setPull(0);openTurn();}}
  }
  function up(){
    if(press.current){clearTimeout(press.current);press.current=null;if(!moved.current&&!overlay)cross();}
    origin.current=null; setPull(0);
  }

  const lit = weather==='unmet' ? TODAY.color : DAWN;
  const pulled = pull/120;

  return <div style={{position:'relative',width:393,height:852,borderRadius:46,overflow:'hidden',background:weather==='unmet'?'#08070C':'#0B0910',
    boxShadow:'0 30px 90px rgba(0,0,0,0.65)',userSelect:'none',WebkitTapHighlightColor:'transparent',touchAction:'none'}}>

    {/* THE WEATHER — unmet: light from above the fold, not yet risen.
        met: the light has passed; warmth low and behind, the day’s room-colour lingering. */}
    {weather==='unmet'?<>
      <div style={{position:'absolute',inset:0,pointerEvents:'none',
        background:`radial-gradient(ellipse 140% 50% at 50% -8%, ${hexA(TODAY.color,0.36)} 0%, ${hexA(TODAY.color,0.10)} 42%, transparent 74%)`,
        animation:'breath 10s ease-in-out infinite'}}></div>
      <div style={{position:'absolute',left:0,right:0,top:0,height:1,pointerEvents:'none',
        background:`linear-gradient(90deg,transparent,${hexA(TODAY.color,0.5)},transparent)`,animation:'breathSoft 10s ease-in-out infinite'}}></div>
      <div style={{position:'absolute',inset:0,pointerEvents:'none',
        background:`radial-gradient(ellipse 160% 30% at 50% 116%, rgba(12,10,16,0.9) 0%, transparent 60%)`}}></div>
    </>:<>
      <div style={{position:'absolute',inset:0,pointerEvents:'none',
        background:`radial-gradient(ellipse 96% 74% at 50% 46%, transparent 34%, ${hexA('#08050A',0.6)} 100%)`}}></div>
      <div style={{position:'absolute',inset:0,pointerEvents:'none',
        background:`radial-gradient(ellipse 150% 40% at 50% 106%, ${hexA(DAWN,0.26)} 0%, ${hexA('#8A5A3C',0.11)} 38%, transparent 70%)`,
        animation:'breath 10s ease-in-out infinite'}}></div>
      <div style={{position:'absolute',inset:0,pointerEvents:'none',
        background:`radial-gradient(ellipse 118% 40% at 50% 14%, ${hexA(TODAY.color,0.08)} 0%, transparent 62%)`}}></div>
    </>}
    <Dust mode={weather} color={TODAY.color}/>

    {/* status bar */}
    <div style={{position:'relative',zIndex:8,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'15px 30px 0'}}>
      <span style={{fontFamily:'-apple-system,system-ui',fontWeight:600,fontSize:15,color:'#fff',opacity:0.85}}>{weather==='unmet'?'6:12':'21:40'}</span>
      <div style={{position:'absolute',top:12,left:'50%',transform:'translateX(-50%)',width:112,height:30,borderRadius:20,background:'#000'}}></div>
      <span style={{color:'#fff',fontSize:12,letterSpacing:'0.04em',opacity:0.85}}>􀙇 􀛨 􀋦</span>
    </div>

    {/* the dot mark — the turn lives here, and it is the particle */}
    <div onPointerDown={(e)=>{e.stopPropagation();openTurn();}} style={{position:'absolute',top:62,left:26,zIndex:9,padding:8,cursor:'pointer',
      display:'grid',gridTemplateColumns:'repeat(2,3px)',gap:4,opacity:0.34,animation:'breathSoft 14s ease-in-out infinite'}}>
      {[0,1,2,3].map(i=><span key={i} style={{width:3,height:3,borderRadius:3,background:i===0?BINDU:'var(--ink)'}}></span>)}
    </div>

    {/* the field of the door */}
    <div onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
      style={{position:'absolute',inset:0,zIndex:3,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
        padding:'0 32px',transform:`translateY(${pulled*10}px)`,opacity:1-pulled*0.35,transition:pull?'none':'transform 0.5s ease, opacity 0.5s ease'}}>

      {weather==='unmet'?<div style={{display:'flex',flexDirection:'column',alignItems:'center',
        opacity:vis?1:0,transform:vis?'translateY(0)':'translateY(10px)',transition:'opacity 2.2s ease, transform 2.2s ease'}}>
        <span style={{fontSize:30,color:TODAY.color,animation:`glyphBreath ${TODAY.pace}s ease-in-out infinite`,marginBottom:40,
          filter:`drop-shadow(0 0 22px ${hexA(TODAY.color,0.45)})`}}>{TODAY.glyph}</span>
        <p style={{fontFamily:'Lora,serif',fontSize:27,lineHeight:1.46,color:'var(--ink)',textAlign:'center',maxWidth:300,textWrap:'balance',letterSpacing:'-0.006em'}}>One story has come to meet you.</p>
        <p style={{fontFamily:'Lora,serif',fontStyle:'italic',fontSize:16,lineHeight:1.6,color:'var(--ink60)',textAlign:'center',maxWidth:280,marginTop:20,textWrap:'balance'}}>It is not complete until you meet it.</p>
      </div>
      :<div style={{opacity:vis?1:0,transform:vis?'translateY(0)':'translateY(8px)',transition:'opacity 1.8s ease, transform 1.8s ease'}}>
        {kind.label&&<div style={{textAlign:'center',marginBottom:36}}><span style={{fontFamily:'Space Mono,monospace',fontSize:10,color:hexA(kind.accent,0.6),letterSpacing:'0.24em',textTransform:'uppercase'}}>{kind.label}</span></div>}
        <MetBody kind={kind}/>
      </div>}
    </div>

    {/* the base line */}
    <div style={{position:'absolute',left:0,right:0,bottom:0,zIndex:5,display:'flex',justifyContent:'center',paddingBottom:36,pointerEvents:'none'}}>
      <span style={{fontFamily:'Space Mono,monospace',fontSize:9,letterSpacing:'0.18em',textTransform:'uppercase',
        color:weather==='unmet'?hexA(TODAY.color,0.62):'var(--ink35)',animation:'hint 6s ease-in-out infinite',
        opacity:vis?1:0,transition:'opacity 1.4s ease 0.6s'}}>{weather==='unmet'?'touch to receive':'tap anywhere to cross'}</span>
    </div>

    {overlay==='turn'&&<Turn weather={weather} onClose={()=>setOverlay(null)} onGo={(r)=>{setOverlay(null);go(r);}}/>}
    {overlay==='rope'&&<Rope onExit={(w)=>{setOverlay(null);if(w==='point')go(ROWS.find(r=>r.id==='point'));}}/>}
    <Blink on={!!blink} glint={blink?blink.glint:'#fff'}/>

    {/* home indicator */}
    <div style={{position:'absolute',bottom:0,left:0,right:0,zIndex:8,height:30,display:'flex',justifyContent:'center',alignItems:'flex-end',paddingBottom:9,pointerEvents:'none'}}>
      <div style={{width:134,height:5,borderRadius:100,background:'rgba(255,255,255,0.7)'}}></div>
    </div>
  </div>;
}

function App(){
  const [weather,setWeather]=useState('unmet');
  useEffect(()=>{window.__setWeather=setWeather;},[]);
  return <Door weather={weather} setWeather={setWeather}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

/* the bench — outside the phone. Review controls never ship. */
(function bench(){
  const b=document.getElementById('bench');
  b.style.cssText='display:flex;gap:18px;align-items:center;padding:14px 4px 0;font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(237,232,227,.28)';
  b.innerHTML='<span>the bench</span>';
  [['unmet day','unmet'],['met day','met']].forEach(([label,w])=>{
    const s=document.createElement('span'); s.textContent=label; s.style.cssText='cursor:pointer;border-bottom:1px solid rgba(237,232,227,.14);padding-bottom:2px';
    s.onclick=()=>window.__setWeather&&window.__setWeather(w); b.appendChild(s);
  });
  const r=document.createElement('span'); r.textContent='the rope · long-press the door'; r.style.opacity='.6'; b.appendChild(r);
  const t=document.createElement('span'); t.textContent='the turn · dot mark or slow pull down'; t.style.opacity='.6'; b.appendChild(t);
})();

(function fit(){
  const stage=document.getElementById('stage');
  function apply(){const s=Math.min(1,(window.innerHeight-90)/852,(window.innerWidth-36)/393);stage.style.transform=`scale(${s})`;stage.style.transformOrigin='center center';}
  apply();window.addEventListener('resize',apply);
})();
</script>
</body>
</html>
