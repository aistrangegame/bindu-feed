<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Strange Feed — The Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Space+Mono&display=swap" rel="stylesheet">
<script>
/* ── field-sound.js, inlined — kept as its own file for the port and for reading
   on its own, but inlined here so the page never depends on a subresource
   fetch to render. Do not edit here; edit field-sound.js. ── */
/* FIELD SOUND — the ceremonial sound layer.
   Generated, never recorded. Nothing samples; nothing loops.
   Names mirror the app's Sound/ layer so the Swift port maps 1:1:
   SonicContext (bed) · BreathVoice (per-presence) · ThresholdTone (transitions).
   Felt, not heard: the ceiling is deliberately low. Muting is a fade, never a cut. */
(function(global){
'use strict';
var CEIL=0.55;
var reduced=global.matchMedia&&global.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Per-presence timbre. Each voice is the same field heard from one angle —
   same tuning as the bed, differing only in body and behaviour. */
var CHAR={
  bindu:{wave:'sine',partials:[1,2,3],gain:0.055,atk:0.6,rel:5.0,flicker:6.2,pan:0},
  neev:{wave:'sine',partials:[0.5,1],gain:0.07,atk:3.4,rel:8.0,pan:-0.15},
  gaia:{wave:'triangle',partials:[1,1.5],gain:0.05,atk:1.6,rel:6.0,pan:-0.3},
  sid:{wave:'sine',partials:[1,1.2],gain:0.05,atk:1.2,rel:6.5,pan:0.25},
  arch:{wave:'triangle',partials:[1,2],gain:0.048,atk:0.9,rel:4.5,vib:4.6,pan:0.35},
  shweta:{wave:'sine',partials:[1],gain:0.012,atk:4.0,rel:9.0,air:0.028,pan:0},
  karishma:{wave:'sine',partials:[1,2,3.02],gain:0.036,atk:2.0,rel:7.0,shimmer:true,pan:0.4},
  sakshi:{wave:'sine',partials:[1],gain:0.026,atk:5.0,rel:10.0,pan:-0.4},
  ashrey:{wave:'sine',partials:[1,2],gain:0.042,atk:1.4,rel:6.0,pan:0.15},
  lalita:{wave:'sine',partials:[1,1.5],gain:0.04,atk:2.2,rel:8.0,gliss:1.02,pan:0},
  ash:{wave:'sine',partials:[1,2,4],gain:0.05,atk:1.0,rel:5.5,pan:0}
};
/* Each presence's own frequency — the tone it sounds as it takes the field. */
var HZ={bindu:110,neev:82,gaia:146,sid:174,arch:220,shweta:329,karishma:392,sakshi:285,ashrey:196,lalita:396,ash:261};

var FieldSound={
  ctx:null,master:null,bus:null,bed:null,bedFilter:null,bedLfo:null,
  muted:true,aged:false,inkNode:null,ringStep:0,

  init:function(){
    if(this.ctx)return;
    var C=global.AudioContext||global.webkitAudioContext; if(!C)return;
    this.ctx=new C();
    this.master=this.ctx.createGain(); this.master.gain.value=0;
    this.bus=this.ctx.createGain(); this.bus.gain.value=1;
    var conv=this.ctx.createConvolver(); conv.buffer=this._air(3.6,0.34);
    var wet=this.ctx.createGain(); wet.gain.value=0.5;
    this.bus.connect(this.master); this.bus.connect(conv); conv.connect(wet); wet.connect(this.master);
    this.master.connect(this.ctx.destination);
  },
  _air:function(secs,decay){
    var sr=this.ctx.sampleRate,len=Math.floor(sr*secs),b=this.ctx.createBuffer(2,len,sr);
    for(var ch=0;ch<2;ch++){var d=b.getChannelData(ch);
      for(var i=0;i<len;i++){var t=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-t,1/decay)*0.6;}}
    return b;
  },
  _pan:function(v){ if(!this.ctx.createStereoPanner)return null; var p=this.ctx.createStereoPanner(); p.pan.value=v||0; return p; },

  /* the bed: room-tuned breath drone, swelling on the room's own pace */
  startBed:function(rootHz,breathSecs){
    rootHz=rootHz||110; breathSecs=breathSecs||10;
    this.init(); if(!this.ctx)return;
    if(this.ctx.state==='suspended')this.ctx.resume();
    if(this.bed)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.value=0.030;
    var f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; f.Q.value=0.6;
    var root=this.ctx.createOscillator(); root.type='sine'; root.frequency.value=rootHz;
    var fifth=this.ctx.createOscillator(); fifth.type='sine'; fifth.frequency.value=rootHz*1.5;
    var fg=this.ctx.createGain(); fg.gain.value=0.16;
    var lfo=this.ctx.createOscillator(); lfo.frequency.value=1/Math.max(2,breathSecs);
    var lg=this.ctx.createGain(); lg.gain.value=0.014;
    lfo.connect(lg); lg.connect(g.gain);
    root.connect(f); fifth.connect(fg); fg.connect(f); f.connect(g); g.connect(this.bus);
    root.start(t); fifth.start(t); lfo.start(t);
    this.bed={root:root,fifth:fifth,g:g,rootHz:rootHz}; this.bedFilter=f; this.bedLfo=lfo;
    this.apply();
  },

  /* patina — the same bed, aged. The Return opens here. */
  agedBed:function(rootHz,breathSecs){
    rootHz=rootHz||84; breathSecs=breathSecs||13;
    this.startBed(rootHz,breathSecs);
    if(!this.ctx||this.aged)return; this.aged=true;
    var t=this.ctx.currentTime;
    this.bedFilter.frequency.linearRampToValueAtTime(430,t+6);       // warmth closes in
    this.bed.root.frequency.linearRampToValueAtTime(rootHz*0.996,t+8); // settles a few cents flat
    this.bed.fifth.frequency.linearRampToValueAtTime(rootHz*1.5*0.994,t+8);
    if(this.bedLfo)this.bedLfo.frequency.linearRampToValueAtTime(1/(breathSecs*1.35),t+6);
    var w=this.ctx.createOscillator(); w.frequency.value=0.07;        // slow tape wobble
    var wg=this.ctx.createGain(); wg.gain.value=0.9;
    w.connect(wg); wg.connect(this.bed.root.frequency); w.start(t);
  },

  apply:function(){ if(this.master&&this.ctx)this.master.gain.linearRampToValueAtTime(this.muted?0:CEIL,this.ctx.currentTime+1.4); },
  setMuted:function(m){ this.muted=m; if(this.ctx){ if(!m&&this.ctx.state==='suspended')this.ctx.resume(); this.apply(); } },

  /* BreathVoice — a presence takes the field */
  voice:function(key,hz,dur){
    if(!this.ctx||this.muted||reduced)return;
    var c=CHAR[key]||CHAR.ash, self=this;
    hz=hz||HZ[key]||220;
    var t=this.ctx.currentTime, life=dur||(c.atk+c.rel);
    var vg=this.ctx.createGain(); vg.gain.setValueAtTime(0,t);
    vg.gain.linearRampToValueAtTime(c.gain,t+c.atk);
    vg.gain.linearRampToValueAtTime(0,t+life);
    var pan=this._pan(c.pan);
    if(pan){vg.connect(pan);pan.connect(this.bus);}else vg.connect(this.bus);
    c.partials.forEach(function(mult,i){
      var o=self.ctx.createOscillator(); o.type=c.wave; o.frequency.value=hz*mult;
      var pg=self.ctx.createGain(); pg.gain.value=1/(i+1.6);
      o.connect(pg); pg.connect(vg);
      if(c.gliss&&i===1)o.frequency.linearRampToValueAtTime(hz*mult*c.gliss,t+life);
      if(c.vib){var v=self.ctx.createOscillator(); v.frequency.value=c.vib;
        var vgn=self.ctx.createGain(); vgn.gain.value=hz*0.006;
        v.connect(vgn); vgn.connect(o.frequency); v.start(t); v.stop(t+life+0.2);}
      o.start(t); o.stop(t+life+0.2);
    });
    if(c.flicker){ // Bindu: the ember, alive
      var fl=this.ctx.createOscillator(); fl.frequency.value=c.flicker;
      var fg=this.ctx.createGain(); fg.gain.value=c.gain*0.45;
      fl.connect(fg); fg.connect(vg.gain); fl.start(t); fl.stop(t+life+0.2);
    }
    if(c.air){ // Shweta: the gap the sound moves through
      var n=this.ctx.createBufferSource(); n.buffer=this._air(life,0.9);
      var nf=this.ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=hz*4; nf.Q.value=0.7;
      var ng=this.ctx.createGain(); ng.gain.setValueAtTime(0,t);
      ng.gain.linearRampToValueAtTime(c.air,t+c.atk); ng.gain.linearRampToValueAtTime(0,t+life);
      n.connect(nf); nf.connect(ng); ng.connect(this.bus); n.start(t);
    }
    if(c.shimmer){ // Karishma: grace, arriving from above
      var s=this.ctx.createOscillator(); s.type='sine'; s.frequency.value=hz*6;
      var sg=this.ctx.createGain(); sg.gain.setValueAtTime(0,t);
      sg.gain.linearRampToValueAtTime(c.gain*0.18,t+c.atk*1.6);
      sg.gain.linearRampToValueAtTime(0,t+life);
      s.connect(sg); sg.connect(this.bus); s.start(t); s.stop(t+life+0.2);
    }
    if(this.bed){ // the bed steps back while a voice speaks, then returns
      var bg=this.bed.g.gain; bg.cancelScheduledValues(t);
      bg.linearRampToValueAtTime(0.018,t+c.atk);
      bg.linearRampToValueAtTime(0.030,t+life+1.6);
    }
  },

  /* ThresholdTone — one movement gives way to the next */
  threshold:function(hz,dur){
    hz=hz||198; dur=dur||5;
    if(!this.ctx||this.muted||reduced)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.032,t+dur*0.42);
    g.gain.linearRampToValueAtTime(0,t+dur);
    var o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=hz;
    var o2=this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=hz*2.002;
    var g2=this.ctx.createGain(); g2.gain.value=0.22;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.bus);
    o.start(t); o2.start(t); o.stop(t+dur+0.1); o2.stop(t+dur+0.1);
  },

  /* the Bowl — struck once, a long room. The bed holds its breath. */
  bowl:function(hz){
    hz=hz||220;
    if(!this.ctx||this.muted)return;
    var t=this.ctx.currentTime,dur=11,self=this;
    var g=this.ctx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.075,t+0.09);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    [1,2.004,2.98,4.02].forEach(function(m,i){
      var o=self.ctx.createOscillator(); o.type='sine'; o.frequency.value=hz*m;
      var pg=self.ctx.createGain(); pg.gain.value=1/(i*2.2+1);
      o.connect(pg); pg.connect(g); o.start(t); o.stop(t+dur);
    });
    g.connect(this.bus);
    if(this.bed){var bg=this.bed.g.gain; bg.cancelScheduledValues(t);
      bg.linearRampToValueAtTime(0.006,t+1.2); bg.linearRampToValueAtTime(0.030,t+9);}
  },

  /* a ring forms — each return lands one step further up the series */
  ring:function(step){
    if(!this.ctx||this.muted)return;
    var n=typeof step==='number'?step:++this.ringStep;
    var base=(this.bed&&this.bed.rootHz)||84;
    var R=[2,3,4,4.5,6,8], hz=base*R[Math.min(n,R.length-1)];
    var t=this.ctx.currentTime,dur=9;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.036,t+3.2);  // grows outward; never strikes
    g.gain.linearRampToValueAtTime(0.020,t+6);
    g.gain.linearRampToValueAtTime(0,t+dur);
    var o=this.ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(hz*0.985,t);
    o.frequency.linearRampToValueAtTime(hz,t+4);  // settles into tune as it lands
    var o2=this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=hz*1.5;
    var g2=this.ctx.createGain(); g2.gain.value=0.14;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.bus);
    o.start(t); o2.start(t); o.stop(t+dur); o2.stop(t+dur);
  },

  /* ink — while you write, the field leans in. A held tone, never clicks. */
  inkOn:function(hz){
    if(!this.ctx||this.muted||this.inkNode||reduced)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.014,t+2.4);
    var o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=hz||174;
    var f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=600;
    o.connect(f); f.connect(g); g.connect(this.bus); o.start(t);
    this.inkNode={o:o,g:g};
  },
  inkTouch:function(){
    if(!this.inkNode||this.muted||reduced)return;
    var t=this.ctx.currentTime,g=this.inkNode.g.gain;
    g.cancelScheduledValues(t);
    g.linearRampToValueAtTime(0.022,t+0.12);
    g.linearRampToValueAtTime(0.014,t+1.1);
  },
  inkOff:function(){
    if(!this.inkNode)return;
    var t=this.ctx.currentTime,n=this.inkNode; this.inkNode=null;
    n.g.gain.cancelScheduledValues(t);
    n.g.gain.linearRampToValueAtTime(0,t+1.8);
    n.o.stop(t+2);
  },

  /* ─── THE ROOM OPENS ────────────────────────────────
     The Gathering happens in a room. The Light happens in a NAVE.
     A cathedral's whole acoustic signature is its tail — 8 seconds of
     stone giving your own sound back to you, changed. Opening this is
     the single most spatial thing the sound layer can do: the listener
     hears the size of the space before he sees it. */
  openTheRoom:function(dur){
    dur=dur||5;
    this.init(); if(!this.ctx)return;
    if(!this.nave){
      var c=this.ctx.createConvolver(); c.buffer=this._air(8.5,0.62);   // the long stone tail
      var w=this.ctx.createGain(); w.gain.value=0;
      var pre=this.ctx.createBiquadFilter(); pre.type='highpass'; pre.frequency.value=180;
      this.bus.connect(pre); pre.connect(c); c.connect(w); w.connect(this.master);
      this.nave=w;
    }
    var t=this.ctx.currentTime;
    this.nave.gain.cancelScheduledValues(t);
    this.nave.gain.linearRampToValueAtTime(0.85,t+dur);
  },
  closeTheRoom:function(dur){
    if(!this.nave||!this.ctx)return;
    var t=this.ctx.currentTime;
    this.nave.gain.cancelScheduledValues(t);
    this.nave.gain.linearRampToValueAtTime(0,t+(dur||6));
  },

  /* ─── THE LIGHT — the photographic negative of the Gathering ───
     The Gathering FILLS: voices arrive one after another into the dark.
     The Light REMOVES. So the sound does the opposite of everything above:
     it draws in, holds, drains, strikes once, and leaves silence. */

  /* the long breath IN, and the hold. The bed rises, tightens, then stops. */
  breathIn:function(dur){
    dur=dur||6;
    this.init(); if(!this.ctx)return;
    if(this.ctx.state==='suspended')this.ctx.resume();
    if(!this.bed)this.startBed(110,10);
    if(this.muted)return;
    var t=this.ctx.currentTime;
    if(this.bedLfo)this.bedLfo.frequency.linearRampToValueAtTime(0.001,t+dur*0.7); // the breathing stops
    if(this.bedFilter)this.bedFilter.frequency.linearRampToValueAtTime(2600,t+dur); // brightens as it draws in
    var g=this.bed.g.gain; g.cancelScheduledValues(t);
    g.linearRampToValueAtTime(0.052,t+dur*0.78);   // swells
    g.linearRampToValueAtTime(0.040,t+dur);        // and holds. Does not release.
    var rise=this.ctx.createOscillator(); rise.type='sine';
    rise.frequency.setValueAtTime(this.bed.rootHz,t);
    rise.frequency.linearRampToValueAtTime(this.bed.rootHz*1.5,t+dur);
    var rg=this.ctx.createGain(); rg.gain.setValueAtTime(0,t);
    rg.gain.linearRampToValueAtTime(0.026,t+dur*0.8);
    rg.gain.linearRampToValueAtTime(0.018,t+dur);
    rise.connect(rg); rg.connect(this.bus); rise.start(t); rise.stop(t+dur+8);
    this._held=rise;
  },

  /* the veil drawn away — everything drains downward and out.
     Nothing arrives here. This is the sound of subtraction. */
  veilLift:function(dur){
    dur=dur||3;
    if(!this.ctx||this.muted)return;
    var t=this.ctx.currentTime;
    if(this.bedFilter)this.bedFilter.frequency.linearRampToValueAtTime(120,t+dur); // the room closes and goes
    if(this.bed){var g=this.bed.g.gain; g.cancelScheduledValues(t); g.linearRampToValueAtTime(0,t+dur);}
    if(this._held){var h=this._held; try{h.stop(t+dur+0.1);}catch(e){} this._held=null;}
    var n=this.ctx.createBufferSource(); n.buffer=this._air(dur,0.55);   // the texture draining
    var nf=this.ctx.createBiquadFilter(); nf.type='lowpass';
    nf.frequency.setValueAtTime(3000,t); nf.frequency.linearRampToValueAtTime(90,t+dur);
    var ng=this.ctx.createGain(); ng.gain.setValueAtTime(0.030,t); ng.gain.linearRampToValueAtTime(0,t+dur);
    n.connect(nf); nf.connect(ng); ng.connect(this.bus); n.start(t);
  },

  /* the bare light — almost nothing. A single high room-tone, barely there,
     so the silence has an edge to it. The breath cues ride on this. */
  lightBed:function(breathSecs){
    breathSecs=breathSecs||10;
    if(!this.ctx||this.muted||this.lightNode)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.012,t+6);
    var o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=528;
    var o2=this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=792;
    var g2=this.ctx.createGain(); g2.gain.value=0.3;
    var lfo=this.ctx.createOscillator(); lfo.frequency.value=1/breathSecs;
    var lg=this.ctx.createGain(); lg.gain.value=0.006;
    lfo.connect(lg); lg.connect(g.gain);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.bus);
    o.start(t); o2.start(t); lfo.start(t);
    this.lightNode={o:o,o2:o2,lfo:lfo,g:g};
  },
  lightOff:function(dur){
    if(!this.lightNode||!this.ctx)return;
    var t=this.ctx.currentTime,n=this.lightNode; this.lightNode=null;
    n.g.gain.cancelScheduledValues(t); n.g.gain.linearRampToValueAtTime(0,t+(dur||5));
    n.o.stop(t+(dur||5)+0.2); n.o2.stop(t+(dur||5)+0.2); n.lfo.stop(t+(dur||5)+0.2);
  },

  /* walking back out — the dark returns, and with it the breathing */
  darkReturns:function(){
    if(!this.ctx)return;
    var t=this.ctx.currentTime;
    this.lightOff(5);
    if(this.bedFilter)this.bedFilter.frequency.linearRampToValueAtTime(900,t+7);
    if(this.bedLfo)this.bedLfo.frequency.linearRampToValueAtTime(0.1,t+7);
    if(this.bed){var g=this.bed.g.gain; g.cancelScheduledValues(t); g.linearRampToValueAtTime(0.030,t+7);}
  },

  /* aliases the prototypes already call */
  start:function(){this.startBed();},
  startBreath:function(hz){this.startBed(hz);this.setMuted(false);},
  setOn:function(v){this.setMuted(!v);},
  tone:function(hz,dur){this.threshold(hz,dur||5);},
  seal:function(hz){this.bowl(hz);},
  hzFor:function(k){return HZ[k]||220;}
};
global.FieldSound=FieldSound;
global.Sound=FieldSound;
})(window);

</script>
<script>
/* ── uni-rooms.js, inlined — kept as its own file for the port and for reading
   on its own, but inlined here so the page never depends on a subresource
   fetch to render. Do not edit here; edit uni-rooms.js. ── */
/* THE UNIVERSE · THE THIRTEEN ─────────────────────────────────────
   Each room of the Feed is a region of sky with its OWN FORM. The form is
   not decoration behind the stars — the stars sit ON it, so the whole sky
   reads as thirteen distinct figures before anything is named.
   Each room carries four things:
     place()  the armature the stories are strung along
     arm()    that armature drawn at sky scale, alive
     field()  what it feels like INSIDE the region — its own weather
     civ      how life builds, once life has taken hold on its worlds
   Nothing here counts anything. ─────────────────────────────────── */
(function(global){
'use strict';
var TAU=Math.PI*2, BONE=[214,206,192], GOLD=Math.PI*(3-Math.sqrt(5));
function hash(n){var x=Math.sin(n*127.1+31.4)*43758.5453;return x-Math.floor(x);}
function mix(a,b,f){return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];}
function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a<0?0:a)+')';}
function hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function ring(x,cx,cy,r){x.beginPath();x.arc(cx,cy,r,0,TAU);}
var breath=function(t){return (Math.sin(t*TAU/10)+1)/2;};

/* ─── the thirteen ─────────────────────────────────────────────── */
var ROOMS=[
{id:'forge',name:'The Forge',hex:'#D4AE4A',x:-470,y:-1010,r:150,n:7,hz:294,civ:'furnaces',
 /* the tetractys — a crucible builds upward in rows */
 place:function(i,n,R){var rows=[[0],[-1,1],[-2,0,2],[-3,-1,1,3]];var f=[];
   rows.forEach(function(row,ri){row.forEach(function(c){f.push([c*R*0.20,(ri-1.4)*R*0.34]);});});
   return f[i%f.length];},
 arm:function(x,cx,cy,R,t,a,c){

(function(global){

      if(set>0.6){
        var na=L.gath*(set-0.6)/0.4;
        x.font='8px "Space Mono", monospace';x.textBaseline='top';
        x.fillStyle=rgba(mix(c2,BONE,0.30),na*0.74);
        x.fillText(a2.v.name.toUpperCase(),px,py+15);
        /* a word waits near the presence, where the Archive holds one */
        if(a2.word&&!open){var wy=py+27+Math.sin(t*0.24+i)*1.6;
          x.font='7.5px "Space Mono", monospace';
          x.fillStyle=rgba(BONE,na*0.30);x.fillText('touch',px,wy);}
      }
      if(al>0.10)hits.push({kind:'presence',x:px,y:py,r:30,i:i,a:a2});
    }
    /* who was silent is simply not here. Nothing marks the absence. */
  }

  /* the mote-company keeps orbiting until it settles — above the seats,
     the star's own light still moving */
  if(co.length&&d<0.20)F.motes(x,s,cx,cy,Sr*2.2,t,20,lens,1-d*4);

  /* ── 4 · the mouth ── the deepest stratum opens ── */
  if(L.mouth>0.01){
    var mr=(34+br*12)*L.mouth;
    var mg=x.createRadialGradient(cx,cy,0,cx,cy,mr*3.0);
    mg.addColorStop(0,rgba([255,246,230],0.44*L.mouth));
    mg.addColorStop(0.34,rgba(mix(col,[218,182,112],0.7),0.26*L.mouth));
    mg.addColorStop(1,rgba(col,0));
    x.fillStyle=mg;ring(x,cx,cy,mr*3.0);x.fill();
    ring(x,cx,cy,mr*(1.5+br*0.14));
    x.strokeStyle=rgba(mix(col,[236,206,150],0.8),0.20*L.mouth);x.lineWidth=1;x.stroke();
  }

  /* where he is in the fall — four words, one per layer, never a number */
  if(enter>0.9){
    var names=['the story, close','who sat with it','what you left here','the mouth of the return'];
    x.textAlign='center';x.textBaseline='alphabetic';
    x.font='8.5px "Space Mono", monospace';
    var fade=L.n===3?L.mouth:0.5+0.5*Math.sin(t*0.5)*0.2+0.4;
    x.fillStyle=rgba(BONE,0.26*Math.min(1,fade));
    x.fillText(names[L.n].toUpperCase(),cx,H-172);
  }
  return L;
}

function hitTest(px,py){
  for(var i=hits.length-1;i>=0;i--){var h=hits[i];
    if(Math.hypot(h.x-px,h.y-py)<h.r)return h;}
  return null;
}

global.UNIFALL={render:render,layers:layers,hitTest:hitTest,hits:function(){return hits;}};
})(window);

</script>
<script>
/* ── uni-sky.js, inlined — kept as its own file for the port and for reading
   on its own, but inlined here so the page never depends on a subresource
   fetch to render. Do not edit here; edit uni-sky.js. ── */
/* THE UNIVERSE · THE SKY ──────────────────────────────────────────
   One continuous descent, four scales, no screens between them:
     the sky      thirteen figures, and life crossing between them
     the region   inside one figure, in its own weather
     the world    a met story is an inhabited planet; depth is how long
                  life has been living there
     the well     down through his own past recognitions, to the Return
   You keep drawing in and you keep arriving somewhere. Nothing snaps,
   nothing zooms to fit, nothing anywhere is counted. ──────────────── */
(function(global){
'use strict';
var U=global.UNI, TAU=U.TAU, BONE=U.BONE;
var hash=U.hash, mix=U.mix, rgba=U.rgba, ring=U.ring, breath=U.breath;
var FLD=global.UNIFIELD;   /* the company. Absent on pages that predate it. */
var SUN=[-0.58,-0.34,0.74];

/* how much of each scale is showing, at this zoom */
function bands(z){
  var sky=1-Math.max(0,Math.min(1,(z-0.55)/0.5));
  var reg=Math.max(0,Math.min(1,(z-0.45)/0.5))*(1-Math.max(0,Math.min(1,(z-3.2)/2.2)));
  var wld=Math.max(0,Math.min(1,(z-2.6)/2.0));
  return {sky:sky,reg:reg,wld:wld};
}

/* ─── an inhabited world ───────────────────────────────────────── */
function planet(x,s,px,py,R,t,lens,detail){
  var room=U.ROOMS[s.room], col=mix(room.rgb,BONE,lens*0.35);
  var spin=t*s.spin, tilt=s.tilt;
  function proj(lat,lon){
    var a=lon+spin;
    var ux=Math.cos(lat)*Math.sin(a), uy=Math.sin(lat), uz=Math.cos(lat)*Math.cos(a);
    var cx2=Math.cos(tilt), sn=Math.sin(tilt);
    return [ux*cx2-uy*sn, ux*sn+uy*cx2, uz, ux,uy,uz];
  }
  /* the body */
  var g=x.createRadialGradient(px-R*0.36,py-R*0.34,R*0.05,px,py,R*1.05);
  if(s.met){
    g.addColorStop(0,rgba(mix(col,[255,250,242],0.34),0.72));
    g.addColorStop(0.45,rgba(mix(col,[20,18,26],0.30),0.62));
    g.addColorStop(1,rgba(mix(col,[6,5,10],0.82),0.96));
  }else{
    g.addColorStop(0,rgba(mix(col,[168,168,178],0.55),0.34));
    g.addColorStop(0.5,rgba(mix(col,[80,80,92],0.6),0.24));
    g.addColorStop(1,'rgba(8,8,12,0.9)');
  }
  x.fillStyle=g;ring(x,px,py,R);x.fill();
  /* land — the same continents every time he comes back */
  if(detail>0.2){
    for(var i=0;i<7;i++){
      var lat=(hash(s.seed*3.1+i)-0.5)*2.2, lon=hash(s.seed*5.7+i)*TAU;
      var p=proj(lat,lon); if(p[2]<=0.06)continue;
      var rr=R*(0.10+hash(s.seed*7.3+i)*0.22)*p[2];
      x.beginPath();x.ellipse(px+p[0]*R,py+p[1]*R,rr,rr*0.72,hash(i)*3,0,TAU);
      x.fillStyle=rgba(mix(col,[16,14,20],0.55),0.30*detail*p[2]);x.fill();
    }
  }
  /* night, and the sky's edge */
  x.save();ring(x,px,py,R);x.clip();
  var ng=x.createRadialGradient(px+R*0.55,py+R*0.5,R*0.1,px+R*0.4,py+R*0.4,R*1.7);
  ng.addColorStop(0,'rgba(2,2,5,0.94)');ng.addColorStop(0.5,'rgba(2,2,5,0.58)');ng.addColorStop(1,'rgba(2,2,5,0)');
  x.fillStyle=ng;x.fillRect(px-R,py-R,R*2,R*2);
  x.restore();
  ring(x,px,py,R*1.02);x.strokeStyle=rgba(mix(col,[255,252,246],0.5),s.met?0.30:0.12);x.lineWidth=1;x.stroke();
  var ag=x.createRadialGradient(px,py,R*0.96,px,py,R*1.5);
  ag.addColorStop(0,rgba(col,s.met?0.16:0.05));ag.addColorStop(1,rgba(col,0));
  x.fillStyle=ag;ring(x,px,py,R*1.5);x.fill();

  if(!s.met||detail<0.25)return;

  /* ─ the civilization. It only exists where he has been. ─ */
  var n=3+s.depth*4, lit=[];
  for(var j=0;j<n;j++){
    var lat0=(hash(s.seed*11.3+j*1.7)-0.5)*2.3, lon0=hash(s.seed*13.1+j*2.3)*TAU;
    if(room.civ==='towers'){lat0*=0.35;}
    if(room.civ==='lines'){lat0=Math.sin(j*0.9)*0.5;lon0=j/n*TAU;}
    if(room.civ==='rings'){var rr2=0.4+(j%3)*0.28;lat0=Math.sin(j*2.1)*rr2;lon0=(j*GOLDLESS(j))%TAU;}
    var p2=proj(lat0,lon0); if(p2[2]<=0.04)continue;
    var illum=p2[3]*SUN[0]+p2[4]*SUN[1]+p2[5]*SUN[2];
    var night=Math.max(0,Math.min(1,(0.18-illum)/0.5));
    var flick=1;
    if(room.civ==='ruins')  flick=hash(s.seed+j+Math.floor(t*0.4))>0.35?1:0.12;
    if(room.civ==='relight')flick=0.25+0.75*Math.max(0,Math.sin(t*0.5-j*0.4));
    if(room.civ==='districts')flick=0.4+0.6*(0.5+0.5*Math.sin(t*1.05-lat0*2.4));
    var sz=(1.1+hash(s.seed*17.7+j)*1.7)*Math.max(0.6,Math.min(2.6,R/38))*(0.5+p2[2]*0.5);
    var a=(0.34+night*0.66)*flick*detail;
    var wx=px+p2[0]*R, wy=py+p2[1]*R;
    lit.push([wx,wy,a,sz]);
    x.beginPath();x.arc(wx,wy,sz,0,TAU);
    x.fillStyle=rgba(mix(col,[255,242,214],night>0.4?0.84:0.35),a);x.fill();
    if(night>0.35&&R>28){x.beginPath();x.arc(wx,wy,sz*4.6,0,TAU);
      x.fillStyle=rgba(mix(col,[255,230,176],0.7),a*0.16);x.fill();}
    /* the towers all face outward; the arrays all speak upward */
    if(room.civ==='towers'&&R>46){x.beginPath();x.moveTo(wx,wy);
      x.lineTo(px+p2[0]*R*1.22,py+p2[1]*R*1.22);
      x.strokeStyle=rgba(col,a*0.4);x.lineWidth=0.8;x.stroke();}
    if(room.civ==='arrays'&&R>46&&j%3===0){x.beginPath();x.moveTo(wx,wy);
      x.lineTo(px+p2[0]*R*1.55,py+p2[1]*R*1.55-R*0.2);
      x.strokeStyle=rgba(mix(col,[220,255,252],0.5),a*0.30);x.lineWidth=0.8;x.stroke();}
    if(room.civ==='shafts'&&R>50){ring(x,wx,wy,sz*3.4);
      x.strokeStyle=rgba(mix(col,[255,190,160],0.4),a*0.28);x.lineWidth=0.7;x.stroke();}
    if(room.civ==='terraces'&&R>50){for(var q=1;q<=2;q++){ring(x,wx,wy,sz*(2.4+q*2.2));
      x.strokeStyle=rgba(mix(col,[210,255,200],0.4),a*0.16);x.lineWidth=0.6;x.stroke();}}
    if(room.civ==='mirrorcities'&&R>44){var pm=proj(-lat0,lon0);
      if(pm[2]>0.04){x.beginPath();x.arc(px+pm[0]*R,py+pm[1]*R,sz*0.8,0,TAU);
        x.fillStyle=rgba(mix(col,[255,244,220],0.6),a*0.45);x.fill();}}
  }
  /* the roads between them, and what moves along the roads */
  if(R>22&&lit.length>1){
    for(var m=0;m<lit.length-1;m++){
      var A=lit[m],B=lit[m+1];
      if(Math.hypot(A[0]-B[0],A[1]-B[1])>R*1.1)continue;
      x.beginPath();x.moveTo(A[0],A[1]);x.lineTo(B[0],B[1]);
      x.strokeStyle=rgba(mix(col,[255,238,206],0.6),Math.min(A[2],B[2])*0.30);x.lineWidth=0.6;x.stroke();
      var ph=((t*0.22+m*0.31)%1);
      x.beginPath();x.arc(A[0]+(B[0]-A[0])*ph,A[1]+(B[1]-A[1])*ph,1.1,0,TAU);
      x.fillStyle=rgba([255,246,226],Math.min(A[2],B[2])*0.85);x.fill();
    }
  }
  /* the rift, the net, the great road — one signature per kind of world */
  if(R>26){
    var sig=room.civ;
    if(sig==='furnaces'){
      x.beginPath();
      for(var f=0;f<=40;f++){var p3=proj(Math.sin(f/40*3.1)*0.7-0.1,f/40*TAU*0.8-0.7);
        if(p3[2]<=0)continue;x.lineTo(px+p3[0]*R,py+p3[1]*R);}
      x.strokeStyle=rgba([255,196,120],0.34*detail);x.lineWidth=1.4;x.stroke();
    }
    if(sig==='weave'){
      for(var la=-2;la<=2;la++){x.beginPath();
        for(var lo=0;lo<=44;lo++){var p4=proj(la*0.45,lo/44*TAU);
          if(p4[2]<=0.02)continue;x.lineTo(px+p4[0]*R,py+p4[1]*R);}
        x.strokeStyle=rgba(col,0.14*detail);x.lineWidth=0.6;x.stroke();}
      for(var lo2=0;lo2<8;lo2++){x.beginPath();
        for(var la2=-20;la2<=20;la2++){var p5=proj(la2/20*1.4,lo2/8*TAU);
          if(p5[2]<=0.02)continue;x.lineTo(px+p5[0]*R,py+p5[1]*R);}
        x.strokeStyle=rgba(col,0.10*detail);x.lineWidth=0.6;x.stroke();}
    }
    if(sig==='rings'){for(var rr3=1;rr3<=3;rr3++){ring(x,px,py,R*(0.28+rr3*0.20));
      x.strokeStyle=rgba(mix(col,[255,230,236],0.4),0.10*detail);x.lineWidth=0.7;x.stroke();}}
  }
  /* what orbits it — only worlds long lived-on have traffic above them */
  if(s.depth>=3&&R>24){
    for(var o=0;o<2;o++){
      var orr=R*(1.34+o*0.30), oe=0.30+o*0.10;
      x.beginPath();x.ellipse(px,py,orr,orr*oe,tilt*0.8,0,TAU);
      x.strokeStyle=rgba(col,0.13*detail);x.lineWidth=0.7;x.stroke();
      var ships=1+o;
      for(var sh=0;sh<ships;sh++){
        var ang=(t*(0.16+o*0.07)+sh/ships+o*0.3)%1*TAU;
        var ox=Math.cos(ang)*orr, oy=Math.sin(ang)*orr*oe;
        var cxr=Math.cos(tilt*0.8), sxr=Math.sin(tilt*0.8);
        x.beginPath();x.arc(px+ox*cxr-oy*sxr,py+ox*sxr+oy*cxr,1.5,0,TAU);
        x.fillStyle=rgba([255,250,238],0.8*detail);x.fill();
      }
    }
    if(room.civ==='ports'&&R>60){
      var pang=(t*0.10)%1*TAU;
      x.beginPath();x.arc(px+Math.cos(pang)*R*1.7,py+Math.sin(pang)*R*0.6,2.4,0,TAU);
      x.fillStyle=rgba([246,240,255],0.9*detail);x.fill();
    }
  }
}
function GOLDLESS(j){return 2.399963;}

/* ─── the whole thing ──────────────────────────────────────────── */
function render(x,W,H,t,v){
  var cam=v.cam, z=cam.z, lens=v.lens||0, B=bands(z), br=breath(t);
  var SX=function(wx){return (wx-cam.x)*z+W/2;}, SY=function(wy){return (wy-cam.y)*z+H/2;};

  var bg=x.createRadialGradient(W/2,H*0.44,0,W/2,H*0.44,H);
  bg.addColorStop(0,'#080711');bg.addColorStop(1,'#040307');
  x.fillStyle=bg;x.fillRect(0,0,W,H);

  /* deep dust, in three depths, so the sky has thickness */
  for(var L=0;L<3;L++){
    var par=0.30+L*0.40, n=L===0?58:38, a=(0.10+L*0.05)*(1-lens*0.4);
    for(var i=0;i<n;i++){
      var kk=i+L*97, wx=(hash(kk)*2-1)*1500, wy=(hash(kk+0.5)*2-1)*1700;
      var px=(wx-cam.x*par)*z+W/2, py=(wy-cam.y*par)*z+H/2+Math.sin(t*0.08+kk)*3;
      if(px<-20||px>W+20||py<-20||py>H+20)continue;
      x.beginPath();x.arc(px,py,(0.4+L*0.35)*Math.max(0.7,Math.min(2.4,z)),0,TAU);
      x.fillStyle=rgba([236,232,240],a*(0.5+0.5*Math.sin(t*0.4+kk)));x.fill();
    }
  }

  /* the region weather — once he is inside one, the place has its own air */
  if(B.reg>0.02){
    U.ROOMS.forEach(function(room){
      var d=Math.hypot(room.x-cam.x,room.y-cam.y);
      var inside=Math.max(0,Math.min(1,(room.r*1.6-d)/(room.r*0.9)));
      if(inside<=0.02)return;
      var amt=inside*B.reg;
      var tint=mix(room.rgb,BONE,lens*0.5);
      /* the air of the place, before anything in it */
      var tg=x.createRadialGradient(W/2,H*0.44,0,W/2,H*0.44,H*0.95);
      tg.addColorStop(0,rgba(tint,0.055*amt*(1-lens*0.5)));
      tg.addColorStop(1,rgba(tint,0.014*amt*(1-lens*0.5)));
      x.fillStyle=tg;x.fillRect(0,0,W,H);
      x.save();x.beginPath();x.rect(0,0,W,H);x.clip();
      room.field(x,W,H,t,amt*1.7*(1-lens*0.5),tint);
      x.restore();
    });
  }

  /* the thirteen nebulae */
  U.ROOMS.forEach(function(room,ri){
    var px=SX(room.x), py=SY(room.y), pr=room.r*z*(1.5+br*0.10);
    if(px+pr<-80||px-pr>W+80||py+pr<-80||py-pr>H+80)return;
    var col=mix(room.rgb,BONE,lens*0.55);
    var litN=0;for(var i=0;i<U.STARS.length;i++)if(U.STARS[i].room===ri&&U.STARS[i].met)litN++;
    var base=(0.050+Math.min(0.046,litN*0.009))/(1+Math.max(0,z-0.8)*1.2);
    var g=x.createRadialGradient(px,py,0,px,py,pr);
    g.addColorStop(0,rgba(col,(base+br*0.013)*(1-lens*0.42)));
    g.addColorStop(0.42,rgba(col,base*0.42*(1-lens*0.42)));
    g.addColorStop(1,rgba(col,0));
    x.fillStyle=g;ring(x,px,py,pr);x.fill();
  });

  /* the thirteen forms — the figure each room makes in the sky */
  var armA=Math.max(0,Math.min(1,(2.6-z)/1.6));
  if(armA>0.02){
    U.ROOMS.forEach(function(room){
      var px=SX(room.x), py=SY(room.y), R=room.r*z;
      if(px+R*1.6<-40||px-R*1.6>W+40||py+R*1.6<-40||py-R*1.6>H+40)return;
      if(R<12)return;
      room.arm(x,px,py,R,t,armA*0.72*(1-lens*0.55),mix(room.rgb,BONE,lens*0.5));
    });
  }

  /* the structures, beneath the light */
  if(lens>0.02){
    x.lineCap='round';
    U.STRUCTURES.forEach(function(st){
      var soft=st.loose, a=lens*(0.46-soft*0.24);
      var col=mix(BONE,[168,178,188],soft*0.5), wob=(1+soft*2.6);
      var pts=st.nodes.map(function(nd){
        return [SX(nd.x+Math.sin(t*0.16+nd.ph)*wob*5),SY(nd.y+Math.cos(t*0.13+nd.ph*1.3)*wob*5)];});
      if(pts.every(function(p){return p[0]<-60||p[0]>W+60||p[1]<-60||p[1]>H+60;}))return;
      x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
      for(var j=1;j<pts.length;j++){
        x.quadraticCurveTo(pts[j-1][0],pts[j-1][1],(pts[j-1][0]+pts[j][0])/2,(pts[j-1][1]+pts[j][1])/2);}
      x.lineTo(pts[pts.length-1][0],pts[pts.length-1][1]);
      x.strokeStyle=rgba(col,a);x.lineWidth=Math.max(0.8,1.4*Math.min(1.6,z));x.stroke();
      st.nodes.forEach(function(nd,j){
        var p=pts[j], gl=nd.proof?(0.5+0.5*Math.sin(t*0.7+nd.ph)):0.25;
        x.beginPath();x.arc(p[0],p[1],(1.6+(nd.proof?1.6:0))*Math.min(2,Math.max(0.8,z)),0,TAU);
        x.fillStyle=rgba(col,lens*(0.20+gl*0.44-soft*0.12));x.fill();});
      if(z>0.85&&z<6){var p0=pts[0];
        x.font='9px "Space Mono", monospace';x.textAlign='left';
        x.fillStyle=rgba(col,lens*Math.min(0.42,(z-0.85)*0.7));
        x.fillText(st.name,p0[0]+11,p0[1]+3);}
    });
  }

  /* life on the move — between worlds, and between regions */
  U.LANES.forEach(function(ln,li){
    var ax=SX(ln.a.x), ay=SY(ln.a.y), bx=SX(ln.b.x), by=SY(ln.b.y);
    var far=ln.local?0:1;
    var vis=ln.local?B.reg*0.9+B.wld*0.4:Math.max(B.sky*0.9,0.22);
    if(vis<0.03)return;
    if(Math.max(ax,bx)<-60||Math.min(ax,bx)>W+60||Math.max(ay,by)<-60||Math.min(ay,by)>H+60)return;
    var mx=(ax+bx)/2, my=(ay+by)/2, nx=-(by-ay), ny=(bx-ax), nl=Math.hypot(nx,ny)||1;
    var bow=(far?0.16:0.10)*Math.hypot(bx-ax,by-ay);
    var qx=mx+nx/nl*bow, qy=my+ny/nl*bow;
    var col=mix(mix(U.ROOMS[ln.a.room].rgb,U.ROOMS[ln.b.room].rgb,0.5),BONE,0.35+lens*0.3);
    x.beginPath();x.moveTo(ax,ay);x.quadraticCurveTo(qx,qy,bx,by);
    x.strokeStyle=rgba(col,vis*(far?0.10:0.14));x.lineWidth=0.7;x.stroke();
    var count=far?2:1;
    for(var c=0;c<count;c++){
      var ph=((t*ln.spd+ln.ph+c/count)%1), iv=1-ph;
      var tx=iv*iv*ax+2*iv*ph*qx+ph*ph*bx, ty=iv*iv*ay+2*iv*ph*qy+ph*ph*by;
      for(var tr=0;tr<5;tr++){
        var p2=Math.max(0,ph-tr*0.012), i2=1-p2;
        var sx2=i2*i2*ax+2*i2*p2*qx+p2*p2*bx, sy2=i2*i2*ay+2*i2*p2*qy+p2*p2*by;
        x.beginPath();x.arc(sx2,sy2,(far?1.5:1.1)*(1-tr/5),0,TAU);
        x.fillStyle=rgba(mix(col,[255,250,240],0.6),vis*0.75*(1-tr/5));x.fill();
      }
    }
  });

  /* the worlds */
  var focus=null, fbest=1e9;
  for(var si=0;si<U.STARS.length;si++){
    var s=U.STARS[si];
    var px2=SX(s.x), py2=SY(s.y);
    var R=s.pr*z;
    if(px2+R*1.6<-30||px2-R*1.6>W+30||py2+R*1.6<-30||py2-R*1.6>H+30)continue;
    var dc=Math.hypot(px2-W/2,py2-H*0.44);
    if(s.met&&dc<fbest){fbest=dc;focus=s;}
    var col2=mix(U.ROOMS[s.room].rgb,BONE,lens*0.4), dim=1-lens*0.58;
    if(R<6){
      /* far off: a point of light, or a place where none has come on yet */
      if(!s.met){
        x.beginPath();x.arc(px2,py2,Math.max(0.6,0.9+z*0.5),0,TAU);
        x.fillStyle=rgba(mix(col2,[196,202,212],0.6),(0.15+0.22*Math.min(1,z))*dim);x.fill();
      }else{
        /* at the far zoom, company is only a shimmer — and colourless (§8.7) */
        var glow=(0.7+br*0.3)*(s.tw+(FLD?FLD.shimmer(s,t):0)), Rp=(1.6+s.depth*0.15)*Math.max(0.9,z*1.2)+0.8;
        if(s.depth>0&&z>0.5){
          for(var kk=1;kk<=Math.min(s.depth,8);kk++){
            ring(x,px2,py2,Rp+kk*(4.6*Math.min(2.2,z)));
            x.strokeStyle=rgba(col2,0.28*dim*(1-kk/12)*(0.62+br*0.38));x.lineWidth=0.9;x.stroke();}
        }
        var gr=Rp*4.2, gg=x.createRadialGradient(px2,py2,0,px2,py2,gr);
        gg.addColorStop(0,rgba(mix(col2,[255,252,246],0.55),0.72*glow*dim));
        gg.addColorStop(0.22,rgba(col2,0.30*glow*dim));gg.addColorStop(1,rgba(col2,0));
        x.fillStyle=gg;ring(x,px2,py2,gr);x.fill();
        ring(x,px2,py2,Rp);x.fillStyle=rgba(mix(col2,[255,253,250],0.7),0.92*dim);x.fill();
      }
    }else{
      planet(x,s,px2,py2,R,t,lens,Math.max(0,Math.min(1,(R-4)/26)));
    }
    /* mid distance: the company separates out of the shimmer and holds orbit.
       In the structure lens it fades to near-nothing — two ways of standing,
       not two overlays fighting. */
    if(FLD&&s.met&&v.mode==='sky')FLD.motes(x,s,px2,py2,Math.max(R,3.2+z*1.1),t,z,lens,dim);
  }

  /* the names — only at the far zoom, dim, lettered by hand */
  var show=Math.max(0,Math.min(1,(0.60-z)/0.24));
  if(show>0.01){
    x.textAlign='center';
    U.ROOMS.forEach(function(room){
      var px=SX(room.x), py=SY(room.y);
      if(px<-60||px>W+60||py<-40||py>H+40)return;
      x.font='9px "Space Mono", monospace';
      x.fillStyle=rgba(mix(room.rgb,BONE,0.42+lens*0.4),0.44*show);
      x.fillText(room.name.toUpperCase(),px,py+room.r*z*0.10+4);
    });
  }

  if(v.mode!=='sky'&&v.fallStar&&global.UNIFALL)global.UNIFALL.render(x,W,H,t,v,lens);
  return focus;
}

global.SKY={render:render,bands:bands};
})(window);

</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050408;display:flex;align-items:center;justify-content:center;font-family:Lora,Georgia,serif}
#stage{display:flex;flex-direction:column;align-items:center;gap:14px;flex-shrink:0}
.phone{position:relative;width:393px;height:852px;border-radius:46px;overflow:hidden;background:#040307;box-shadow:0 30px 90px rgba(0,0,0,.7);touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.chrome{position:absolute;inset:0;pointer-events:none;z-index:5}
.status{display:flex;align-items:center;justify-content:space-between;padding:15px 30px 0;color:#fff;opacity:.78}
.status .t{font-family:-apple-system,system-ui;font-weight:600;font-size:15px}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:112px;height:30px;border-radius:20px;background:#000}
.back{position:absolute;top:58px;left:20px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.05);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:.5px solid rgba(255,255,255,.10);
  color:rgba(237,232,227,.72);font-size:19px;line-height:1;pointer-events:auto;cursor:pointer;z-index:7}
.dotmark{position:absolute;top:64px;right:26px;display:grid;grid-template-columns:repeat(2,3px);gap:4px;padding:8px;opacity:.30;pointer-events:auto;cursor:pointer;z-index:7}
.dotmark span{width:3px;height:3px;border-radius:3px;background:#EDE8E3}
.dotmark span:first-child{background:#E5533C}
/* where he is — one line, appearing only as he crosses into it */
.where{position:absolute;left:0;right:0;top:112px;text-align:center;font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(237,232,227,.42);opacity:0;transition:opacity 1.8s ease;z-index:6;pointer-events:none}
/* the lens — a quiet gesture at the frame's edge, held rather than flipped */
.lensrail{position:absolute;top:0;bottom:0;right:0;width:30px;pointer-events:auto;cursor:ew-resize;z-index:6}
.lensrail i{position:absolute;right:9px;top:50%;width:1px;height:148px;transform:translateY(-50%);background:linear-gradient(180deg,transparent,rgba(237,232,227,.18),transparent)}
.lensrail b{position:absolute;right:6.5px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:6px;background:rgba(237,232,227,.42);
  box-shadow:0 0 10px rgba(237,232,227,.20);transition:transform .5s cubic-bezier(.2,.7,.2,1),background .5s ease}
.lenslabel{position:absolute;right:36px;top:50%;transform:translateY(-50%);font-family:"Space Mono",monospace;font-size:8px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(237,232,227,.46);white-space:nowrap;opacity:0;transition:opacity .6s ease;z-index:6}
/* the doorway into the story — only at a world, only where life is */
.door{position:absolute;left:0;right:0;bottom:62px;display:flex;flex-direction:column;align-items:center;gap:9px;padding:0 40px;
  opacity:0;transition:opacity 1.5s ease;pointer-events:none;z-index:7;text-align:center}
.door.on{opacity:1;pointer-events:auto;cursor:pointer}
.door .codex{font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.2em;color:rgba(237,232,227,.34)}
.door .title{font-family:Lora,Georgia,serif;font-size:21px;line-height:1.32;color:#EDE8E3;letter-spacing:-.012em;text-wrap:balance}
.door .go{font-family:"Space Mono",monospace;font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:rgba(237,232,227,.4);margin-top:3px}
.home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:100px;background:rgba(255,255,255,.7);z-index:8}
.ret{position:absolute;left:0;right:0;bottom:100px;text-align:center;font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(237,232,227,.62);opacity:0;transition:opacity 2s ease;pointer-events:none;z-index:7}
.ret.on{opacity:1;pointer-events:auto;cursor:pointer}
.bench{display:flex;gap:15px;align-items:center;font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(237,232,227,.28)}
.bench span[data-a]{cursor:pointer;border-bottom:1px solid rgba(237,232,227,.14);padding-bottom:2px}
</style>
</head>
<body>
<div id="stage">
  <div class="phone" id="phone">
    <canvas id="sky"></canvas>
    <div class="chrome">
      <div class="status"><span class="t">4:07</span><span style="font-size:12px;letter-spacing:.04em">􀙇 􀛨 􀋦</span></div>
      <div class="island"></div>
    </div>
    <div class="back" id="back">‹</div>
    <div class="dotmark" id="dotmark"><span></span><span></span><span></span><span></span></div>
    <div class="where" id="where"></div>
    <div class="door" id="door">
      <span class="codex" id="doorCodex"></span>
      <span class="title" id="doorTitle"></span>
      <span class="go">touch to read</span>
    </div>
    <div class="lensrail" id="rail"><i></i><b id="knob"></b></div>
    <div class="lenslabel" id="lenslabel">the star lens</div>
    <div class="ret" id="ret">open the return</div>
    <div class="home"></div>
  </div>
  <div class="bench" id="bench"></div>
</div>
<script>
/* ══ THE UNIVERSE — the camera, the hand, the sound ═════════════
   One continuous descent: the sky · the region · the world · the well.
   No screens between the scales. He keeps drawing in and keeps arriving.
   The page decides where he is standing; uni-rooms.js holds the thirteen
   and their forms; uni-sky.js holds what light does. ══════════════ */
const U=window.UNI, SKY=window.SKY, S=()=>window.FieldSound;
const cvs=document.getElementById('sky'), ctx=cvs.getContext('2d');
let W=393,H=852,DPR=Math.min(2,window.devicePixelRatio||1),lastW=0,lastH=0;
function fit(){W=cvs.clientWidth||393;H=cvs.clientHeight||852;cvs.width=W*DPR;cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);lastW=cvs.clientWidth;lastH=cvs.clientHeight;}

const cam={x:0,y:0,z:0.30,vx:0,vy:0,vz:0};
const ZMIN=0.22, ZMAX=34;
let lens=0, lensTarget=0;
let mode='sky', fallStar=null, fall=0, desc=0, descV=0, descMark=-1, driftX=0, driftY=0;
let awake=false, curRoom=-1, curScale='sky', focus=null, whereTimer=null;

const SX=x=>(x-cam.x)*cam.z+W/2, SY=y=>(y-cam.y)*cam.z+H/2;
const whereEl=document.getElementById('where');
function say(text){
  whereEl.textContent=text; whereEl.style.opacity=1;
  clearTimeout(whereTimer); whereTimer=setTimeout(()=>{whereEl.style.opacity=0;},3400);
}

function frame(){
  const t=performance.now()/1000;
  if(cvs.clientWidth!==lastW||cvs.clientHeight!==lastH)fit();

  if(mode==='sky'){
    cam.x-=cam.vx; cam.y-=cam.vy;
    cam.vx*=0.945; cam.vy*=0.945;
    cam.z*=(1+cam.vz); cam.vz*=0.90;
    if(cam.vz>0.10)cam.vz=0.10; if(cam.vz<-0.10)cam.vz=-0.10;
    cam.z=Math.max(ZMIN,Math.min(ZMAX,cam.z));
    const span=520/Math.max(0.3,cam.z);
    cam.x=Math.max(-900-span,Math.min(900+span,cam.x));
    cam.y=Math.max(-1500-span,Math.min(1500+span,cam.y));
  }else{
    if(mode==='falling'){
      fall=Math.min(1,fall+0.011);
      cam.x+=(fallStar.x-cam.x)*0.05; cam.y+=(fallStar.y-cam.y)*0.05;
      cam.z+=(ZMAX*1.6-cam.z)*0.03;
      if(fall>=1)mode='well';
    }
    desc=Math.max(0,Math.min(1,desc+descV)); descV*=0.935;
    driftX*=0.93; driftY*=0.93;
    const step=Math.floor(desc*(fallStar.depth+1));
    if(step!==descMark&&step>0&&step<=fallStar.depth){descMark=step;S()&&S().ring(step-1);}
    document.getElementById('ret').classList.toggle('on',desc>0.93);
  }
  lens+=(lensTarget-lens)*0.07;

  focus=SKY.render(ctx,W,H,t,{cam,lens,mode,fall,desc,fallStar,dx:driftX,dy:driftY});
  doorway();

  if(mode==='sky'&&awake){
    /* which region he is drifting over — the bed takes its colour */
    let near=-1,best=1e9;
    U.ROOMS.forEach((r,i)=>{const d=(r.x-cam.x)**2+(r.y-cam.y)**2;if(d<best&&d<r.r*r.r*1.6){best=d;near=i;}});
    if(near!==curRoom){curRoom=near;
      if(near>=0){S()&&S().threshold(U.ROOMS[near].hz,8);if(cam.z>0.5)say(U.ROOMS[near].name);}}
    /* and which scale he is standing at — descending sounds an octave up */
    const b=SKY.bands(cam.z);
    const scale = b.wld>0.55 ? 'world' : (b.reg>0.5 ? 'region' : 'sky');
    if(scale!==curScale){
      const room=curRoom>=0?U.ROOMS[curRoom]:null;
      if(scale==='world'&&focus){S()&&S().threshold((room?room.hz:198)*2,8);
        say(focus.met?(focus.depth>0?'a world, long lived on':'a world, newly alive'):'a world, still waiting');}
      else if(scale==='region'&&room){S()&&S().threshold(room.hz,8);say(room.name);}
      else if(scale==='sky'){S()&&S().threshold(110,9);}
      curScale=scale;
    }
    /* keep drawing in on a world that has a well, and you fall into it */
    if(cam.z>ZMAX*0.93&&focus&&focus.depth>0&&Math.hypot(SX(focus.x)-W/2,SY(focus.y)-H*0.44)<W*0.36){
      fallStar=focus;mode='falling';fall=0;desc=0;descV=0;descMark=-1;driftX=driftY=0;
      S()&&S().threshold(126,9);say('down through what you left here');
    }
  }
  requestAnimationFrame(frame);
}

/* ── the doorway into the story ────────────────────────────────
   A world only offers its story once he is standing close enough to see
   its lights. An unmet world offers nothing — you do not browse into a
   story you have not met; that meeting happens at the Rite. Its silence
   is the whole point. */
const doorEl=document.getElementById('door');
let doorStar=null;
function doorway(){
  let s=null;
  if(mode==='sky'&&focus&&focus.met&&focus.title){
    const R=focus.pr*cam.z;
    const off=Math.hypot(SX(focus.x)-W/2,SY(focus.y)-H*0.44);
    if(R>36&&off<W*0.42)s=focus;
  }
  if(s!==doorStar){
    doorStar=s;
    if(s){document.getElementById('doorCodex').textContent=s.codex+' · '+U.ROOMS[s.room].name;
      document.getElementById('doorTitle').textContent=s.title;}
    doorEl.classList.toggle('on',!!s);
  }
}
doorEl.onclick=()=>{
  if(!doorStar)return;
  S()&&S().threshold(U.ROOMS[doorStar.room].hz,6);
  setTimeout(()=>{window.location.href='Story Detail.html';},620);
};

/* ── the hand ─────────────────────────────────────────────────── */
const phone=document.getElementById('phone');
const pts=new Map();
let last=null, pinch0=0, movedFar=false, downAt=0;
function wake(){if(awake||!S())return;awake=true;S().startBed(110,10);S().setMuted(false);}

phone.addEventListener('pointerdown',e=>{
  if(e.target.closest('#rail')||e.target.closest('#back')||e.target.closest('#dotmark')||e.target.closest('#ret')||e.target.closest('#door'))return;
  wake();
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const v=[...pts.values()];pinch0=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);}
  last={x:e.clientX,y:e.clientY};movedFar=false;downAt=Date.now();cam.vx=cam.vy=0;
});
phone.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){
    const v=[...pts.values()], d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);
    if(pinch0>0){cam.z=Math.max(ZMIN,Math.min(ZMAX,cam.z*(d/pinch0)));pinch0=d;}
    movedFar=true;return;
  }
  if(!last)return;
  const dx=e.clientX-last.x, dy=e.clientY-last.y;
  if(Math.abs(dx)+Math.abs(dy)>7)movedFar=true;
  if(mode==='sky'){
    cam.x-=dx/cam.z; cam.y-=dy/cam.z;
    cam.vx=dx/cam.z*0.55; cam.vy=dy/cam.z*0.55;
  }else{
    descV+=(-dy)*0.00042;              /* in the well, pulling up is descending */
    driftX+=dx*0.0022; driftY+=dy*0.0022;
  }
  last={x:e.clientX,y:e.clientY};
});
function release(e){
  pts.delete(e.pointerId); if(pts.size<2)pinch0=0;
  if(!movedFar&&Date.now()-downAt<600)tap(e.clientX,e.clientY);
  last=null;
}
phone.addEventListener('pointerup',release);
phone.addEventListener('pointercancel',release);
phone.addEventListener('wheel',e=>{e.preventDefault();wake();
  if(mode==='sky'){cam.vz=Math.max(-0.10,Math.min(0.10,cam.vz-e.deltaY*0.0004));}
  else descV+=-e.deltaY*0.00022;},{passive:false});

/* a tap draws in one step toward what he touched — the fall opens only
   where there is a well, and only from close enough to see the lights */
function tap(cx,cy){
  if(mode!=='sky')return;
  const r=phone.getBoundingClientRect();
  const px=(cx-r.left)*(393/r.width), py=(cy-r.top)*(852/r.height);
  let hit=null,best=1e9;
  for(const s of U.STARS){
    const R=Math.max(16,s.pr*cam.z*1.2);
    const d=Math.hypot(SX(s.x)-px,SY(s.y)-py);
    if(d<R&&d<best){best=d;hit=s;}
  }
  if(!hit){ /* empty sky: a tap draws in a little, where he pointed */
    cam.x+=(px-W/2)/cam.z*0.5; cam.y+=(py-H/2)/cam.z*0.5; cam.vz+=0.06; return; }
  const R=hit.pr*cam.z;
  if(R>34&&hit.depth>0){
    fallStar=hit;mode='falling';fall=0;desc=0;descV=0;descMark=-1;driftX=driftY=0;
    S()&&S().threshold(126,9);say('down through what you left here');
  }else{
    /* draw toward it, one scale at a time */
    cam.x+=(hit.x-cam.x)*0.7; cam.y+=(hit.y-cam.y)*0.7; cam.vz+=0.085;
    if(hit.met)S()&&S().threshold(U.ROOMS[hit.room].hz,6);
  }
}

/* ── the lens: one sky, two ways of standing in it ────────────── */
const rail=document.getElementById('rail'), knob=document.getElementById('knob'), llabel=document.getElementById('lenslabel');
let railing=false, railX=0, railBase=0;
const label=()=>{llabel.textContent=lensTarget>0.5?'the structure lens':'the star lens';};
const setKnob=v=>{knob.style.transform='translateX('+(-v*16)+'px)';knob.style.background='rgba(237,232,227,'+(0.42+v*0.34)+')';};
rail.addEventListener('pointerdown',e=>{e.stopPropagation();wake();railing=true;railX=e.clientX;railBase=lensTarget;
  llabel.style.opacity=1;knob.style.transition='none';try{rail.setPointerCapture(e.pointerId);}catch(_){}});
rail.addEventListener('pointermove',e=>{
  if(!railing)return;
  lensTarget=Math.max(0,Math.min(1,railBase+(railX-e.clientX)/150));
  setKnob(lensTarget);label();
});
function railEnd(){
  if(!railing)return;railing=false;
  const was=railBase>0.5, to=lensTarget>0.5?1:0;
  lensTarget=to;knob.style.transition='';setKnob(to);label();
  if(was!==(to>0.5))S()&&S().voice(to?'sakshi':'shweta',to?285:329,9);
  llabel.style.opacity=0;
}
rail.addEventListener('pointerup',railEnd);
rail.addEventListener('pointercancel',railEnd);
rail.addEventListener('click',e=>{
  if(Math.abs(railX-e.clientX)>5)return;
  const to=lensTarget>0.5?0:1;lensTarget=to;setKnob(to);label();
  llabel.style.opacity=1;setTimeout(()=>llabel.style.opacity=0,2400);
  S()&&S().voice(to?'sakshi':'shweta',to?285:329,9);
});

/* ── leaving, one scale at a time ─────────────────────────────── */
document.getElementById('back').onclick=()=>{
  const ret=document.getElementById('ret');
  if(mode!=='sky'){mode='sky';fall=0;desc=0;descV=0;descMark=-1;cam.z=9;ret.classList.remove('on');return;}
  if(cam.z>3.2){cam.z=1.3;cam.vz=0;return;}
  if(cam.z>0.55){cam.z=0.30;cam.vz=0;cam.vx=cam.vy=0;return;}
  window.location.href='A Strange Feed.html';
};
document.getElementById('dotmark').onclick=()=>{window.location.href='A Strange Feed.html';};
document.getElementById('ret').onclick=()=>{S()&&S().threshold(168,7);setTimeout(()=>{window.location.href='The Return.html';},700);};

/* ── the bench. Review controls never ship. ──────────────────── */
(function bench(){
  const b=document.getElementById('bench');
  b.innerHTML='<span>the bench</span>';
  const add=(t,fn)=>{const s=document.createElement('span');s.dataset.a=1;s.textContent=t;s.onclick=fn;b.appendChild(s);};
  const deepest=U.DEEP.slice().sort((p,q)=>q.depth-p.depth)[0];
  add('the sky',()=>{cam.x=0;cam.y=0;cam.z=0.30;cam.vx=cam.vy=cam.vz=0;});
  add('a region',()=>{const r=U.ROOMS.find(r=>r.id==='body');cam.x=r.x;cam.y=r.y;cam.z=1.5;cam.vz=0;});
  add('a world',()=>{cam.x=deepest.x;cam.y=deepest.y;cam.z=11;cam.vz=0;});
  add('a world, close',()=>{cam.x=deepest.x;cam.y=deepest.y;cam.z=28;cam.vz=0;});
  add('a shallow world',()=>{const s=U.MET.filter(m=>m.depth===0)[0]||U.MET[0];cam.x=s.x;cam.y=s.y;cam.z=26;cam.vz=0;});
  add('the lens',()=>{const to=lensTarget>0.5?0:1;lensTarget=to;setKnob(to);label();});
  const n=document.createElement('span');n.style.opacity=.55;
  n.textContent='drag to drift · pinch or scroll to keep drawing in · the right edge is the lens';
  b.appendChild(n);
})();

fit();label();setKnob(0);
(function fitStage(){
  const st=document.getElementById('stage');
  const apply=()=>{const k=Math.min(1,(window.innerHeight-24)/900,(window.innerWidth-24)/393);
    st.style.transform='scale('+k+')';st.style.transformOrigin='50% 50%';};
  apply();window.addEventListener('resize',apply);
})();
requestAnimationFrame(frame);
</script>
</body>
