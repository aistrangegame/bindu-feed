<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Strange Feed — Rooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Space+Mono&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel">
/* ── ios-frame.jsx, inlined — kept as its own file for the port and for reading
   on its own, but inlined here so the page never depends on a subresource
   fetch to render. Do not edit here; edit ios-frame.jsx. ── */

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

</script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; min-height: 100%;
      background: #06050A;
      display: flex; align-items: center; justify-content: center;
    }
    #root {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 100vh;
      padding: 40px 20px;
    }
    :root {
      --bg:    #0E0C12;
      --card:  #171420;
      --hair:  rgba(255,255,255,0.06);
      --ink:   #EDE8E3;
      --ink60: rgba(237,232,227,0.60);
      --ink35: rgba(237,232,227,0.35);
    }

    /* ── each room's own rhythm ─────────────────────────── */

    /* Maya — the wheel of illusion, slow */
    @keyframes glyphRotate   { to { transform: rotate(360deg); } }

    /* Garden — earth breathing */
    @keyframes glyphBreathe  {
      0%,100% { transform: scale(1);    opacity: 0.80; }
      50%      { transform: scale(1.07); opacity: 1.00; }
    }

    /* Descent — ember in darkness */
    @keyframes glyphEmber    {
      0%,100% { opacity: 0.55; }
      50%      { opacity: 1.00; }
    }

    /* Return — star in gentle orbit */
    @keyframes glyphOrbit    {
      0%,100% { transform: rotate(0deg)   scale(1);    opacity: 0.82; }
      33%      { transform: rotate(12deg)  scale(1.05); opacity: 1.00; }
      66%      { transform: rotate(-8deg)  scale(0.97); opacity: 0.88; }
    }

    /* Forgetting — the human loop that stutters */
    @keyframes glyphStutter  {
      0%   { transform: translate(0,0);      opacity: 0.68; }
      14%  { transform: translate(0,0);      opacity: 0.68; }
      16%  { transform: translate(2px,-1px); opacity: 0.50; }
      18%  { transform: translate(-1px,1px); opacity: 0.72; }
      20%  { transform: translate(0,0);      opacity: 0.68; }
      48%  { transform: translate(0,0);      opacity: 0.68; }
      50%  { transform: translate(-2px,1px); opacity: 0.50; }
      52%  { transform: translate(1px,-1px); opacity: 0.72; }
      54%  { transform: translate(0,0);      opacity: 0.68; }
      78%  { transform: translate(0,0);      opacity: 0.50; }
      80%  { transform: translate(1px,2px);  opacity: 0.70; }
      82%  { transform: translate(0,0);      opacity: 0.68; }
      100% { transform: translate(0,0);      opacity: 0.68; }
    }

    /* Remembering — dawn rising slowly */
    @keyframes glyphDawn     {
      0%   { opacity: 0.32; transform: scale(0.94); }
      55%  { opacity: 0.85; transform: scale(1.01); }
      72%  { opacity: 1.00; transform: scale(1.03); }
      84%  { opacity: 1.00; transform: scale(1.03); }
      100% { opacity: 0.32; transform: scale(0.94); }
    }

    /* Body — full 8-second breath */
    @keyframes glyphBreath8  {
      0%,100% { transform: scale(1);    opacity: 0.76; }
      50%      { transform: scale(1.08); opacity: 1.00; }
    }

    /* Thread — the shuttle crossing */
    @keyframes glyphWeave    {
      0%,100% { transform: translateX(0px);  }
      28%      { transform: translateX(6px);  }
      72%      { transform: translateX(-6px); }
    }

    /* Circle — barely perceptible orbit */
    @keyframes glyphCircle   { to { transform: rotate(360deg); } }

    /* Signal — long quiet, then arrival */
    @keyframes glyphSignal   {
      0%,62%  { opacity: 0.36; transform: scale(1); }
      67%     { opacity: 1.00; transform: scale(1.20); }
      72%     { opacity: 0.36; transform: scale(1); }
      100%    { opacity: 0.36; transform: scale(1); }
    }

    /* Forge — assembling from formlessness */
    @keyframes glyphAssemble {
      0%   { opacity: 0.18; transform: scale(0.80); }
      42%  { opacity: 1.00; transform: scale(1.00); }
      70%  { opacity: 1.00; transform: scale(1.00); }
      100% { opacity: 0.18; transform: scale(0.80); }
    }

    /* Field — the Möbius turn */
    @keyframes glyphField    {
      0%   { transform: perspective(100px) rotateY(0deg);   }
      100% { transform: perspective(100px) rotateY(360deg); }
    }

    /* Mirror — the surface catching changing light */
    @keyframes mirrorFace  {
      0%,100% { opacity: 0.60; transform: scale(0.99); }
      50%      { opacity: 1.00; transform: scale(1.03); }
    }

    /* Signal Space — a transmission landing in the dark */
    @keyframes signalLand  {
      0%,60%  { opacity: 0.40; transform: scale(1); }
      68%      { opacity: 1.00; transform: scale(1.18); }
      76%      { opacity: 0.46; transform: scale(1); }
      100%     { opacity: 0.46; transform: scale(1); }
    }

    /* Transition overlays */
    @keyframes overlayIn   { to   { opacity: 0.92; } }
    @keyframes glyphExpand { from { transform: scale(1); } to { transform: scale(11); opacity: 0.35; } }

    div::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ─── The thirteen rooms ─────────────────────────────────── */

const ROOMS = [
  {
    id: 'maya',        name: 'A Maya Game',      color: '#D4AE4A',
    glyph: '◈', gSize: 48, glow: 20,
    anim: 'glyphRotate 26s linear infinite',
  },
  {
    id: 'garden',      name: 'The Garden',        color: '#4A9E6B',
    glyph: '◆', gSize: 44, glow: 16,
    anim: 'glyphBreathe 4.5s ease-in-out infinite',
  },
  {
    id: 'watcher',     name: 'The Watcher',       color: '#7B82D4',
    glyph: '◇', gSize: 42, glow: 13,
    anim: 'none',
  },
  {
    id: 'descent',     name: 'The Descent',       color: '#E5533C',
    glyph: '·', gSize: 34, glow: 24,
    anim: 'glyphEmber 2.8s ease-in-out infinite',
  },
  {
    id: 'return',      name: 'The Return',        color: '#9B6BD6',
    glyph: '✦', gSize: 50, glow: 18,
    anim: 'glyphOrbit 7s ease-in-out infinite',
  },
  {
    id: 'forgetting',  name: 'The Forgetting',    color: '#C4A882',
    glyph: '○', gSize: 44, glow: 13,
    anim: 'glyphStutter 20s ease-in-out infinite',
  },
  {
    id: 'remembering', name: 'The Remembering',   color: '#8AB5A0',
    glyph: '△', gSize: 44, glow: 14,
    anim: 'glyphDawn 9s ease-in-out infinite',
  },
  {
    id: 'body',        name: 'The Body',          color: '#C45A50',
    glyph: '⬡', gSize: 46, glow: 18,
    anim: 'glyphBreath8 8s ease-in-out infinite',
  },
  {
    id: 'thread',      name: 'The Thread',        color: '#C4923A',
    glyph: '⊕', gSize: 44, glow: 15,
    anim: 'glyphWeave 3.5s ease-in-out infinite',
  },
  {
    id: 'circle',      name: 'The Circle',        color: '#D4607A',
    glyph: '◎', gSize: 44, glow: 15,
    anim: 'glyphCircle 42s linear infinite',
  },
  {
    id: 'signal',      name: 'The Signal',        color: '#3AADA8',
    glyph: '✧', gSize: 44, glow: 20,
    anim: 'glyphSignal 7s ease-in-out infinite',
  },
  {
    id: 'forge',       name: 'The Forge',         color: '#D4AE4A',
    glyph: '▲', gSize: 42, glow: 15,
    anim: 'glyphAssemble 5.5s ease-in-out infinite',
  },
  {
    id: 'field',       name: 'The Field',         color: '#9B6BD6',
    glyph: '∞', gSize: 52, glow: 22,
    anim: 'glyphField 10s linear infinite',
  },
];

/* ─── The two turns of the field ─────────────────────────── */
/* Not story-rooms (3rd person) but the spine's other persons:    */
/* the Mirror reflects you (1st), the Signal Space gives to you    */
/* (2nd). They open into their own spaces, not the feed.           */

const TURNS = [
  {
    id: 'mirror', name: 'The Mirror', person: 'first person', color: '#C47A52',
    glyph: '◐', gSize: 30, glow: 18, anim: 'mirrorFace 9s ease-in-out infinite',
    href: 'The Mirror.html', desc: 'What you have already seen, handed back.',
  },
  {
    id: 'signalspace', name: 'The Signal Space', person: 'second person', color: '#3AADA8',
    glyph: '⊙', gSize: 31, glow: 18, anim: 'signalLand 7s ease-in-out infinite',
    href: 'The Signal Space.html', desc: 'One transmission, received whole — then you leave.',
  },
];

/* name style overrides per room */
function nameStyle(room) {
  if (room.id === 'watcher') return { letterSpacing: '0.14em', textTransform: 'uppercase', fontSize: 10 };
  if (['descent','return','field'].includes(room.id)) return { fontStyle: 'italic' };
  return {};
}

/* ─── Portal card ────────────────────────────────────────── */

function PortalCard({ room, onEnter }) {
  const [pressed, setPressed] = React.useState(false);

  return (
    <div
      onPointerDown={() => setPressed(true)}
      onPointerUp={() => { setPressed(false); onEnter(room); }}
      onPointerLeave={() => setPressed(false)}
      onContextMenu={e => e.preventDefault()}
      style={{
        background: `${room.color}0D`,
        border: `1px solid ${room.color}22`,
        borderRadius: 18,
        padding: '22px 8px 16px',
        display: 'flex', flexDirection: 'column',
        alignItems: 'center', gap: 12,
        cursor: 'pointer',
        transform: pressed ? 'scale(0.95)' : 'scale(1)',
        transition: 'transform 0.14s ease',
        userSelect: 'none',
        WebkitTapHighlightColor: 'transparent',
        touchAction: 'none',
      }}
    >
      {/* the living glyph */}
      <div style={{
        width: 56, height: 56,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>
        <span style={{
          fontSize: room.gSize,
          color: room.color,
          lineHeight: 1,
          animation: room.anim,
          filter: `drop-shadow(0 0 ${room.glow}px ${room.color}65)`,
          userSelect: 'none',
          display: 'block',
        }}>{room.glyph}</span>
      </div>

      {/* name */}
      <span style={{
        fontFamily: 'Lora, serif', fontSize: 11,
        color: room.color, opacity: 0.80,
        textAlign: 'center', lineHeight: 1.3,
        letterSpacing: '0.01em',
        ...nameStyle(room),
      }}>{room.name}</span>
    </div>
  );
}

/* ─── A turn-of-the-field card ───────────────────────────── */

function TurnCard({ turn, onEnter }) {
  const [pressed, setPressed] = React.useState(false);
  return (
    <div
      onPointerDown={() => setPressed(true)}
      onPointerUp={() => { setPressed(false); onEnter(turn); }}
      onPointerLeave={() => setPressed(false)}
      onContextMenu={e => e.preventDefault()}
      style={{
        display: 'flex', alignItems: 'center', gap: 16,
        background: `${turn.color}0D`,
        border: `1px solid ${turn.color}22`,
        borderRadius: 18, padding: '15px 18px',
        cursor: 'pointer',
        transform: pressed ? 'scale(0.97)' : 'scale(1)',
        transition: 'transform 0.14s ease',
        userSelect: 'none', WebkitTapHighlightColor: 'transparent', touchAction: 'none',
      }}
    >
      <div style={{ width: 50, height: 50, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <span style={{
          fontSize: turn.gSize, color: turn.color, lineHeight: 1,
          animation: turn.anim, filter: `drop-shadow(0 0 ${turn.glow}px ${turn.color}65)`,
          userSelect: 'none', display: 'block',
        }}>{turn.glyph}</span>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 9 }}>
          <span style={{ fontFamily: 'Lora, serif', fontSize: 15, color: turn.color, opacity: 0.92, letterSpacing: '0.01em' }}>{turn.name}</span>
          <span style={{ fontFamily: 'Space Mono, monospace', fontSize: 8, color: turn.color, opacity: 0.5, letterSpacing: '0.12em', textTransform: 'uppercase' }}>{turn.person}</span>
        </div>
        <span style={{ fontFamily: 'Lora, serif', fontStyle: 'italic', fontSize: 12.5, color: 'var(--ink60)', lineHeight: 1.45, textWrap: 'pretty' }}>{turn.desc}</span>
      </div>
      <span style={{ marginLeft: 'auto', color: `${turn.color}70`, fontSize: 18, lineHeight: 1, flexShrink: 0 }}>›</span>
    </div>
  );
}

/* ─── Selection screen ───────────────────────────────────── */

function RoomSelection() {
  const [entering, setEntering] = React.useState(null);

  function handleEnter(item) {
    if (entering) return;
    setEntering(item);
    const dest = item.href ? item.href : ('Game View.html#' + item.id);
    setTimeout(() => { window.location.href = dest; }, 700);
  }

  const isLastAlone = ROOMS.length % 2 === 1;

  return (
    <div style={{ background: 'var(--bg)', minHeight: '100%', paddingBottom: 52 }}>

      {/* nav */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '66px 16px 0' }}>
        <button onClick={() => { window.location.href = 'Home Feed.html'; }} style={{
          background: 'none', border: 'none', cursor: 'pointer',
          color: 'var(--ink60)', fontSize: 24, lineHeight: 1,
          padding: '2px 6px 2px 0',
        }}>‹</button>
        <span style={{
          fontFamily: 'Space Mono, monospace',
          fontSize: 10, color: 'var(--ink35)',
          letterSpacing: '0.14em',
        }}>THIRTEEN ROOMS</span>
      </div>

      <p style={{
        padding: '10px 20px 22px',
        fontFamily: 'Lora, serif', fontStyle: 'italic',
        fontSize: 13, color: 'var(--ink35)',
        lineHeight: 1.6,
      }}>Each one already alive when you arrive.</p>

      {/* portal grid */}
      <div style={{
        display: 'grid',
        gridTemplateColumns: '1fr 1fr',
        gap: 11,
        padding: '0 16px',
      }}>
        {ROOMS.map((room, i) => {
          const isLast = isLastAlone && i === ROOMS.length - 1;
          if (isLast) {
            return (
              <div key={room.id} style={{
                gridColumn: '1 / -1',
                display: 'flex', justifyContent: 'center',
              }}>
                <div style={{ width: 'calc(50% - 5.5px)' }}>
                  <PortalCard room={room} onEnter={handleEnter} />
                </div>
              </div>
            );
          }
          return <PortalCard key={room.id} room={room} onEnter={handleEnter} />;
        })}
      </div>

      {/* the two turns of the field — Mirror & Signal Space */}
      <div style={{ padding: '30px 16px 0' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
          <div style={{ flex: 1, height: '0.5px', background: 'var(--hair)' }} />
          <span style={{ fontFamily: 'Space Mono, monospace', fontSize: 9, color: 'var(--ink35)', letterSpacing: '0.18em', textTransform: 'uppercase' }}>and the field turns to you</span>
          <div style={{ flex: 1, height: '0.5px', background: 'var(--hair)' }} />
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 11 }}>
          {TURNS.map(t => <TurnCard key={t.id} turn={t} onEnter={handleEnter} />)}
        </div>
      </div>

      {/* entering overlay — glyph expands into the space */}
      {entering && (
        <div style={{
          position: 'fixed', inset: 0, zIndex: 100,
          background: entering.color,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          animation: 'overlayIn 0.70s ease-in forwards',
          opacity: 0,
          pointerEvents: 'none',
        }}>
          <span style={{
            fontSize: 72, color: 'rgba(255,255,255,0.55)',
            lineHeight: 1, display: 'block',
            animation: 'glyphExpand 0.70s ease-in forwards',
            userSelect: 'none',
          }}>{entering.glyph}</span>
        </div>
      )}
    </div>
  );
}

/* ─── App ────────────────────────────────────────────────── */

function App() {
  return (
    <IOSDevice dark={true} width={393} height={852}>
      <RoomSelection />
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
