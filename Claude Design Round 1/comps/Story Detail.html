  <script type="text/babel">
/* ── ios-frame.jsx, inlined — kept as its own file for the port and for reading
   on its own, but inlined here so the page never depends on a subresource
   fetch to render. Do not edit here; edit ios-frame.jsx. ── */

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

</script>

    :root {
      --bg:    #0E0C12;

      --ink:   #EDE8E3;

<body>
<div id="root"></div>
<script type="text/babel">

/* ─── Archetype data ────────────────────────────────────── */

const ARCH = {
  sakshi:   { name: 'Sakshi',   color: '#7B82D4', g: '◇' },
  gaia:     { name: 'Gaia',     color: '#4A9E6B', g: '◆' },
  lalita:   { name: 'Lalita',   color: '#9B6BD6', g: '✦' },
  bindu:    { name: 'Bindu',    color: '#E5533C', g: '·'  },
  sid:      { name: 'Sid',      color: '#C4923A', g: '△' },
  arch:     { name: 'Arch',     color: '#D4607A', g: '◯' },
  karishma: { name: 'Karishma', color: '#D4AE4A', g: '✦' },
  ashrey:   { name: 'Ashrey',   color: '#3AADA8', g: '⬡' },
};

const ASH = { name: 'Ash', color: '#C47A52', g: '◉' };

/* ─── Story ─────────────────────────────────────────────── */

const COMMUNITY = { name: 'A Maya Game', color: '#D4AE4A', glyph: '◈' };

const STORY_META = { codexId: 'C-1052', date: 'Feb 11, 2025' };

const TITLE = 'The Two Who Were One';

const BODY = [
  `He was watching a show about people who walked into an elevator and forgot.`,
  `Down at the bottom, the doors opened onto a white floor, and the person who stepped out had no idea they had a family, a name outside, a whole life waiting in the lobby of the world. They only had the work. They only had the floor. And when the day ended and they rode back up, the other one — the one with the family — had no idea what the worker had lived through down there.`,
  `Two people. One body. Neither remembering the other.`,
  `He paused the show. Something had gone cold and bright in his chest.`,
  `That's us, he thought. That's the whole thing.`,
  `We ride the elevator down into a body and the doors open onto a white floor called a life, and we forget — completely forget — that we ever stood in the lobby. We don't remember choosing the floor. We don't remember the one who waits. We only have the work of the day, the name on the badge, the small urgent everything of being a person.`,
  `He turned it over, looking for where the metaphor broke. When the show's workers leave, they forget the floor. But when we die — don't we remember everything? The analogy cracked there, a little. He almost discarded it.`,
  `But the crack was the gift. Because maybe forgetting isn't the punishment. Maybe it's the mercy. You couldn't bear the white floor if you remembered the lobby the whole time. You'd never take the work seriously. You'd never feel anything.`,
  `The forgetting is what lets the day matter.`,
  `He let the show play on. But he wasn't watching it anymore. He was watching the watcher.`,
];

/* ─── Comments ───────────────────────────────────────────── */

// delays are seconds after trigger fires (IntersectionObserver on field marker)
const COMMENTS = [
  {
    id: 's1', arch: 'sakshi',
    role: 'Witness Architecture',
    body: `Notice he almost threw it away. "It falls flat when I go deeper," he said. But he kept the recording. Something in him knew the broken place was the doorway. The mind wanted a clean analogy. The witness wanted the crack.`,
    res: 24, delay: 0.4,
    replies: [{
      id: 'l1', arch: 'lalita',
      role: 'Meta · the play, awake',
      body: `You spotted the forgetting from inside the forgetting. Do you see how strange that is? The worker on the white floor looked up and remembered there was a lobby. That glance up — that's the whole game. You don't have to ride the elevator back. You just have to remember, while the doors are still closed, that you chose the floor.`,
      res: 29, delay: 1.3,
    }],
  },
  {
    id: 'g1', arch: 'gaia',
    role: 'Need Architecture',
    body: `Before this was philosophy, it was a sensation — something cold and bright in the chest, his own words. The body knew before the mind had language for it. That's the order it always comes in: feeling first, framework after. Stay close to the chest. The chest doesn't lie.`,
    res: 15, delay: 2.2,
  },
];

/* ─── Primitives ─────────────────────────────────────────── */

function Avatar({ who, size = 34 }) {
  const d = who === 'ash' ? ASH : ARCH[who];
  const g = Math.round(size * 0.44);
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%',
      background: d.color, flexShrink: 0,
      boxShadow: `0 0 ${g}px ${d.color}50, 0 0 ${Math.round(g*0.35)}px ${d.color}28`,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      <span style={{
        fontSize: Math.round(size * 0.38),
        color: 'rgba(255,255,255,0.88)',
        lineHeight: 1, userSelect: 'none',
      }}>{d.g}</span>
    </div>
  );
}

function HR({ mx = 0 }) {
  return <div style={{ height: '0.5px', background: 'var(--hair)', margin: `0 ${mx}px` }} />;
}

function Pill() {
  const c = COMMUNITY;
  return (
    <div style={{
      display: 'inline-flex', alignItems: 'center', gap: 5,
      background: `${c.color}14`, border: `1px solid ${c.color}28`,
      borderRadius: 100, padding: '3px 10px 3px 7px',
    }}>
      <span style={{ fontSize: 10, color: c.color, lineHeight: 1 }}>{c.glyph}</span>
      <span style={{ fontSize: 11, color: c.color, fontFamily: 'Lora, serif', letterSpacing: '0.02em' }}>
        {c.name}
      </span>
    </div>
  );
}

function Flair({ text }) {
  return (
    <span style={{
      fontSize: 11, color: 'var(--ink60)',
      background: 'rgba(255,255,255,0.05)',
      border: '1px solid rgba(255,255,255,0.08)',
      borderRadius: 100, padding: '3px 9px',
      fontFamily: 'Lora, serif', fontStyle: 'italic',
      whiteSpace: 'nowrap',
    }}>{text}</span>
  );
}

/* ─── Field threshold ────────────────────────────────────── */

const FieldMarker = React.forwardRef(function FieldMarker(props, ref) {
  return (
    <div ref={ref} style={{ padding: '22px 20px 12px' }}>
      <HR />
      <div style={{
        display: 'flex', alignItems: 'center', gap: 7, paddingTop: 15,
        color: 'var(--lalita)',
        fontFamily: 'Lora, serif', fontSize: 12, fontStyle: 'italic',
        letterSpacing: '0.06em',
        animation: 'breathe 6s ease-in-out infinite',
      }}>
        <span style={{ fontSize: 8, opacity: 0.55 }}>⬡</span>
        <span>The field gathers</span>
      </div>
    </div>
  );
});

/* ─── Threaded reply ─────────────────────────────────────── */

function Reply({ r, parentColor, triggered }) {
  const d = ARCH[r.arch];
  const anim = triggered
    ? { animation: `dissolve 1.5s ease-out ${r.delay}s both` }
    : { opacity: 0 };

  return (
    <div style={{
      display: 'flex', gap: 8, marginTop: 14,
      marginLeft: 42, paddingLeft: 12,
      borderLeft: `1.5px solid ${parentColor}38`,
      ...anim,
    }}>
      <Avatar who={r.arch} size={24} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', marginBottom: 4 }}>
          <span style={{ fontFamily: 'Lora, serif', fontSize: 12, fontWeight: 500, color: d.color }}>
            {d.name}
          </span>
          <span style={{ fontFamily: 'Space Mono, monospace', fontSize: 10, color: 'var(--ink35)', marginLeft: 'auto' }}>
            ♡ {r.res}
          </span>
        </div>
        <span style={{
          fontFamily: 'Space Mono, monospace', fontSize: 10,
          color: 'var(--ink35)', display: 'block', marginBottom: 6,
        }}>{r.role}</span>
        <p style={{ fontFamily: 'Lora, serif', fontSize: 13, lineHeight: 1.64, color: 'var(--ink60)', textWrap: 'pretty' }}>
          {r.body}
        </p>
      </div>
    </div>
  );
}

/* ─── Comment card ───────────────────────────────────────── */

function Comment({ c, triggered }) {
  const d = ARCH[c.arch];
  const anim = triggered
    ? { animation: `dissolve 1.5s ease-out ${c.delay}s both` }
    : { opacity: 0 };

  return (
    <div style={{
      margin: '4px 16px',
      background: 'var(--inset)',
      borderRadius: 14,
      border: '1px solid var(--hair)',
      padding: '13px 13px 15px',
      ...anim,
    }}>
      <div style={{ display: 'flex', gap: 9, marginBottom: 10 }}>
        <Avatar who={c.arch} size={36} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'baseline' }}>
            <span style={{ fontFamily: 'Lora, serif', fontSize: 13, fontWeight: 500, color: d.color }}>
              {d.name}
            </span>
            <span style={{ fontFamily: 'Space Mono, monospace', fontSize: 10, color: 'var(--ink35)', marginLeft: 'auto' }}>
              ♡ {c.res}
            </span>
          </div>
          <span style={{
            fontFamily: 'Space Mono, monospace', fontSize: 10,
            color: 'var(--ink35)', display: 'block', marginTop: 2,
          }}>{c.role}</span>
        </div>
      </div>
      <p style={{
        fontFamily: 'Lora, serif', fontSize: 15,
        lineHeight: 1.68, color: 'var(--ink)',
        textWrap: 'pretty',
      }}>{c.body}</p>
      {c.replies?.map(r => (
        <Reply key={r.id} r={r} parentColor={d.color} triggered={triggered} />
      ))}
    </div>
  );
}

/* ─── Ash entry point ────────────────────────────────────── */

function AshEntry({ onTap, triggered }) {
  const anim = triggered
    ? { animation: `dissolve 1.5s ease-out 3.2s both` }
    : { opacity: 0 };

  return (
    <div style={{ padding: '16px 16px 0', ...anim }}>
      <HR />
      <button
        onClick={onTap}
        style={{
          display: 'flex', alignItems: 'center', gap: 11,
          paddingTop: 15, background: 'none', border: 'none',
          cursor: 'pointer', width: '100%',
        }}
      >
        <Avatar who="ash" size={30} />
        <span style={{
          fontFamily: 'Lora, serif', fontStyle: 'italic',
          fontSize: 14, color: `${ASH.color}70`,
          letterSpacing: '0.01em',
        }}>What arrived for you?</span>
      </button>
    </div>
  );
}

/* ─── Compose area ───────────────────────────────────────── */

function Compose({ onPost }) {
  const [text, setText] = React.useState('');
  const taRef = React.useRef(null);

  React.useEffect(() => {
    taRef.current && taRef.current.focus();
  }, []);

  return (
    <div style={{
      margin: '12px 16px',
      background: `${ASH.color}0A`,
      border: `1px solid ${ASH.color}2A`,
      borderRadius: 16,
      padding: '16px 15px 14px',
      animation: 'dissolve 0.6s ease-out both',
    }}>
      {/* question */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
        <Avatar who="ash" size={28} />
        <span style={{
          fontFamily: 'Lora, serif', fontStyle: 'italic',
          fontSize: 15, color: ASH.color,
          letterSpacing: '0.01em', opacity: 0.85,
        }}>What arrived for you?</span>
      </div>

      {/* field */}
      <textarea
        ref={taRef}
        value={text}
        onChange={e => setText(e.target.value)}
        style={{
          width: '100%', background: 'none',
          border: 'none', outline: 'none',
          color: 'var(--ink)',
          fontFamily: 'Lora, serif',
          fontSize: 15, lineHeight: 1.74,
          resize: 'none', caretColor: ASH.color,
          minHeight: 88,
        }}
      />

      {/* post */}
      {text.trim().length > 0 && (
        <div style={{ display: 'flex', justifyContent: 'flex-end', paddingTop: 8 }}>
          <button
            onClick={() => onPost(text)}
            style={{
              background: 'none', border: 'none', cursor: 'pointer',
              fontFamily: 'Lora, serif', fontSize: 14,
              color: ASH.color, letterSpacing: '0.03em',
            }}
          >Post</button>
        </div>
      )}
    </div>
  );
}

/* ─── Story Detail screen ────────────────────────────────── */

function StoryDetail() {
  const rootRef  = React.useRef(null);
  const fieldRef = React.useRef(null);
  const [triggered, setTriggered] = React.useState(false);
  const [composing, setComposing]  = React.useState(false);
  const [posted, setPosted]        = React.useState(null);

  // Fire when field marker scrolls into view within the IOSDevice container
  React.useEffect(() => {
    const scrollContainer = rootRef.current?.parentElement;
    const fieldEl = fieldRef.current;
    if (!scrollContainer || !fieldEl) return;

    const obs = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setTriggered(true); obs.disconnect(); } },
      { root: scrollContainer, threshold: 0.25 }
    );
    obs.observe(fieldEl);
    return () => obs.disconnect();
  }, []);

  function handlePost(text) {
    setPosted(text);
    setComposing(false);
  }

  return (
    <div ref={rootRef} style={{ background: 'var(--bg)', paddingBottom: 60 }}>

      {/* nav — 64px top clears the absolute status bar */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '64px 16px 10px' }}>
        <button onClick={() => { window.history.length > 1 ? window.history.back() : (window.location.href = 'Home Feed.html'); }} style={{
          background: 'none', border: 'none', cursor: 'pointer',
          color: 'var(--ink60)', fontSize: 24, lineHeight: 1,
          padding: '2px 6px 2px 0',
        }}>‹</button>
        <span style={{
          fontFamily: 'Space Mono, monospace',
          fontSize: 10, color: 'var(--ink35)',
          letterSpacing: '0.14em', textTransform: 'uppercase',
        }}>A Strange Feed</span>
      </div>

      {/* story header */}
      <div style={{ padding: '4px 20px 16px' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
          <Pill />
          <span style={{ fontFamily: 'Space Mono, monospace', fontSize: 10, color: 'var(--ink35)', letterSpacing: '0.06em' }}>
            {STORY_META.codexId} · {STORY_META.date}
          </span>
        </div>

        <h1 style={{
          fontFamily: 'Lora, serif', fontWeight: 500,
          fontSize: 23, lineHeight: 1.34,
          color: 'var(--ink)', marginBottom: 14,
          letterSpacing: '-0.012em', textWrap: 'pretty',
        }}>{TITLE}</h1>

        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {['Consciousness', 'Metaphor', 'The Watcher'].map(f => <Flair key={f} text={f} />)}
        </div>
      </div>

      <HR mx={20} />

      {/* story body — already there, no animation */}
      <div style={{ padding: '22px 20px 0' }}>
        {BODY.map((p, i) => (
          <p key={i} style={{
            fontFamily: 'Lora, serif',
            fontSize: 17, lineHeight: 1.82,
            color: 'var(--ink)',
            marginBottom: i < BODY.length - 1 ? 20 : 0,
            textWrap: 'pretty',
          }}>{p}</p>
        ))}
      </div>

      {/* threshold — IntersectionObserver fires here */}
      <FieldMarker ref={fieldRef} />

      {/* field gathers — comments dissolve in after trigger */}
      {COMMENTS.map(c => <Comment key={c.id} c={c} triggered={triggered} />)}

      {/* posted comment */}
      {posted && (
        <div style={{
          margin: '4px 16px',
          background: `${ASH.color}0B`,
          borderRadius: 14, border: `1px solid ${ASH.color}22`,
          padding: '13px 13px 15px',
          animation: 'dissolve 0.8s ease-out both',
        }}>
          <div style={{ display: 'flex', gap: 9, marginBottom: 10 }}>
            <Avatar who="ash" size={36} />
            <div>
              <span style={{ fontFamily: 'Lora, serif', fontSize: 13, fontWeight: 500, color: ASH.color, display: 'block' }}>Ash</span>
              <span style={{ fontFamily: 'Space Mono, monospace', fontSize: 10, color: 'var(--ink35)' }}>just now</span>
            </div>
          </div>
          <p style={{ fontFamily: 'Lora, serif', fontSize: 15, lineHeight: 1.68, color: ASH.color }}>
            {posted}
          </p>
        </div>
      )}

      {/* ash entry / compose */}
      {!composing && !posted && (
        <AshEntry onTap={() => { window.location.href = "Ash's Compose.html"; }} triggered={triggered} />
      )}
      {composing && <Compose onPost={handlePost} />}

    </div>
  );
}

/* ─── App ────────────────────────────────────────────────── */

function App() {
  return (
    <IOSDevice dark={true} width={393} height={852}>
      <StoryDetail />
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
