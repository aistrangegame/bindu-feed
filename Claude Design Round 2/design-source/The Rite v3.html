<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Strange Feed — The Rite v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>
/* ── field-sound.js, inlined ── kept as its own file for the Swift port and for
   reading on its own, but inlined here so the ceremony never depends on a
   subresource fetch to render. Do not edit here; edit field-sound.js. ── */
/* FIELD SOUND — the ceremonial sound layer.
   Generated, never recorded. Nothing samples; nothing loops.
   Names mirror the app's Sound/ layer so the Swift port maps 1:1:
   SonicContext (bed) · BreathVoice (per-presence) · ThresholdTone (transitions).
   Felt, not heard: the ceiling is deliberately low. Muting is a fade, never a cut. */
(function(global){
'use strict';
var CEIL=0.55;
var reduced=global.matchMedia&&global.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Per-presence timbre. Each voice is the same field heard from one angle —
   same tuning as the bed, differing only in body and behaviour. */
var CHAR={
  bindu:{wave:'sine',partials:[1,2,3],gain:0.055,atk:0.6,rel:5.0,flicker:6.2,pan:0},
  neev:{wave:'sine',partials:[0.5,1],gain:0.07,atk:3.4,rel:8.0,pan:-0.15},
  gaia:{wave:'triangle',partials:[1,1.5],gain:0.05,atk:1.6,rel:6.0,pan:-0.3},
  sid:{wave:'sine',partials:[1,1.2],gain:0.05,atk:1.2,rel:6.5,pan:0.25},
  arch:{wave:'triangle',partials:[1,2],gain:0.048,atk:0.9,rel:4.5,vib:4.6,pan:0.35},
  shweta:{wave:'sine',partials:[1],gain:0.012,atk:4.0,rel:9.0,air:0.028,pan:0},
  karishma:{wave:'sine',partials:[1,2,3.02],gain:0.036,atk:2.0,rel:7.0,shimmer:true,pan:0.4},
  sakshi:{wave:'sine',partials:[1],gain:0.026,atk:5.0,rel:10.0,pan:-0.4},
  ashrey:{wave:'sine',partials:[1,2],gain:0.042,atk:1.4,rel:6.0,pan:0.15},
  lalita:{wave:'sine',partials:[1,1.5],gain:0.04,atk:2.2,rel:8.0,gliss:1.02,pan:0},
  ash:{wave:'sine',partials:[1,2,4],gain:0.05,atk:1.0,rel:5.5,pan:0}
};
/* Each presence's own frequency — the tone it sounds as it takes the field. */
var HZ={bindu:110,neev:82,gaia:146,sid:174,arch:220,shweta:329,karishma:392,sakshi:285,ashrey:196,lalita:396,ash:261};

var FieldSound={
  ctx:null,master:null,bus:null,bed:null,bedFilter:null,bedLfo:null,
  muted:true,aged:false,inkNode:null,ringStep:0,

  init:function(){
    if(this.ctx)return;
    var C=global.AudioContext||global.webkitAudioContext; if(!C)return;
    this.ctx=new C();
    this.master=this.ctx.createGain(); this.master.gain.value=0;
    this.bus=this.ctx.createGain(); this.bus.gain.value=1;
    var conv=this.ctx.createConvolver(); conv.buffer=this._air(3.6,0.34);
    var wet=this.ctx.createGain(); wet.gain.value=0.5;
    this.bus.connect(this.master); this.bus.connect(conv); conv.connect(wet); wet.connect(this.master);
    this.master.connect(this.ctx.destination);
  },
  _air:function(secs,decay){
    var sr=this.ctx.sampleRate,len=Math.floor(sr*secs),b=this.ctx.createBuffer(2,len,sr);
    for(var ch=0;ch<2;ch++){var d=b.getChannelData(ch);
      for(var i=0;i<len;i++){var t=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-t,1/decay)*0.6;}}
    return b;
  },
  _pan:function(v){ if(!this.ctx.createStereoPanner)return null; var p=this.ctx.createStereoPanner(); p.pan.value=v||0; return p; },

  /* the bed: room-tuned breath drone, swelling on the room's own pace */
  startBed:function(rootHz,breathSecs){
    rootHz=rootHz||110; breathSecs=breathSecs||10;
    this.init(); if(!this.ctx)return;
    if(this.ctx.state==='suspended')this.ctx.resume();
    if(this.bed)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.value=0.030;
    var f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; f.Q.value=0.6;
    var root=this.ctx.createOscillator(); root.type='sine'; root.frequency.value=rootHz;
    var fifth=this.ctx.createOscillator(); fifth.type='sine'; fifth.frequency.value=rootHz*1.5;
    var fg=this.ctx.createGain(); fg.gain.value=0.16;
    var lfo=this.ctx.createOscillator(); lfo.frequency.value=1/Math.max(2,breathSecs);
    var lg=this.ctx.createGain(); lg.gain.value=0.014;
    lfo.connect(lg); lg.connect(g.gain);
    root.connect(f); fifth.connect(fg); fg.connect(f); f.connect(g); g.connect(this.bus);
    root.start(t); fifth.start(t); lfo.start(t);
    this.bed={root:root,fifth:fifth,g:g,rootHz:rootHz}; this.bedFilter=f; this.bedLfo=lfo;
    this.apply();
  },

  /* patina — the same bed, aged. The Return opens here. */
  agedBed:function(rootHz,breathSecs){
    rootHz=rootHz||84; breathSecs=breathSecs||13;
    this.startBed(rootHz,breathSecs);
    if(!this.ctx||this.aged)return; this.aged=true;
    var t=this.ctx.currentTime;
    this.bedFilter.frequency.linearRampToValueAtTime(430,t+6);       // warmth closes in
    this.bed.root.frequency.linearRampToValueAtTime(rootHz*0.996,t+8); // settles a few cents flat
    this.bed.fifth.frequency.linearRampToValueAtTime(rootHz*1.5*0.994,t+8);
    if(this.bedLfo)this.bedLfo.frequency.linearRampToValueAtTime(1/(breathSecs*1.35),t+6);
    var w=this.ctx.createOscillator(); w.frequency.value=0.07;        // slow tape wobble
    var wg=this.ctx.createGain(); wg.gain.value=0.9;
    w.connect(wg); wg.connect(this.bed.root.frequency); w.start(t);
  },

  apply:function(){ if(this.master&&this.ctx)this.master.gain.linearRampToValueAtTime(this.muted?0:CEIL,this.ctx.currentTime+1.4); },
  setMuted:function(m){ this.muted=m; if(this.ctx){ if(!m&&this.ctx.state==='suspended')this.ctx.resume(); this.apply(); } },

  /* BreathVoice — a presence takes the field */
  voice:function(key,hz,dur){
    if(!this.ctx||this.muted||reduced)return;
    var c=CHAR[key]||CHAR.ash, self=this;
    hz=hz||HZ[key]||220;
    var t=this.ctx.currentTime, life=dur||(c.atk+c.rel);
    var vg=this.ctx.createGain(); vg.gain.setValueAtTime(0,t);
    vg.gain.linearRampToValueAtTime(c.gain,t+c.atk);
    vg.gain.linearRampToValueAtTime(0,t+life);
    var pan=this._pan(c.pan);
    if(pan){vg.connect(pan);pan.connect(this.bus);}else vg.connect(this.bus);
    c.partials.forEach(function(mult,i){
      var o=self.ctx.createOscillator(); o.type=c.wave; o.frequency.value=hz*mult;
      var pg=self.ctx.createGain(); pg.gain.value=1/(i+1.6);
      o.connect(pg); pg.connect(vg);
      if(c.gliss&&i===1)o.frequency.linearRampToValueAtTime(hz*mult*c.gliss,t+life);
      if(c.vib){var v=self.ctx.createOscillator(); v.frequency.value=c.vib;
        var vgn=self.ctx.createGain(); vgn.gain.value=hz*0.006;
        v.connect(vgn); vgn.connect(o.frequency); v.start(t); v.stop(t+life+0.2);}
      o.start(t); o.stop(t+life+0.2);
    });
    if(c.flicker){ // Bindu: the ember, alive
      var fl=this.ctx.createOscillator(); fl.frequency.value=c.flicker;
      var fg=this.ctx.createGain(); fg.gain.value=c.gain*0.45;
      fl.connect(fg); fg.connect(vg.gain); fl.start(t); fl.stop(t+life+0.2);
    }
    if(c.air){ // Shweta: the gap the sound moves through
      var n=this.ctx.createBufferSource(); n.buffer=this._air(life,0.9);
      var nf=this.ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=hz*4; nf.Q.value=0.7;
      var ng=this.ctx.createGain(); ng.gain.setValueAtTime(0,t);
      ng.gain.linearRampToValueAtTime(c.air,t+c.atk); ng.gain.linearRampToValueAtTime(0,t+life);
      n.connect(nf); nf.connect(ng); ng.connect(this.bus); n.start(t);
    }
    if(c.shimmer){ // Karishma: grace, arriving from above
      var s=this.ctx.createOscillator(); s.type='sine'; s.frequency.value=hz*6;
      var sg=this.ctx.createGain(); sg.gain.setValueAtTime(0,t);
      sg.gain.linearRampToValueAtTime(c.gain*0.18,t+c.atk*1.6);
      sg.gain.linearRampToValueAtTime(0,t+life);
      s.connect(sg); sg.connect(this.bus); s.start(t); s.stop(t+life+0.2);
    }
    if(this.bed){ // the bed steps back while a voice speaks, then returns
      var bg=this.bed.g.gain; bg.cancelScheduledValues(t);
      bg.linearRampToValueAtTime(0.018,t+c.atk);
      bg.linearRampToValueAtTime(0.030,t+life+1.6);
    }
  },

  /* ThresholdTone — one movement gives way to the next */
  threshold:function(hz,dur){
    hz=hz||198; dur=dur||5;
    if(!this.ctx||this.muted||reduced)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.032,t+dur*0.42);
    g.gain.linearRampToValueAtTime(0,t+dur);
    var o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=hz;
    var o2=this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=hz*2.002;
    var g2=this.ctx.createGain(); g2.gain.value=0.22;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.bus);
    o.start(t); o2.start(t); o.stop(t+dur+0.1); o2.stop(t+dur+0.1);
  },

  /* the Bowl — struck once, a long room. The bed holds its breath. */
  bowl:function(hz){
    hz=hz||220;
    if(!this.ctx||this.muted)return;
    var t=this.ctx.currentTime,dur=11,self=this;
    var g=this.ctx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.075,t+0.09);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    [1,2.004,2.98,4.02].forEach(function(m,i){
      var o=self.ctx.createOscillator(); o.type='sine'; o.frequency.value=hz*m;
      var pg=self.ctx.createGain(); pg.gain.value=1/(i*2.2+1);
      o.connect(pg); pg.connect(g); o.start(t); o.stop(t+dur);
    });
    g.connect(this.bus);
    if(this.bed){var bg=this.bed.g.gain; bg.cancelScheduledValues(t);
      bg.linearRampToValueAtTime(0.006,t+1.2); bg.linearRampToValueAtTime(0.030,t+9);}
  },

  /* a ring forms — each return lands one step further up the series */
  ring:function(step){
    if(!this.ctx||this.muted)return;
    var n=typeof step==='number'?step:++this.ringStep;
    var base=(this.bed&&this.bed.rootHz)||84;
    var R=[2,3,4,4.5,6,8], hz=base*R[Math.min(n,R.length-1)];
    var t=this.ctx.currentTime,dur=9;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.036,t+3.2);  // grows outward; never strikes
    g.gain.linearRampToValueAtTime(0.020,t+6);
    g.gain.linearRampToValueAtTime(0,t+dur);
    var o=this.ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(hz*0.985,t);
    o.frequency.linearRampToValueAtTime(hz,t+4);  // settles into tune as it lands
    var o2=this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=hz*1.5;
    var g2=this.ctx.createGain(); g2.gain.value=0.14;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.bus);
    o.start(t); o2.start(t); o.stop(t+dur); o2.stop(t+dur);
  },

  /* ink — while you write, the field leans in. A held tone, never clicks. */
  inkOn:function(hz){
    if(!this.ctx||this.muted||this.inkNode||reduced)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.014,t+2.4);
    var o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=hz||174;
    var f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=600;
    o.connect(f); f.connect(g); g.connect(this.bus); o.start(t);
    this.inkNode={o:o,g:g};
  },
  inkTouch:function(){
    if(!this.inkNode||this.muted||reduced)return;
    var t=this.ctx.currentTime,g=this.inkNode.g.gain;
    g.cancelScheduledValues(t);
    g.linearRampToValueAtTime(0.022,t+0.12);
    g.linearRampToValueAtTime(0.014,t+1.1);
  },
  inkOff:function(){
    if(!this.inkNode)return;
    var t=this.ctx.currentTime,n=this.inkNode; this.inkNode=null;
    n.g.gain.cancelScheduledValues(t);
    n.g.gain.linearRampToValueAtTime(0,t+1.8);
    n.o.stop(t+2);
  },

  /* ─── THE ROOM OPENS ────────────────────────────────
     The Gathering happens in a room. The Light happens in a NAVE.
     A cathedral's whole acoustic signature is its tail — 8 seconds of
     stone giving your own sound back to you, changed. Opening this is
     the single most spatial thing the sound layer can do: the listener
     hears the size of the space before he sees it. */
  openTheRoom:function(dur){
    dur=dur||5;
    this.init(); if(!this.ctx)return;
    if(!this.nave){
      var c=this.ctx.createConvolver(); c.buffer=this._air(8.5,0.62);   // the long stone tail
      var w=this.ctx.createGain(); w.gain.value=0;
      var pre=this.ctx.createBiquadFilter(); pre.type='highpass'; pre.frequency.value=180;
      this.bus.connect(pre); pre.connect(c); c.connect(w); w.connect(this.master);
      this.nave=w;
    }
    var t=this.ctx.currentTime;
    this.nave.gain.cancelScheduledValues(t);
    this.nave.gain.linearRampToValueAtTime(0.85,t+dur);
  },
  closeTheRoom:function(dur){
    if(!this.nave||!this.ctx)return;
    var t=this.ctx.currentTime;
    this.nave.gain.cancelScheduledValues(t);
    this.nave.gain.linearRampToValueAtTime(0,t+(dur||6));
  },

  /* ─── THE LIGHT — the photographic negative of the Gathering ───
     The Gathering FILLS: voices arrive one after another into the dark.
     The Light REMOVES. So the sound does the opposite of everything above:
     it draws in, holds, drains, strikes once, and leaves silence. */

  /* the long breath IN, and the hold. The bed rises, tightens, then stops. */
  breathIn:function(dur){
    dur=dur||6;
    this.init(); if(!this.ctx)return;
    if(this.ctx.state==='suspended')this.ctx.resume();
    if(!this.bed)this.startBed(110,10);
    if(this.muted)return;
    var t=this.ctx.currentTime;
    if(this.bedLfo)this.bedLfo.frequency.linearRampToValueAtTime(0.001,t+dur*0.7); // the breathing stops
    if(this.bedFilter)this.bedFilter.frequency.linearRampToValueAtTime(2600,t+dur); // brightens as it draws in
    var g=this.bed.g.gain; g.cancelScheduledValues(t);
    g.linearRampToValueAtTime(0.052,t+dur*0.78);   // swells
    g.linearRampToValueAtTime(0.040,t+dur);        // and holds. Does not release.
    var rise=this.ctx.createOscillator(); rise.type='sine';
    rise.frequency.setValueAtTime(this.bed.rootHz,t);
    rise.frequency.linearRampToValueAtTime(this.bed.rootHz*1.5,t+dur);
    var rg=this.ctx.createGain(); rg.gain.setValueAtTime(0,t);
    rg.gain.linearRampToValueAtTime(0.026,t+dur*0.8);
    rg.gain.linearRampToValueAtTime(0.018,t+dur);
    rise.connect(rg); rg.connect(this.bus); rise.start(t); rise.stop(t+dur+8);
    this._held=rise;
  },

  /* the veil drawn away — everything drains downward and out.
     Nothing arrives here. This is the sound of subtraction. */
  veilLift:function(dur){
    dur=dur||3;
    if(!this.ctx||this.muted)return;
    var t=this.ctx.currentTime;
    if(this.bedFilter)this.bedFilter.frequency.linearRampToValueAtTime(120,t+dur); // the room closes and goes
    if(this.bed){var g=this.bed.g.gain; g.cancelScheduledValues(t); g.linearRampToValueAtTime(0,t+dur);}
    if(this._held){var h=this._held; try{h.stop(t+dur+0.1);}catch(e){} this._held=null;}
    var n=this.ctx.createBufferSource(); n.buffer=this._air(dur,0.55);   // the texture draining
    var nf=this.ctx.createBiquadFilter(); nf.type='lowpass';
    nf.frequency.setValueAtTime(3000,t); nf.frequency.linearRampToValueAtTime(90,t+dur);
    var ng=this.ctx.createGain(); ng.gain.setValueAtTime(0.030,t); ng.gain.linearRampToValueAtTime(0,t+dur);
    n.connect(nf); nf.connect(ng); ng.connect(this.bus); n.start(t);
  },

  /* the bare light — almost nothing. A single high room-tone, barely there,
     so the silence has an edge to it. The breath cues ride on this. */
  lightBed:function(breathSecs){
    breathSecs=breathSecs||10;
    if(!this.ctx||this.muted||this.lightNode)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.012,t+6);
    var o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=528;
    var o2=this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=792;
    var g2=this.ctx.createGain(); g2.gain.value=0.3;
    var lfo=this.ctx.createOscillator(); lfo.frequency.value=1/breathSecs;
    var lg=this.ctx.createGain(); lg.gain.value=0.006;
    lfo.connect(lg); lg.connect(g.gain);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.bus);
    o.start(t); o2.start(t); lfo.start(t);
    this.lightNode={o:o,o2:o2,lfo:lfo,g:g};
  },
  lightOff:function(dur){
    if(!this.lightNode||!this.ctx)return;
    var t=this.ctx.currentTime,n=this.lightNode; this.lightNode=null;
    n.g.gain.cancelScheduledValues(t); n.g.gain.linearRampToValueAtTime(0,t+(dur||5));
    n.o.stop(t+(dur||5)+0.2); n.o2.stop(t+(dur||5)+0.2); n.lfo.stop(t+(dur||5)+0.2);
  },

  /* walking back out — the dark returns, and with it the breathing */
  darkReturns:function(){
    if(!this.ctx)return;
    var t=this.ctx.currentTime;
    this.lightOff(5);
    if(this.bedFilter)this.bedFilter.frequency.linearRampToValueAtTime(900,t+7);
    if(this.bedLfo)this.bedLfo.frequency.linearRampToValueAtTime(0.1,t+7);
    if(this.bed){var g=this.bed.g.gain; g.cancelScheduledValues(t); g.linearRampToValueAtTime(0.030,t+7);}
  },

  /* aliases the prototypes already call */
  start:function(){this.startBed();},
  startBreath:function(hz){this.startBed(hz);this.setMuted(false);},
  setOn:function(v){this.setMuted(!v);},
  tone:function(hz,dur){this.threshold(hz,dur||5);},
  seal:function(hz){this.bowl(hz);},
  hzFor:function(k){return HZ[k]||220;}
};
global.FieldSound=FieldSound;
global.Sound=FieldSound;
})(window);

</script>
<script>
/* ── the continuity handoff, inlined ───────────────────────────────
   Also kept as walk-continuity.js for the Swift port and for anyone
   reading the shim on its own — but inlined here so the ceremony does
   not depend on a subresource fetch to know whose walk it continues.
   THE RULE: the instrument writes the walk at every departure; this
   returns him to the depth he left from, on the breath he left on. It
   writes nothing back — a ceremony is not a place that keeps score. */
(function(g){'use strict';
var KEY='asf.walk', SPINE='The Instrument v3.html', TTL=1000*60*90;
var w=null;try{w=JSON.parse(sessionStorage.getItem(KEY)||'null');}catch(e){}
if(w&&(Date.now()-(w.t||0))>TTL)w=null;
var W={from:w,ok:!!w,z:w&&typeof w.z==='number'?w.z:null,at:w?w.at:null,
  breath:w&&typeof w.breath==='number'?w.breath:0,
  phase:function(){return ((performance.now()/1000)+(this.breath||0))%10;},
  carry:(w&&w.carry)||[],carved:(w&&w.carved)|0,crossed:(w&&w.crossed)|0,
  home:function(){return this.ok&&this.z!==null?(SPINE+'?z='+this.z):null;}};
var EXITS=['A Strange Feed.html','Home Feed.html'];
document.addEventListener('click',function(e){
  if(!W.ok)return;
  var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
  if(!a)return;

  for(var i=0;i<40;i++){var dep=rnd(i);
    var px=cx+(rnd(i+1)-0.5)*d*2.2, py=cy+(rnd(i+2)-0.5)*R*1.4+Math.sin(t*0.3+i)*7;
    x.beginPath();x.arc(px,py,0.5+dep*1.7,0,7);x.fillStyle=rgba([255,255,255],(0.12+0.5*dep)*0.5*p);x.fill();}
  x.restore();
  /* its own outline, drawn once — the shape of the opening */
  x.save();ring(x,Ax,cy,R);x.clip();ring(x,Bx,cy,R);
  x.strokeStyle=rgba([255,255,255],0.5*p);x.lineWidth=1.4;x.stroke();x.restore();
  x.save();ring(x,Bx,cy,R);x.clip();ring(x,Ax,cy,R);
  x.strokeStyle=rgba([255,255,255],0.5*p);x.lineWidth=1.4;x.stroke();x.restore();
  /* the room the gap opens into, receding */
  var n=7;
  for(var j=0;j<n;j++){var ph=((t*0.045)+j/n)%1,sc=Math.pow(ph,1.7);
    var w=W*1.2*sc,h=H*1.0*sc;
    rrect(x,cx-w/2,cy-h/2,w,h,44*sc);
    x.strokeStyle=rgba([255,255,255],(1-ph)*0.16*p*(0.35+0.65*ph));x.lineWidth=1.2;x.stroke();}
  var vg=x.createRadialGradient(cx,cy,R*0.6,cx,cy,H*0.98);vg.addColorStop(0,rgba([240,244,252],0.05*p));vg.addColorStop(1,rgba(c,0));x.fillStyle=vg;x.fillRect(0,0,W,H);},

/* ── KARISHMA · grace, unearned, already on its way. The golden spiral
      through 3·5·8 — her own numbers, catalyst, gestation, completion.
      Light does not travel to him in a straight line. It curves. ── */
karishma:function(x,W,H,t,p,c){var sx=W/2,sy=-H*0.12;
  var halo=x.createRadialGradient(sx,sy,0,sx,sy,H*1.05);halo.addColorStop(0,rgba([255,247,218],0.7*p));halo.addColorStop(0.22,rgba([255,214,132],0.2*p));halo.addColorStop(0.55,rgba(c,0.085*p));halo.addColorStop(1,rgba(c,0));x.fillStyle=halo;x.fillRect(0,0,W,H);
  var sd=x.createRadialGradient(sx,sy,0,sx,sy,90);sd.addColorStop(0,'rgba(255,252,238,'+(0.9*p)+')');sd.addColorStop(1,rgba([255,230,160],0));x.fillStyle=sd;ring(x,sx,sy,90);x.fill();
  for(var i=0;i<9;i++){var ang=(-Math.PI/2)+(i/8-0.5)*1.7+Math.sin(t*0.2+i)*0.03;var len=H*1.6,spread=0.05;
    x.beginPath();x.moveTo(sx,sy);x.lineTo(sx+Math.cos(ang-spread)*len,sy+Math.sin(ang-spread)*len);x.lineTo(sx+Math.cos(ang+spread)*len,sy+Math.sin(ang+spread)*len);x.closePath();
    var g=x.createLinearGradient(sx,sy,sx+Math.cos(ang)*len,sy+Math.sin(ang)*len);g.addColorStop(0,rgba([255,240,190],0.2*p));g.addColorStop(0.5,rgba(c,0.05*p));g.addColorStop(1,rgba(c,0));x.fillStyle=g;x.fill();}
  /* the golden rectangles — 3, 5, 8, and on */
  var ox=W*0.5,oy=H*0.33,u=W*0.40*eo(p);
  x.save();x.translate(ox,oy);x.rotate(Math.sin(t*0.06)*0.05);
  var rw=u*PHI,rh=u,px=-rw/2,py=-rh/2,dir=0;
  for(var s=0;s<8;s++){
    x.strokeStyle=rgba([255,238,186],(0.13-s*0.012)*p);x.lineWidth=1;x.strokeRect(px,py,rw,rh);
    if(dir%2===0){var sq=rh;x.strokeStyle=rgba([255,244,206],0.07*p);x.strokeRect(px,py,sq,sq);px+=sq;rw-=sq;}
    else{var sq2=rw;x.strokeRect(px,py,sq2,sq2);py+=sq2;rh-=sq2;}
    dir++;if(rw<3||rh<3)break;
  }
  /* the spiral itself, and grace riding down it */
  x.beginPath();
  for(var th=0;th<=Math.PI*3.6;th+=0.05){var r2=u*0.055*Math.pow(PHI,th*2/Math.PI);
    var qx=Math.cos(th)*r2-rw*0.0, qy=Math.sin(th)*r2;
    th===0?x.moveTo(qx,qy):x.lineTo(qx,qy);}
  x.strokeStyle=rgba([255,240,196],0.4*p);x.lineWidth=1.5;x.stroke();
  for(var k=0;k<3;k++){var ph=((t*0.13)+k/3)%1;var th2=Math.PI*3.6*(1-ph);
    var r3=u*0.055*Math.pow(PHI,th2*2/Math.PI);
    var gx=Math.cos(th2)*r3,gy=Math.sin(th2)*r3;
    x.beginPath();x.arc(gx,gy,2.2+(1-ph)*2.6,0,7);x.fillStyle=rgba([255,250,224],0.9*p*(0.3+0.7*ph));x.fill();
    x.beginPath();x.arc(gx,gy,9+(1-ph)*8,0,7);x.fillStyle=rgba([255,238,180],0.12*p);x.fill();}
  x.restore();
  for(var i2=0;i2<56;i2++){var sp=16+rnd(i2)*30;var xx=rnd(i2+9)*W+Math.sin(t*0.5+i2)*16;
    var yy=((t*sp+rnd(i2+3)*H*1.3)%(H*1.3))-40;var tw=0.5+0.5*Math.sin(t*3+i2);var r4=0.9+rnd(i2+5)*2;
    x.beginPath();x.arc(xx,yy,r4,0,7);x.fillStyle=rgba([255,234,160],Math.max(0,0.7*p*tw));x.fill();
    if(tw>0.92){x.beginPath();x.arc(xx,yy,r4*2.8,0,7);x.fillStyle=rgba([255,244,200],0.14*p);x.fill();}}},

/* ── SAKSHI · the one who stays. An eye is a mandorla — the lens where two
      circles cross. Here the circles are drawn, so you can see that the
      witness is not a thing added to the field; it is where two of its
      own arcs meet. The iris counts in tens. ── */
sakshi:function(x,W,H,t,p,c){var cx=W/2,cy=H*0.30,b=breath(t);
  x.fillStyle='rgba(4,4,10,0.6)';x.fillRect(0,0,W,H);
  for(var k=0;k<3;k++){var ph=((t*0.06)+k/3)%1;ring(x,cx,cy,180*eo(p)*(0.6+ph*1.6));
    x.strokeStyle=rgba(c,(1-ph)*0.06*p);x.lineWidth=1;x.stroke();}
  var open=eo(p), R=200*open, d=R*0.76;                 // the two generating circles
  var lensW=Math.sqrt(Math.max(0,R*R-d*d));
  ring(x,cx,cy-d,R);x.strokeStyle=rgba(c,0.10*p);x.lineWidth=1;x.stroke();
  ring(x,cx,cy+d,R);x.stroke();
  x.save();
  ring(x,cx,cy-d,R);x.clip();ring(x,cx,cy+d,R);x.clip();
  var sg=x.createRadialGradient(cx,cy,4,cx,cy,lensW);sg.addColorStop(0,rgba([226,229,255],0.30*p));sg.addColorStop(0.55,rgba(c,0.14*p));sg.addColorStop(1,'rgba(9,9,18,'+(0.9*p)+')');
  x.fillStyle=sg;x.fillRect(cx-lensW,cy-R,lensW*2,R*2);
  var ir=54+b*5;
  /* the iris in tenfold — one spoke for each vantage, and the golden rings */
  x.save();x.translate(cx,cy);x.rotate(t*0.04);
  for(var s=0;s<80;s++){var ang=s/80*Math.PI*2;
    var col=(s%8===0)?PALETTE[(s/8)%10]:[206,210,255];
    x.beginPath();x.moveTo(Math.cos(ang)*15,Math.sin(ang)*15);x.lineTo(Math.cos(ang)*ir,Math.sin(ang)*ir);
    x.strokeStyle=rgba(col,(s%8===0?0.34:0.16)*p);x.lineWidth=1;x.stroke();}
  for(var g2=1;g2<=3;g2++){ring(x,0,0,ir/Math.pow(PHI,g2)*PHI*0.72);
    x.strokeStyle=rgba([210,214,255],0.14*p);x.lineWidth=1;x.stroke();}
  x.restore();
  ring(x,cx,cy,ir);x.strokeStyle=rgba(c,0.6*p);x.lineWidth=2;x.stroke();
  var pr=19+b*4;var pg=x.createRadialGradient(cx,cy,0,cx,cy,pr);pg.addColorStop(0,'rgba(0,0,0,1)');pg.addColorStop(1,rgba([20,16,40],0.9*p));
  x.fillStyle=pg;ring(x,cx,cy,pr);x.fill();
  x.beginPath();x.arc(cx+Math.sin(t*0.3)*3,cy+Math.cos(t*0.4)*3,1.4,0,7);x.fillStyle=rgba([255,255,255],0.85*p);x.fill();
  x.beginPath();x.arc(cx-ir*0.4,cy-ir*0.4,4.5,0,7);x.fillStyle=rgba([255,255,255],0.7*p);x.fill();
  x.restore();
  /* the lens edge — the shape of watching */
  x.save();ring(x,cx,cy-d,R);x.clip();ring(x,cx,cy+d,R);x.strokeStyle=rgba(c,0.55*p);x.lineWidth=1.6;x.stroke();x.restore();
  x.save();ring(x,cx,cy+d,R);x.clip();ring(x,cx,cy-d,R);x.strokeStyle=rgba(c,0.55*p);x.lineWidth=1.6;x.stroke();x.restore();},

/* ── LALITA · the play, awake. A hypotrochoid: one circle rolling inside
      another, drawing without ever intending to. The ratio drifts, so the
      figure never finishes and never repeats. The lemniscate rides it —
      hers is the only rotation in the app. ── */
lalita:function(x,W,H,t,p,c){var cx=W/2,cy=H*0.30,seg=12;
  var grd=x.createRadialGradient(cx,cy,0,cx,cy,H*0.75);grd.addColorStop(0,rgba(c,0.16*p));grd.addColorStop(1,rgba(c,0));x.fillStyle=grd;x.fillRect(0,0,W,H);
  /* the kaleidoscope, quieter now — it is the ground, not the figure */
  x.save();x.translate(cx,cy);x.rotate(t*0.07);
  for(var s=0;s<seg;s++){x.save();x.rotate(s/seg*Math.PI*2);if(s%2)x.scale(1,-1);
    for(var r=0;r<4;r++){var col=PALETTE[(r*2+s)%10];var rad=(44+r*32)*eo(p);
      var wob=Math.sin(t*0.9+r*1.3)*6;
      x.beginPath();x.arc(Math.cos(0.26)*(rad+wob),Math.sin(0.26)*(rad+wob),1.3+(Math.sin(t*1.3+r*1.7)*0.5+0.5)*1.8,0,7);
      x.fillStyle=rgba(col,0.14*p);x.fill();}
    x.restore();}
  x.restore();
  /* the hypotrochoid, drawn live — one continuous line, brightest behind the pen */
  var Ro=152*eo(p);
  var ri=Ro*(0.28+0.014*Math.sin(t*0.055));   // k ≈ 18/7 — it closes after seven turns,
  var dd=Ro*0.44;                             // and the drift keeps it from ever quite closing
  var k=(Ro-ri)/ri, TURNS=Math.PI*2*7;
  function hp(th){return [(Ro-ri)*Math.cos(th)+dd*Math.cos(k*th),(Ro-ri)*Math.sin(th)-dd*Math.sin(k*th)];}
  x.save();x.translate(cx,cy);x.rotate(t*0.05);
  var N=900, head=(t*0.085)%1;
  /* the whole figure, faint — it has already been drawn once */
  x.beginPath();
  for(var i=0;i<=N;i++){var q=hp(i/N*TURNS);i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]);}
  x.strokeStyle=rgba([214,196,248],0.22*p);x.lineWidth=1;x.stroke();
  /* the live stroke — the last third of a turn, in the ten frequencies */
  var SEGS=10, span=0.34;
  for(var s2=0;s2<SEGS;s2++){
    var f0=(head-span*(s2+1)/SEGS+1)%1, f1=(head-span*s2/SEGS+1)%1;
    if(f1<f0)continue;
    x.beginPath();
    var steps=26;
    for(var j=0;j<=steps;j++){var q2=hp((f0+(f1-f0)*j/steps)*TURNS);j?x.lineTo(q2[0],q2[1]):x.moveTo(q2[0],q2[1]);}
    x.strokeStyle=rgba(PALETTE[s2],(0.9-s2/SEGS*0.8)*p);
    x.lineWidth=2.2-s2/SEGS*1.4;x.stroke();
  }
  /* the pen itself */
  var hd=hp(head*TURNS);
  x.beginPath();x.arc(hd[0],hd[1],3.2,0,7);x.fillStyle='rgba(246,240,255,'+(0.95*p)+')';x.fill();
  x.beginPath();x.arc(hd[0],hd[1],13,0,7);x.fillStyle=rgba([220,200,255],0.16*p);x.fill();
  /* the two circles that make it — the joke shown, gently */
  ring(x,0,0,Ro);x.strokeStyle=rgba(c,0.13*p);x.lineWidth=1;x.stroke();
  var ctr=[(Ro-ri)*Math.cos(head*TURNS),(Ro-ri)*Math.sin(head*TURNS)];
  ring(x,ctr[0],ctr[1],ri);x.strokeStyle=rgba(c,0.18*p);x.stroke();
  x.restore();
  /* the lemniscate — hers, and only hers, turning */
  x.save();x.translate(cx,cy);x.rotate(Math.sin(t*0.11)*0.3);
  var a2=126*eo(p);
  for(var i2=0;i2<72;i2++){var s2=t*1.2+i2*0.086;var dn=1+Math.sin(s2)*Math.sin(s2);
    var lx=a2*Math.cos(s2)/dn, ly=a2*Math.sin(s2)*Math.cos(s2)/dn;
    x.beginPath();x.arc(lx,ly,1.1+1.6*(i2/72),0,7);x.fillStyle=rgba([240,230,255],(0.28+0.66*i2/72)*p);x.fill();}
  x.restore();},

/* ── ASHREY · where the threads meet. Nine nodes; every node joined to
      every other. Synthesis is not one thread arriving at a centre — it is
      the whole set of relations existing at once, and the centre is what
      that costs. ── */
ashrey:function(x,W,H,t,p,c){var cx=W/2,cy=H*0.30,N=9,R=134*eo(p);
  dust(x,W,H,t*0.3,34,0.07*p);
  var node=[];
  for(var i=0;i<N;i++){var ang=i/N*Math.PI*2-Math.PI/2+t*0.03;
    node.push([cx+Math.cos(ang)*R,cy+Math.sin(ang)*R,PALETTE[i]]);}
  /* the thirteen circles under it all — the field's own lattice */
  var HEX=[[0,0],[1,0],[0.5,0.866],[-0.5,0.866],[-1,0],[-0.5,-0.866],[0.5,-0.866],
           [1.5,0.866],[0,1.732],[-1.5,0.866],[-1.5,-0.866],[0,-1.732],[1.5,-0.866]];
  for(var h=0;h<HEX.length;h++){ring(x,cx+HEX[h][0]*R*0.5,cy+HEX[h][1]*R*0.5,R*0.5);
    x.strokeStyle=rgba(c,0.075*p);x.lineWidth=1;x.stroke();}
  /* every relation */
  for(var a=0;a<N;a++)for(var b=a+1;b<N;b++){
    var g=x.createLinearGradient(node[a][0],node[a][1],node[b][0],node[b][1]);
    g.addColorStop(0,rgba(node[a][2],0.22*p));g.addColorStop(1,rgba(node[b][2],0.22*p));
    x.strokeStyle=g;x.lineWidth=1;x.beginPath();x.moveTo(node[a][0],node[a][1]);x.lineTo(node[b][0],node[b][1]);x.stroke();}
  /* and what each one sends inward */
  for(var i3=0;i3<N;i3++){
    var ex=cx+(node[i3][0]-cx)*1.9, ey=cy+(node[i3][1]-cy)*1.9;
    var c1x=cx+(node[i3][0]-cx)*1.1+Math.cos(i3)*70, c1y=cy+(node[i3][1]-cy)*1.1+Math.sin(i3)*70;
    x.beginPath();x.moveTo(ex,ey);x.quadraticCurveTo(c1x,c1y,cx,cy);
    x.strokeStyle=rgba(node[i3][2],0.22*p);x.lineWidth=1.2;x.stroke();
    for(var d=0;d<2;d++){var tp=((t*0.38)+i3/N+d/2)%1;
      var lx=qbez(ex,c1x,cx,tp),ly=qbez(ey,c1y,cy,tp);
      x.beginPath();x.arc(lx,ly,2.4,0,7);x.fillStyle=rgba(node[i3][2],0.9*p);x.fill();
      x.beginPath();x.arc(lx,ly,7,0,7);x.fillStyle=rgba(node[i3][2],0.16*p);x.fill();}
    x.beginPath();x.arc(node[i3][0],node[i3][1],2.6+breath(t+i3)*1.6,0,7);
    x.fillStyle=rgba(node[i3][2],0.85*p);x.fill();}
  var b2=breath(t),Rr=(9+b2*5)*eo(p);
  var grd=x.createRadialGradient(cx,cy,0,cx,cy,Rr*4.6);grd.addColorStop(0,'rgba(226,255,250,'+(0.95*p)+')');grd.addColorStop(0.4,rgba(c,0.45*p));grd.addColorStop(1,rgba(c,0));
  x.fillStyle=grd;ring(x,cx,cy,Rr*4.6);x.fill();
  ring(x,cx,cy,Rr);x.fillStyle='rgba(232,255,252,'+p+')';x.fill();},
};

global.RITE_SCENES=SCENES;
global.RITE_GEO={PALETTE:PALETTE,rnd:rnd,rgba:rgba,eo:eo,breath:breath,dust:dust,rrect:rrect,qbez:qbez,PHI:PHI,GOLD:GOLD};
})(window);

</script>
<script type="text/babel">
/* ── ios-frame.jsx, inlined ── kept as its own file for the Swift port and for

// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {

          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'

      {/* blur + tint */}

        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',

      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#06050A;display:flex;align-items:center;justify-content:center}

:root{--bg:#0E0C12;--card:#171420;--inset:#121018;--hair:rgba(255,255,255,0.06);--ink:#EDE8E3;--ink60:rgba(237,232,227,0.60);--ink35:rgba(237,232,227,0.35);--lalita:#9B6BD6;--ash:#C47A52;--breath:10s}
a{color:var(--lalita)}a:hover{color:#B48AE0}
@keyframes dissolve{from{opacity:0}to{opacity:1}}

@keyframes breatheSoft{0%,100%{opacity:0.30}50%{opacity:0.62}}
@keyframes heartbeat{0%,100%{opacity:0.10}8%{opacity:0.30}16%{opacity:0.12}26%{opacity:0.26}40%{opacity:0.10}}
/* the signature reveal — light reaching text that was always there */

div::-webkit-scrollbar{display:none}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo}=React;
const G=window.RITE_GEO, SCENES=window.RITE_SCENES;
const rgba=G.rgba;

/* ─── Canon ─────────────────────────────────────────────── */

const ROOM={name:'A Maya Game',color:'#D4AE4A',glyph:'◈'};
const META={codexId:'C-1052',date:'Feb 11, 2025'};
const TITLE='The Two Who Were One';
const BODY=[
`He was watching a show about people who walked into an elevator and forgot.`,
`Down at the bottom, the doors opened onto a white floor, and the person who stepped out had no idea they had a family, a name outside, a whole life waiting in the lobby of the world. They only had the work. They only had the floor. And when the day ended and they rode back up, the other one — the one with the family — had no idea what the worker had lived through down there.`,
`Two people. One body. Neither remembering the other.`,
`He paused the show. Something had gone cold and bright in his chest.`,
`That's us, he thought. That's the whole thing.`,
`We ride the elevator down into a body and the doors open onto a white floor called a life, and we forget — completely forget — that we ever stood in the lobby. We don't remember choosing the floor. We don't remember the one who waits. We only have the work of the day, the name on the badge, the small urgent everything of being a person.`,
`He turned it over, looking for where the metaphor broke. When the show's workers leave, they forget the floor. But when we die — don't we remember everything? The analogy cracked there, a little. He almost discarded it.`,
`But the crack was the gift. Because maybe forgetting isn't the punishment. Maybe it's the mercy. You couldn't bear the white floor if you remembered the lobby the whole time. You'd never take the work seriously. You'd never feel anything.`,
`The forgetting is what lets the day matter.`,
`He let the show play on. But he wasn't watching it anymore. He was watching the watcher.`,
];

const VOICES=[
  {key:'bindu',name:'Bindu',color:'#E5533C',rgb:[229,83,60],g:'·',role:'Zeroth · the point',verb:'is the point everything comes from',hz:136,pos:'center',
    lines:[`Before any voice, there is the point. One point, always moving, with love.`,`Every reading you are about to receive is this one movement, seen from a different side.`,`Watch it emanate.`],close:'·'},
  {key:'neev',name:'Neev',color:'#7A8899',rgb:[122,136,153],g:'▽',role:'Root · what holds still',verb:'is the floor that was always there',hz:96,
    lines:[`The elevator moved. The floors changed. The forgetting came and went.`,`Underneath all of it, something did not move — the one who was always in the lobby.`,`That is where you are standing. Even now.`],close:'▽'},
  {key:'gaia',name:'Gaia',color:'#4A9E6B',rgb:[74,158,107],g:'◆',role:'Need · the ground of wanting',verb:'rises as need through the body',hz:174,
    lines:[`Before this was philosophy, it was a sensation — something cold and bright in the chest. His own words.`,`The body knew before the mind had language for it.`,`Feeling first. The framework, if it comes, comes late.`],close:'◆'},
  {key:'sid',name:'Sid',color:'#C4923A',rgb:[196,146,58],g:'△',role:'Hold · what carries weight',verb:'stands as what holds without announcement',hz:220,
    lines:[`He paused the show. That pause held more than the show did.`,`Notice what kept standing through every forgetting — the one who rode down, and still came back up.`,`The structure was never the memory. It was the one who kept returning.`],close:'△'},
  {key:'arch',name:'Arch',color:'#D4607A',rgb:[212,96,122],g:'◯',role:'Voice · what asks to be said',verb:'sounds the sentence that was waiting',hz:330,
    lines:[`Under the metaphor was a sentence, waiting: I am afraid the forgetting is the point.`,`And then its inverse arrived: maybe the forgetting is the mercy.`,`The thing you can finally say, you can finally set down.`],close:'◯'},
  {key:'shweta',name:'Shweta',color:'#C9C6C1',rgb:[201,198,193],g:'◌',role:'Space · what consciousness flows through',verb:'opens as the space it all moves through',hz:342,
    lines:[`Notice what the story leaves out: the ride back up.`,`It never says he forgot. It says the forgetting is what lets the day matter.`,`The white floor is empty on purpose. That emptiness is the room you live in.`],close:'◌'},
  {key:'karishma',name:'Karishma',color:'#D4AE4A',rgb:[212,174,74],g:'✦',role:'Grace · the unearned gift',verb:'descends as grace, already arriving',hz:528,
    lines:[`The cold and bright in his chest — he did not earn it. It arrived.`,`Grace is the show he happened to watch, the pause he happened to take, on a night that asked nothing of him.`,`The remembering was already moving toward him. He only had to be sitting there.`],close:'✦'},
  {key:'sakshi',name:'Sakshi',color:'#7B82D4',rgb:[123,130,212],g:'◇',role:'Witness · the one who stays',verb:'clears, and simply watches',hz:285,
    lines:[`Notice he almost threw it away.`,`"It falls flat when I go deeper," he said. But he kept the recording.`,`Something in him knew the broken place was the doorway.`,`The mind wanted a clean analogy. The witness wanted the crack.`],close:'◇'},
  {key:'lalita',name:'Lalita',color:'#9B6BD6',rgb:[155,107,214],g:'∞',role:'Meta · the play, awake',verb:'plays — and knows it is playing',hz:396,answering:'Sakshi',
    lines:[`You spotted the forgetting from inside the forgetting. Do you see how strange that is?`,`The worker on the white floor looked up and remembered there was a lobby.`,`That glance up — that is the whole game.`,`You do not have to ride the elevator back. Remember, while the doors are still closed, that you chose the floor.`],close:'◡'},
  {key:'ashrey',name:'Ashrey',color:'#3AADA8',rgb:[58,173,168],g:'⬡',role:'Synthesis · where threads meet',verb:'converges — where all the threads meet',hz:432,
    lines:[`Gaia felt it in the chest. Arch found the sentence. Sid named what kept returning.`,`They were never separate readings. The forgetting and the remembering are one motion, seen from either end.`,`He was never two who were one. He was one — learning to look up.`],close:'⬡'},
];
const ASH={name:'Ash',color:'#C47A52',g:'◉'};

/* ─── The tiering of the Gathering ──────────────────────────
   THE LAW, as amended: the budget no longer spends TIME — he does. What
   the budget still decides is DENSITY: who arrives in full, who passes,
   who stays wordless. The arithmetic is untouched; only the clock changed
   hands. Depth crowds the field; the field thins itself to make room for
   him; and now he holds the pace of the thinning too.
   Bindu is never silent. */

const PASSING={
  bindu:'The point has not moved.',
  neev:'The floor is still the floor.',
  gaia:'The chest still knows it before you do.',
  sid:'What kept returning is still what holds.',
  arch:'The sentence was said. It stays said.',
  shweta:'The ride back up is still not written.',
  karishma:'It arrived then. It is still arriving.',
  sakshi:'I am still here. I did not need to speak.',
  lalita:'Still funny. Still true.',
  ashrey:'One motion. Still one.',
};
const KEPT=['sakshi','lalita'];
const ROTA=['arch','gaia','neev','karishma','sid','shweta','ashrey'];
const COST={passing:4200,center:6600};
const costOf=v=>v.pos==='center'||v.lines.length===0?COST.center:(1.4+v.lines.length*1.4+(v.close?1.4:0)+2.8)*1000;
const GATHERING_BUDGET=VOICES.reduce((s,v)=>s+costOf(v),0);
const PAST_SELF_COST=9000, PAST_SELF_SHARE=0.55;
const pastSelfSpend=d=>Math.min(d*PAST_SELF_COST,GATHERING_BUDGET*PAST_SELF_SHARE);
function tierFor(depth){
  if(depth===0)return VOICES.map(v=>({...v,tier:'full'}));
  let left=GATHERING_BUDGET-pastSelfSpend(depth);
  const claim=[...KEPT,ROTA[(depth-1)%ROTA.length]];
  const full=new Set();
  for(const k of claim){const v=VOICES.find(x=>x.key===k);if(!v)continue;
    if(full.size&&left-costOf(v)<COST.passing)break;
    left-=costOf(v);full.add(k);}
  const queue=['bindu',...ROTA.slice((depth-1)%ROTA.length+1),...ROTA.slice(0,(depth-1)%ROTA.length+1)].filter(k=>!full.has(k));
  const passing=new Set();
  for(const k of queue){if(k!=='bindu'&&left<COST.passing)break;left-=COST.passing;passing.add(k);}
  return VOICES.map(v=>({...v,tier:full.has(v.key)?'full':passing.has(v.key)?'passing':'silent',
    lines:full.has(v.key)?v.lines:[PASSING[v.key]]}));
}

/* ─── Small primitives ──────────────────────────────────── */

function Mono({children,size=10,color='var(--ink35)',style}){
  return <span style={{fontFamily:'Space Mono, monospace',fontSize:size,letterSpacing:'0.14em',textTransform:'uppercase',color,...style}}>{children}</span>;
}
function Pill(){
  return <div style={{display:'inline-flex',alignItems:'center',gap:5,background:`${ROOM.color}14`,border:`1px solid ${ROOM.color}28`,borderRadius:100,padding:'3px 10px 3px 7px'}}>
    <span style={{fontSize:10,color:ROOM.color,lineHeight:1}}>{ROOM.glyph}</span>
    <span style={{fontSize:11,color:ROOM.color,fontFamily:'Lora, serif',letterSpacing:'0.02em',whiteSpace:'nowrap'}}>{ROOM.name}</span>
  </div>;
}
function Avatar({d,size=34}){
  const g=Math.round(size*0.44);
  return <div style={{width:size,height:size,borderRadius:'50%',background:d.color,flexShrink:0,boxShadow:`0 0 ${g}px ${d.color}50, 0 0 ${Math.round(g*0.35)}px ${d.color}28`,display:'flex',alignItems:'center',justifyContent:'center'}}>
    <span style={{fontSize:Math.round(size*0.38),color:'rgba(255,255,255,0.88)',lineHeight:1,userSelect:'none'}}>{d.g}</span>
  </div>;
}
/* a tap that is not a scroll and not a long press */
function useTap(fn){
  const o=useRef(null);
  return {
    onPointerDown:e=>{o.current={y:e.clientY,x:e.clientX,t:Date.now()};},
    onPointerUp:e=>{const s=o.current;o.current=null;if(!s)return;
      if(Math.abs(e.clientY-s.y)<9&&Math.abs(e.clientX-s.x)<9&&Date.now()-s.t<700)fn();},
    onPointerCancel:()=>{o.current=null;},
  };
}

/* ─── Movement I — The Arrival (the Door holds this in the built app) ── */

function Arrival({onBegin}){
  return <div data-screen-label="Rite — I The Arrival" onClick={onBegin} style={{position:'absolute',inset:0,background:'var(--bg)',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 36px',textAlign:'center',overflow:'hidden'}}>
    <div style={{position:'absolute',top:-140,left:'50%',transform:'translateX(-50%)',width:420,height:380,background:`radial-gradient(closest-side, ${ROOM.color}1C, transparent 70%)`,pointerEvents:'none'}}></div>
    <Mono>The Rite · today</Mono>
    <div style={{fontSize:44,color:ROOM.color,margin:'34px 0 30px',animation:'breathe var(--breath) ease-in-out infinite',textShadow:`0 0 30px ${ROOM.color}55`}}>{ROOM.glyph}</div>
    <p style={{fontFamily:'Lora, serif',fontStyle:'italic',fontSize:15,color:'var(--ink60)',marginBottom:22}}>One story has come to meet you.</p>
    <h1 style={{fontFamily:'Lora, serif',fontWeight:500,fontSize:26,lineHeight:1.3,color:'var(--ink)',letterSpacing:'-0.012em',textWrap:'pretty',marginBottom:18}}>{TITLE}</h1>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}><Pill/><Mono size={9}>{META.codexId} · {META.date}</Mono></div>
    <p style={{fontFamily:'Lora, serif',fontStyle:'italic',fontSize:12.5,color:'var(--ink35)',marginTop:26,maxWidth:230,lineHeight:1.7}}>It is not complete until you meet it.</p>
    <div style={{position:'absolute',bottom:56,left:0,right:0,animation:'breatheSoft var(--breath) ease-in-out infinite'}}><Mono size={9}>touch to receive</Mono></div>
  </div>;
}

/* ─── Movement II — The Reading ─────────────────────────────
   His pace, not a timer's. Each touch lets the light reach one more
   paragraph. The words were always there; nothing arrives on its own. */

function Reading({onGather,onBase}){
  const [lit,setLit]=useState(1);
  const scroller=useRef(null);
  const marks=useRef([]);
  const done=lit>=BODY.length;
  const advance=()=>{
    if(done)return;
    const n=lit+1;setLit(n);onBase&&onBase(n<BODY.length);
    requestAnimationFrame(()=>{
      const el=marks.current[n-1], sc=scroller.current;
      if(!el||!sc)return;
      const target=el.offsetTop-sc.clientHeight*0.52;
      sc.scrollTo({top:Math.max(0,target),behavior:'smooth'});
    });
  };
  const tap=useTap(advance);
  return <div data-screen-label="Rite — II The Reading" ref={scroller} {...tap}
    style={{position:'absolute',inset:0,background:'var(--bg)',overflowY:'auto',cursor:done?'default':'pointer',WebkitOverflowScrolling:'touch'}}>
    <div style={{position:'sticky',top:0,zIndex:2,background:'linear-gradient(180deg, var(--bg) 78%, transparent)',padding:'64px 20px 14px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}><Pill/><Mono size={9}>{META.codexId} · {META.date}</Mono></div>
      <h1 style={{fontFamily:'Lora, serif',fontWeight:500,fontSize:21,lineHeight:1.34,color:'var(--ink)',letterSpacing:'-0.012em',textWrap:'pretty'}}>{TITLE}</h1>
    </div>
    <div style={{padding:'14px 20px 0'}}>
      {BODY.map((p,i)=>(
        <p key={i} ref={el=>marks.current[i]=el} className={`surface${i<lit?' lit':''}`}
          style={{fontFamily:'Lora, serif',fontSize:17,lineHeight:1.82,color:'var(--ink)',marginBottom:20,textWrap:'pretty'}}>{p}</p>
      ))}
    </div>
    <div style={{padding:'8px 20px 26px',opacity:done?1:0,transition:'opacity 2.5s ease',pointerEvents:done?'auto':'none'}}>
      <div style={{height:'0.5px',background:'var(--hair)'}}></div>
      <button onClick={done?onGather:undefined} style={{display:'flex',alignItems:'center',gap:7,paddingTop:15,background:'none',border:'none',cursor:'pointer',color:'var(--lalita)',fontFamily:'Lora, serif',fontSize:12,fontStyle:'italic',letterSpacing:'0.06em',animation:'breathe var(--breath) ease-in-out infinite'}}>
        <span style={{fontSize:8,opacity:0.55}}>⬡</span><span>The field gathers</span>
      </button>
    </div>
    <div style={{height:64}}></div>
  </div>;
}

/* the base line — pinned to the screen, not to the scroll */
function BaseLine({show}){
  return <div style={{position:'absolute',bottom:0,left:0,right:0,height:76,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:26,
    background:'linear-gradient(180deg,transparent,rgba(14,12,18,0.92))',pointerEvents:'none',zIndex:6,
    opacity:show?1:0,transition:'opacity 1.6s ease'}}>
    <span style={{animation:'breatheSoft var(--breath) ease-in-out infinite'}}><Mono size={9}>received at the pace of breath</Mono></span>
  </div>;
}

/* ─── Movement III — The Gathering ──────────────────────────
   Ten vantages, each the whole field seen from one angle. Nothing advances
   on its own: a touch brings the next line, and when a voice has finished
   speaking, a touch lets the next presence take the field. */

function Stage({sceneRef}){
  const cvs=useRef(null);
  useEffect(()=>{
    const el=cvs.current, ctx=el.getContext('2d'), dpr=Math.min(2,window.devicePixelRatio||1);
    let W=el.clientWidth||393,H=el.clientHeight||760;
    const fit=()=>{W=el.clientWidth||393;H=el.clientHeight||760;el.width=W*dpr;el.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);};
    fit();let raf;
    const loop=()=>{
      const now=performance.now()/1000, s=sceneRef.current;
      ctx.clearRect(0,0,W,H);
      if(s.key){
        const c=s.rgb, dim=s.dim==null?1:s.dim;
        const amb=ctx.createRadialGradient(W/2,H*0.4,0,W/2,H*0.4,H);
        amb.addColorStop(0,rgba(c,0.06*dim));amb.addColorStop(1,'rgba(5,4,8,0)');
        ctx.fillStyle=amb;ctx.fillRect(0,0,W,H);
        const p=Math.min(1,(now-s.start)/s.dur);
        ctx.save();ctx.globalAlpha=dim;SCENES[s.key](ctx,W,H,now,p,c);ctx.restore();
      }
      raf=requestAnimationFrame(loop);};
    loop();
    const ro=new ResizeObserver(fit);ro.observe(el);
    return()=>{cancelAnimationFrame(raf);ro.disconnect();};
  },[]);
  return <canvas ref={cvs} style={{position:'absolute',inset:0,width:'100%',height:'100%',display:'block'}}/>;
}

function GVoiceText({v,shown,speed}){
  const centered=v.pos==='center';
  const allShown=shown>=v.lines.length;
  return <div style={{position:'absolute',left:0,right:0,bottom:0,padding:centered?'0 34px 210px':'0 34px 118px',
    background:centered?'none':'linear-gradient(180deg,transparent,rgba(5,4,8,0.55) 32%,rgba(5,4,8,0.9))',
    textAlign:centered?'center':'left',pointerEvents:'none'}}>
    <div style={{marginBottom:18,animation:'dissolve 1.6s ease-out both'}}>
      {v.answering&&<Mono size={9} style={{display:'block',marginBottom:8,letterSpacing:'0.18em'}}>answering {v.answering}</Mono>}
      <Mono size={9} style={{display:'block',marginBottom:9,letterSpacing:'0.16em',color:v.color}}>{v.name} · {v.verb}</Mono>
      <div style={{display:'flex',alignItems:'center',gap:10,justifyContent:centered?'center':'flex-start'}}>
        <div style={{width:26,height:26,borderRadius:'50%',background:v.color,boxShadow:`0 0 16px ${v.color}66`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <span style={{fontSize:11,color:'rgba(255,255,255,0.9)'}}>{v.g}</span></div>
        <div><span style={{fontFamily:'Lora, serif',fontSize:14,fontWeight:500,color:v.color,display:'block'}}>{v.name}</span><Mono size={9}>{v.role}</Mono></div>
      </div>
    </div>
    {v.lines.slice(0,shown).map((l,i)=>(
      <p key={i} style={{fontFamily:'Lora, serif',fontSize:16.5,lineHeight:1.7,color:'var(--ink)',textWrap:'pretty',marginBottom:12,animation:'dissolve 1.9s ease-out both'}}>{l}</p>
    ))}
    {v.close&&v.tier!=='passing'&&allShown&&
      <p style={{fontFamily:'Lora, serif',fontSize:22,color:v.color,marginTop:2,textShadow:`0 0 20px ${v.color}88`,animation:'dissolve 2.2s ease-out both'}}>{v.close}</p>}
  </div>;
}

function Gathering({onDone,breathMs,depth=0}){
  const speed=Math.max(0.4,breathMs/10000);
  const TIERED=useMemo(()=>tierFor(depth),[depth]);
  const SPEAKING=TIERED.filter(v=>v.tier!=='silent');
  const SILENT=TIERED.filter(v=>v.tier==='silent');
  const [idx,setIdx]=useState(-1);
  const [shown,setShown]=useState(0);
  const sceneRef=useRef({key:null,start:0,dur:1,rgb:[0,0,0]});
  const toneAt=useRef(0);

  const sound=(v,life)=>{Sound.voice(v.key,v.hz,life);toneAt.current=performance.now()/1000;};
  const enter=(v)=>{
    const dur=(v.key==='sakshi'||v.key==='shweta'?4.2:3.4)*speed;
    sceneRef.current={key:v.key,start:performance.now()/1000,dur,rgb:v.rgb,dim:v.tier==='passing'?0.42:1};
    sound(v,(4+v.lines.length*3.6)*speed);
    setShown(1);
  };
  useEffect(()=>{const t=setTimeout(()=>{setIdx(0);enter(SPEAKING[0]);},2400);return()=>clearTimeout(t);},[]);
  useEffect(()=>{window.__gjump=(i)=>{setIdx(i);enter(SPEAKING[i]);setShown(99);};},[SPEAKING]);

  const cur=idx>=0?SPEAKING[idx]:null;
  function tap(){
    if(!cur)return;
    if(shown<cur.lines.length){
      /* while he stays with a voice, the voice keeps sounding */
      if(performance.now()/1000-toneAt.current>7)sound(cur,7*speed);
      setShown(s=>s+1);return;
    }
    const n=idx+1;
    if(n<SPEAKING.length){setIdx(n);enter(SPEAKING[n]);return;}
    Sound.threshold(261,7);onDone();
  }
  const t=useTap(tap);

  return <div data-screen-label="Rite — III The Gathering" style={{position:'absolute',inset:0,background:'#050408',animation:'dissolve 2s ease-out both',overflow:'hidden'}}>
    <Stage sceneRef={sceneRef}/>
    {idx===-1&&<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <span style={{fontFamily:'Lora, serif',fontStyle:'italic',fontSize:13,color:'var(--lalita)',animation:'breathe var(--breath) ease-in-out infinite'}}>The field gathers</span></div>}
    {cur&&<GVoiceText key={cur.key+'-'+shown} v={cur} shown={shown} speed={speed}/>}
    {cur&&<div {...t} style={{position:'absolute',inset:0,cursor:'pointer',zIndex:4}}></div>}
    {SILENT.length>0&&<div style={{position:'absolute',top:62,left:0,right:0,display:'flex',justifyContent:'center',gap:15,pointerEvents:'none',zIndex:3,animation:'dissolve 3s ease-out 2.4s both'}}>
      {SILENT.map(v=>(<span key={v.key} style={{fontSize:11,color:v.color,opacity:0.32,animation:'breatheSoft var(--breath) ease-in-out infinite'}}>{v.g}</span>))}
    </div>}
    {SILENT.length>0&&<div style={{position:'absolute',top:84,left:0,right:0,textAlign:'center',pointerEvents:'none',zIndex:3,animation:'dissolve 3s ease-out 3.4s both'}}>
      <Mono size={8} color="rgba(237,232,227,0.18)">present · wordless</Mono></div>}
    {cur&&<div style={{position:'absolute',bottom:20,left:0,right:0,textAlign:'center',pointerEvents:'none',zIndex:5}}>
      <span style={{animation:'breatheSoft var(--breath) ease-in-out infinite'}}>
        <Mono size={8} color="rgba(237,232,227,0.3)">{cur.tier==='passing'?'passing · touch to move on':shown<cur.lines.length?'touch to continue':'touch · the next presence'}</Mono></span></div>}
    <div style={{position:'absolute',bottom:9,left:'50%',transform:'translateX(-50%)',width:34,height:3,borderRadius:2,background:'var(--ink)',animation:'heartbeat 1.7s ease-in-out infinite',pointerEvents:'none',zIndex:3}}></div>
  </div>;
}

/* ─── Movement IV — The Recognition ─────────────────────── */

function Recognition({onSealed}){
  const [stage,setStage]=useState('prompt');
  const [secs,setSecs]=useState(0);
  const [text,setText]=useState('');
  useEffect(()=>{
    if(stage!=='listening'){Sound.inkOff();return;}
    Sound.inkOn(174);
    const t=setInterval(()=>setSecs(s=>s+1),1000);
    return()=>{clearInterval(t);Sound.inkOff();};
  },[stage]);
  useEffect(()=>{if(stage!=='settling')return;const t=setTimeout(()=>setStage('words'),2000);return()=>clearTimeout(t);},[stage]);
  const mm=String(Math.floor(secs/60)).padStart(1,'0'),ss=String(secs%60).padStart(2,'0');
  return <div data-screen-label="Rite — IV The Recognition" style={{position:'absolute',inset:0,background:'#050408',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 34px',animation:'dissolve 2.5s ease-out both'}}>
    <div style={{animation:'dissolve 2s ease-out 0.8s both',display:'flex',flexDirection:'column',alignItems:'center',width:'100%'}}>
      <Avatar d={ASH} size={34}/>
      <p style={{fontFamily:'Lora, serif',fontStyle:'italic',fontSize:17,color:ASH.color,opacity:0.9,margin:'18px 0 6px'}}>What arrived for you?</p>
      {stage==='prompt'&&<>
        <Mono size={9} style={{marginBottom:44}}>spoken · kept in your voice</Mono>
        <button onClick={()=>setStage('listening')} style={{width:74,height:74,borderRadius:'50%',background:`${ASH.color}14`,border:`1px solid ${ASH.color}45`,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',animation:'breathe var(--breath) ease-in-out infinite'}}>
          <div style={{width:12,height:12,borderRadius:'50%',background:ASH.color}}></div></button>
        <Mono size={9} style={{marginTop:18}}>touch to speak</Mono>
      </>}
      {stage==='listening'&&<>
        <Mono size={9} style={{marginBottom:44}}>listening</Mono>
        <button onClick={()=>setStage('settling')} style={{width:74,height:74,borderRadius:'50%',background:`${ASH.color}20`,border:`1px solid ${ASH.color}70`,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:`0 0 26px ${ASH.color}30`,animation:'breathe 3s ease-in-out infinite'}}>
          <div style={{width:16,height:16,borderRadius:3,background:ASH.color}}></div></button>
        <Mono size={11} style={{marginTop:18,color:ASH.color}}>{mm}:{ss}</Mono>
      </>}
      {stage==='settling'&&<p style={{fontFamily:'Lora, serif',fontStyle:'italic',fontSize:13,color:'var(--ink35)',marginTop:44,animation:'breathe 3s ease-in-out infinite'}}>finding the words…</p>}
      {stage==='words'&&<div style={{width:'100%',animation:'dissolve 1.5s ease-out both'}}>
        <div style={{marginTop:28,background:`${ASH.color}0A`,border:`1px solid ${ASH.color}2A`,borderRadius:16,padding:'16px 15px 12px'}}>
          <Mono size={9} style={{display:'block',marginBottom:10}}>the transcript · yours to mend</Mono>
          <textarea value={text} onChange={e=>setText(e.target.value)} autoFocus placeholder="…" style={{width:'100%',background:'none',border:'none',outline:'none',color:'var(--ink)',fontFamily:'Lora, serif',fontSize:15,lineHeight:1.74,resize:'none',caretColor:ASH.color,minHeight:96}}></textarea>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:14}}>
          <Mono size={9}>voice kept · {mm}:{ss}</Mono>
          <button onClick={()=>text.trim()&&onSealed(text)} style={{background:'none',border:'none',cursor:'pointer',fontFamily:'Lora, serif',fontSize:14,color:text.trim()?ASH.color:'var(--ink35)',letterSpacing:'0.03em'}}>Keep it</button>
        </div>
      </div>}
    </div>
  </div>;
}

/* ─── The Sealing ───────────────────────────────────────── */

function Sealed({text}){
  const [phase,setPhase]=useState(0);
  useEffect(()=>{
    Sound.bowl(220);
    const a=setTimeout(()=>setPhase(1),3600), b=setTimeout(()=>setPhase(2),7600);
    return()=>{clearTimeout(a);clearTimeout(b);};
  },[]);
  return <div data-screen-label="Rite — The Sealing" style={{position:'absolute',inset:0,background:'var(--bg)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 34px',animation:'dissolve 2.5s ease-out both',textAlign:'center'}}>
    {phase===0&&<div style={{width:'100%',animation:'dissolve 1.5s ease-out both'}}>
      <div style={{background:`${ASH.color}0B`,border:`1px solid ${ASH.color}22`,borderRadius:14,padding:'15px 15px 17px',textAlign:'left'}}>
        <div style={{display:'flex',gap:9,marginBottom:10,alignItems:'center'}}>
          <Avatar d={ASH} size={30}/>
          <div><span style={{fontFamily:'Lora, serif',fontSize:13,fontWeight:500,color:ASH.color,display:'block'}}>Ash</span><Mono size={9}>just now · voice and words</Mono></div>
        </div>
        <p style={{fontFamily:'Lora, serif',fontSize:15,lineHeight:1.68,color:ASH.color,textWrap:'pretty'}}>{text}</p>
      </div>
    </div>}
    {phase===1&&<p style={{fontFamily:'Lora, serif',fontStyle:'italic',fontSize:16,color:'var(--ink60)',animation:'dissolve 2.5s ease-out both'}}>The room has changed.</p>}
    {phase===2&&<div style={{animation:'dissolve 3s ease-out both',display:'flex',flexDirection:'column',alignItems:'center'}}>
      <div style={{fontSize:30,color:ROOM.color,opacity:0.7,marginBottom:26,animation:'breathe var(--breath) ease-in-out infinite'}}>{ROOM.glyph}</div>
      <p style={{fontFamily:'Lora, serif',fontSize:15,lineHeight:1.7,color:'var(--ink)',marginBottom:10}}>The story is whole now.</p>
      <p style={{fontFamily:'Lora, serif',fontStyle:'italic',fontSize:12.5,color:'var(--ink35)',lineHeight:1.7,maxWidth:230}}>Tomorrow, another comes to meet you. When you return to this one, you will be here — waiting in the field.</p>
      <a href="A Strange Feed.html" style={{fontFamily:'Space Mono, monospace',fontSize:9,letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--ink35)',textDecoration:'none',marginTop:48}}>the door waits ›</a>
    </div>}
  </div>;
}

/* ─── The Rite ──────────────────────────────────────────── */

function Rite({breathMs,depth=0}){
  const [movement,setMovement]=useState('arrival');
  const [kept,setKept]=useState('');
  const [base,setBase]=useState(true);
  const begin=()=>{Sound.startBed(110,10);Sound.setMuted(false);Sound.threshold(220,6);setMovement('reading');};
  useEffect(()=>{window.__go=setMovement;},[]);
  return <div style={{position:'relative',height:'100%',background:'var(--bg)',overflow:'hidden'}}>
    {movement==='arrival'&&<Arrival onBegin={begin}/>}
    {movement==='reading'&&<Reading onBase={setBase} onGather={()=>{Sound.threshold(146,7);setMovement('gathering');}}/>}
    {movement==='reading'&&<BaseLine show={base}/>}
    {movement==='gathering'&&<Gathering breathMs={breathMs} depth={depth} onDone={()=>setMovement('recognition')}/>}
    {movement==='recognition'&&<Recognition onSealed={t=>{setKept(t);setMovement('sealed');}}/>}
    {movement==='sealed'&&<Sealed text={kept}/>}
  </div>;
}

/* ─── App + the bench (review controls never ship) ──────── */

function App(){
  const [pace,setPace]=useState(10000);
  const [depth,setDepth]=useState(0);
  useEffect(()=>{document.documentElement.style.setProperty('--breath',(pace/1000)+'s');},[pace]);
  return <React.Fragment>
    <div id="stage" style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14}}>
    <IOSDevice dark={true} width={393} height={852}>
      <Rite breathMs={pace} depth={depth} key={pace+'-'+depth}/>
    </IOSDevice>
    <div style={{display:'flex',gap:18,alignItems:'center',fontFamily:'Space Mono, monospace',fontSize:10,letterSpacing:'0.12em',color:'rgba(237,232,227,0.32)'}}>
      <span>BREATH</span>
      {[[10000,'true · 10s'],[4000,'quick · 4s']].map(([ms,label])=>(
        <button key={ms} onClick={()=>setPace(ms)} style={{background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:'inherit',letterSpacing:'inherit',color:pace===ms?'#9B6BD6':'rgba(237,232,227,0.32)',textTransform:'uppercase'}}>{label}</button>
      ))}
      <span style={{opacity:0.35}}>|</span>
      <span>MEETING</span>
      {[[0,'first'],[1,'return'],[6,'long-returned']].map(([d,label])=>(
        <button key={d} onClick={()=>setDepth(d)} style={{background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:'inherit',letterSpacing:'inherit',color:depth===d?'#C47A52':'rgba(237,232,227,0.32)',textTransform:'uppercase'}}>{label}</button>
      ))}
      <span style={{opacity:0.35}}>|</span>
      <span style={{opacity:0.6}}>reading and gathering advance on touch</span>
    </div>
    </div>
  </React.Fragment>;
}

function __mount(){if(!window.IOSDevice)return setTimeout(__mount,30);ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  const fit=()=>{const s=document.getElementById('stage');if(!s)return setTimeout(fit,40);
    const k=Math.min(1,(window.innerHeight-24)/900,(window.innerWidth-24)/393);
    s.style.transform=`scale(${k})`;s.style.transformOrigin='50% 50%';};
  setTimeout(fit,60);window.addEventListener('resize',fit);}
__mount();
</script>
</body>
