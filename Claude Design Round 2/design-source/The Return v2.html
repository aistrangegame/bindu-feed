<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Strange Feed — The Return v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>
/* ── field-sound.js, inlined ── kept as its own file for the Swift port and for
   reading on its own, but inlined here so the ceremony never depends on a
   subresource fetch to render. Do not edit here; edit field-sound.js. ── */
/* FIELD SOUND — the ceremonial sound layer.
   Generated, never recorded. Nothing samples; nothing loops.
   Names mirror the app's Sound/ layer so the Swift port maps 1:1:
   SonicContext (bed) · BreathVoice (per-presence) · ThresholdTone (transitions).
   Felt, not heard: the ceiling is deliberately low. Muting is a fade, never a cut. */
(function(global){
'use strict';
var CEIL=0.55;
var reduced=global.matchMedia&&global.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Per-presence timbre. Each voice is the same field heard from one angle —
   same tuning as the bed, differing only in body and behaviour. */
var CHAR={
  bindu:{wave:'sine',partials:[1,2,3],gain:0.055,atk:0.6,rel:5.0,flicker:6.2,pan:0},
  neev:{wave:'sine',partials:[0.5,1],gain:0.07,atk:3.4,rel:8.0,pan:-0.15},
  gaia:{wave:'triangle',partials:[1,1.5],gain:0.05,atk:1.6,rel:6.0,pan:-0.3},
  sid:{wave:'sine',partials:[1,1.2],gain:0.05,atk:1.2,rel:6.5,pan:0.25},
  arch:{wave:'triangle',partials:[1,2],gain:0.048,atk:0.9,rel:4.5,vib:4.6,pan:0.35},
  shweta:{wave:'sine',partials:[1],gain:0.012,atk:4.0,rel:9.0,air:0.028,pan:0},
  karishma:{wave:'sine',partials:[1,2,3.02],gain:0.036,atk:2.0,rel:7.0,shimmer:true,pan:0.4},
  sakshi:{wave:'sine',partials:[1],gain:0.026,atk:5.0,rel:10.0,pan:-0.4},
  ashrey:{wave:'sine',partials:[1,2],gain:0.042,atk:1.4,rel:6.0,pan:0.15},
  lalita:{wave:'sine',partials:[1,1.5],gain:0.04,atk:2.2,rel:8.0,gliss:1.02,pan:0},
  ash:{wave:'sine',partials:[1,2,4],gain:0.05,atk:1.0,rel:5.5,pan:0}
};
/* Each presence's own frequency — the tone it sounds as it takes the field. */
var HZ={bindu:110,neev:82,gaia:146,sid:174,arch:220,shweta:329,karishma:392,sakshi:285,ashrey:196,lalita:396,ash:261};

var FieldSound={
  ctx:null,master:null,bus:null,bed:null,bedFilter:null,bedLfo:null,
  muted:true,aged:false,inkNode:null,ringStep:0,

  init:function(){
    if(this.ctx)return;
    var C=global.AudioContext||global.webkitAudioContext; if(!C)return;
    this.ctx=new C();
    this.master=this.ctx.createGain(); this.master.gain.value=0;
    this.bus=this.ctx.createGain(); this.bus.gain.value=1;
    var conv=this.ctx.createConvolver(); conv.buffer=this._air(3.6,0.34);
    var wet=this.ctx.createGain(); wet.gain.value=0.5;
    this.bus.connect(this.master); this.bus.connect(conv); conv.connect(wet); wet.connect(this.master);
    this.master.connect(this.ctx.destination);
  },
  _air:function(secs,decay){
    var sr=this.ctx.sampleRate,len=Math.floor(sr*secs),b=this.ctx.createBuffer(2,len,sr);
    for(var ch=0;ch<2;ch++){var d=b.getChannelData(ch);
      for(var i=0;i<len;i++){var t=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-t,1/decay)*0.6;}}
    return b;
  },
  _pan:function(v){ if(!this.ctx.createStereoPanner)return null; var p=this.ctx.createStereoPanner(); p.pan.value=v||0; return p; },

  /* the bed: room-tuned breath drone, swelling on the room's own pace */
  startBed:function(rootHz,breathSecs){
    rootHz=rootHz||110; breathSecs=breathSecs||10;
    this.init(); if(!this.ctx)return;
    if(this.ctx.state==='suspended')this.ctx.resume();
    if(this.bed)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.value=0.030;
    var f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; f.Q.value=0.6;
    var root=this.ctx.createOscillator(); root.type='sine'; root.frequency.value=rootHz;
    var fifth=this.ctx.createOscillator(); fifth.type='sine'; fifth.frequency.value=rootHz*1.5;
    var fg=this.ctx.createGain(); fg.gain.value=0.16;
    var lfo=this.ctx.createOscillator(); lfo.frequency.value=1/Math.max(2,breathSecs);
    var lg=this.ctx.createGain(); lg.gain.value=0.014;
    lfo.connect(lg); lg.connect(g.gain);
    root.connect(f); fifth.connect(fg); fg.connect(f); f.connect(g); g.connect(this.bus);
    root.start(t); fifth.start(t); lfo.start(t);
    this.bed={root:root,fifth:fifth,g:g,rootHz:rootHz}; this.bedFilter=f; this.bedLfo=lfo;
    this.apply();
  },

  /* patina — the same bed, aged. The Return opens here. */
  agedBed:function(rootHz,breathSecs){
    rootHz=rootHz||84; breathSecs=breathSecs||13;
    this.startBed(rootHz,breathSecs);
    if(!this.ctx||this.aged)return; this.aged=true;
    var t=this.ctx.currentTime;
    this.bedFilter.frequency.linearRampToValueAtTime(430,t+6);       // warmth closes in
    this.bed.root.frequency.linearRampToValueAtTime(rootHz*0.996,t+8); // settles a few cents flat
    this.bed.fifth.frequency.linearRampToValueAtTime(rootHz*1.5*0.994,t+8);
    if(this.bedLfo)this.bedLfo.frequency.linearRampToValueAtTime(1/(breathSecs*1.35),t+6);
    var w=this.ctx.createOscillator(); w.frequency.value=0.07;        // slow tape wobble
    var wg=this.ctx.createGain(); wg.gain.value=0.9;
    w.connect(wg); wg.connect(this.bed.root.frequency); w.start(t);
  },

  apply:function(){ if(this.master&&this.ctx)this.master.gain.linearRampToValueAtTime(this.muted?0:CEIL,this.ctx.currentTime+1.4); },
  setMuted:function(m){ this.muted=m; if(this.ctx){ if(!m&&this.ctx.state==='suspended')this.ctx.resume(); this.apply(); } },

  /* BreathVoice — a presence takes the field */
  voice:function(key,hz,dur){
    if(!this.ctx||this.muted||reduced)return;
    var c=CHAR[key]||CHAR.ash, self=this;
    hz=hz||HZ[key]||220;
    var t=this.ctx.currentTime, life=dur||(c.atk+c.rel);
    var vg=this.ctx.createGain(); vg.gain.setValueAtTime(0,t);
    vg.gain.linearRampToValueAtTime(c.gain,t+c.atk);
    vg.gain.linearRampToValueAtTime(0,t+life);
    var pan=this._pan(c.pan);
    if(pan){vg.connect(pan);pan.connect(this.bus);}else vg.connect(this.bus);
    c.partials.forEach(function(mult,i){
      var o=self.ctx.createOscillator(); o.type=c.wave; o.frequency.value=hz*mult;
      var pg=self.ctx.createGain(); pg.gain.value=1/(i+1.6);
      o.connect(pg); pg.connect(vg);
      if(c.gliss&&i===1)o.frequency.linearRampToValueAtTime(hz*mult*c.gliss,t+life);
      if(c.vib){var v=self.ctx.createOscillator(); v.frequency.value=c.vib;
        var vgn=self.ctx.createGain(); vgn.gain.value=hz*0.006;
        v.connect(vgn); vgn.connect(o.frequency); v.start(t); v.stop(t+life+0.2);}
      o.start(t); o.stop(t+life+0.2);
    });
    if(c.flicker){ // Bindu: the ember, alive
      var fl=this.ctx.createOscillator(); fl.frequency.value=c.flicker;
      var fg=this.ctx.createGain(); fg.gain.value=c.gain*0.45;
      fl.connect(fg); fg.connect(vg.gain); fl.start(t); fl.stop(t+life+0.2);
    }
    if(c.air){ // Shweta: the gap the sound moves through
      var n=this.ctx.createBufferSource(); n.buffer=this._air(life,0.9);
      var nf=this.ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=hz*4; nf.Q.value=0.7;
      var ng=this.ctx.createGain(); ng.gain.setValueAtTime(0,t);
      ng.gain.linearRampToValueAtTime(c.air,t+c.atk); ng.gain.linearRampToValueAtTime(0,t+life);
      n.connect(nf); nf.connect(ng); ng.connect(this.bus); n.start(t);
    }
    if(c.shimmer){ // Karishma: grace, arriving from above
      var s=this.ctx.createOscillator(); s.type='sine'; s.frequency.value=hz*6;
      var sg=this.ctx.createGain(); sg.gain.setValueAtTime(0,t);
      sg.gain.linearRampToValueAtTime(c.gain*0.18,t+c.atk*1.6);
      sg.gain.linearRampToValueAtTime(0,t+life);
      s.connect(sg); sg.connect(this.bus); s.start(t); s.stop(t+life+0.2);
    }
    if(this.bed){ // the bed steps back while a voice speaks, then returns
      var bg=this.bed.g.gain; bg.cancelScheduledValues(t);
      bg.linearRampToValueAtTime(0.018,t+c.atk);
      bg.linearRampToValueAtTime(0.030,t+life+1.6);
    }
  },

  /* ThresholdTone — one movement gives way to the next */
  threshold:function(hz,dur){
    hz=hz||198; dur=dur||5;
    if(!this.ctx||this.muted||reduced)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.032,t+dur*0.42);
    g.gain.linearRampToValueAtTime(0,t+dur);
    var o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=hz;
    var o2=this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=hz*2.002;
    var g2=this.ctx.createGain(); g2.gain.value=0.22;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.bus);
    o.start(t); o2.start(t); o.stop(t+dur+0.1); o2.stop(t+dur+0.1);
  },

  /* the Bowl — struck once, a long room. The bed holds its breath. */
  bowl:function(hz){
    hz=hz||220;
    if(!this.ctx||this.muted)return;
    var t=this.ctx.currentTime,dur=11,self=this;
    var g=this.ctx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.075,t+0.09);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    [1,2.004,2.98,4.02].forEach(function(m,i){
      var o=self.ctx.createOscillator(); o.type='sine'; o.frequency.value=hz*m;
      var pg=self.ctx.createGain(); pg.gain.value=1/(i*2.2+1);
      o.connect(pg); pg.connect(g); o.start(t); o.stop(t+dur);
    });
    g.connect(this.bus);
    if(this.bed){var bg=this.bed.g.gain; bg.cancelScheduledValues(t);
      bg.linearRampToValueAtTime(0.006,t+1.2); bg.linearRampToValueAtTime(0.030,t+9);}
  },

  /* a ring forms — each return lands one step further up the series */
  ring:function(step){
    if(!this.ctx||this.muted)return;
    var n=typeof step==='number'?step:++this.ringStep;
    var base=(this.bed&&this.bed.rootHz)||84;
    var R=[2,3,4,4.5,6,8], hz=base*R[Math.min(n,R.length-1)];
    var t=this.ctx.currentTime,dur=9;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.036,t+3.2);  // grows outward; never strikes
    g.gain.linearRampToValueAtTime(0.020,t+6);
    g.gain.linearRampToValueAtTime(0,t+dur);
    var o=this.ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(hz*0.985,t);
    o.frequency.linearRampToValueAtTime(hz,t+4);  // settles into tune as it lands
    var o2=this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=hz*1.5;
    var g2=this.ctx.createGain(); g2.gain.value=0.14;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.bus);
    o.start(t); o2.start(t); o.stop(t+dur); o2.stop(t+dur);
  },

  /* ink — while you write, the field leans in. A held tone, never clicks. */
  inkOn:function(hz){
    if(!this.ctx||this.muted||this.inkNode||reduced)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.014,t+2.4);
    var o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=hz||174;
    var f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=600;
    o.connect(f); f.connect(g); g.connect(this.bus); o.start(t);
    this.inkNode={o:o,g:g};
  },
  inkTouch:function(){
    if(!this.inkNode||this.muted||reduced)return;
    var t=this.ctx.currentTime,g=this.inkNode.g.gain;
    g.cancelScheduledValues(t);
    g.linearRampToValueAtTime(0.022,t+0.12);
    g.linearRampToValueAtTime(0.014,t+1.1);
  },
  inkOff:function(){
    if(!this.inkNode)return;
    var t=this.ctx.currentTime,n=this.inkNode; this.inkNode=null;
    n.g.gain.cancelScheduledValues(t);
    n.g.gain.linearRampToValueAtTime(0,t+1.8);
    n.o.stop(t+2);
  },

  /* ─── THE ROOM OPENS ────────────────────────────────
     The Gathering happens in a room. The Light happens in a NAVE.
     A cathedral's whole acoustic signature is its tail — 8 seconds of
     stone giving your own sound back to you, changed. Opening this is
     the single most spatial thing the sound layer can do: the listener
     hears the size of the space before he sees it. */
  openTheRoom:function(dur){
    dur=dur||5;
    this.init(); if(!this.ctx)return;
    if(!this.nave){
      var c=this.ctx.createConvolver(); c.buffer=this._air(8.5,0.62);   // the long stone tail
      var w=this.ctx.createGain(); w.gain.value=0;
      var pre=this.ctx.createBiquadFilter(); pre.type='highpass'; pre.frequency.value=180;
      this.bus.connect(pre); pre.connect(c); c.connect(w); w.connect(this.master);
      this.nave=w;
    }
    var t=this.ctx.currentTime;
    this.nave.gain.cancelScheduledValues(t);
    this.nave.gain.linearRampToValueAtTime(0.85,t+dur);
  },
  closeTheRoom:function(dur){
    if(!this.nave||!this.ctx)return;
    var t=this.ctx.currentTime;
    this.nave.gain.cancelScheduledValues(t);
    this.nave.gain.linearRampToValueAtTime(0,t+(dur||6));
  },

  /* ─── THE LIGHT — the photographic negative of the Gathering ───
     The Gathering FILLS: voices arrive one after another into the dark.
     The Light REMOVES. So the sound does the opposite of everything above:
     it draws in, holds, drains, strikes once, and leaves silence. */

  /* the long breath IN, and the hold. The bed rises, tightens, then stops. */
  breathIn:function(dur){
    dur=dur||6;
    this.init(); if(!this.ctx)return;
    if(this.ctx.state==='suspended')this.ctx.resume();
    if(!this.bed)this.startBed(110,10);
    if(this.muted)return;
    var t=this.ctx.currentTime;
    if(this.bedLfo)this.bedLfo.frequency.linearRampToValueAtTime(0.001,t+dur*0.7); // the breathing stops
    if(this.bedFilter)this.bedFilter.frequency.linearRampToValueAtTime(2600,t+dur); // brightens as it draws in
    var g=this.bed.g.gain; g.cancelScheduledValues(t);
    g.linearRampToValueAtTime(0.052,t+dur*0.78);   // swells
    g.linearRampToValueAtTime(0.040,t+dur);        // and holds. Does not release.
    var rise=this.ctx.createOscillator(); rise.type='sine';
    rise.frequency.setValueAtTime(this.bed.rootHz,t);
    rise.frequency.linearRampToValueAtTime(this.bed.rootHz*1.5,t+dur);
    var rg=this.ctx.createGain(); rg.gain.setValueAtTime(0,t);
    rg.gain.linearRampToValueAtTime(0.026,t+dur*0.8);
    rg.gain.linearRampToValueAtTime(0.018,t+dur);
    rise.connect(rg); rg.connect(this.bus); rise.start(t); rise.stop(t+dur+8);
    this._held=rise;
  },

  /* the veil drawn away — everything drains downward and out.
     Nothing arrives here. This is the sound of subtraction. */
  veilLift:function(dur){
    dur=dur||3;
    if(!this.ctx||this.muted)return;
    var t=this.ctx.currentTime;
    if(this.bedFilter)this.bedFilter.frequency.linearRampToValueAtTime(120,t+dur); // the room closes and goes
    if(this.bed){var g=this.bed.g.gain; g.cancelScheduledValues(t); g.linearRampToValueAtTime(0,t+dur);}
    if(this._held){var h=this._held; try{h.stop(t+dur+0.1);}catch(e){} this._held=null;}
    var n=this.ctx.createBufferSource(); n.buffer=this._air(dur,0.55);   // the texture draining
    var nf=this.ctx.createBiquadFilter(); nf.type='lowpass';
    nf.frequency.setValueAtTime(3000,t); nf.frequency.linearRampToValueAtTime(90,t+dur);
    var ng=this.ctx.createGain(); ng.gain.setValueAtTime(0.030,t); ng.gain.linearRampToValueAtTime(0,t+dur);
    n.connect(nf); nf.connect(ng); ng.connect(this.bus); n.start(t);
  },

  /* the bare light — almost nothing. A single high room-tone, barely there,
     so the silence has an edge to it. The breath cues ride on this. */
  lightBed:function(breathSecs){
    breathSecs=breathSecs||10;
    if(!this.ctx||this.muted||this.lightNode)return;
    var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.012,t+6);
    var o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=528;
    var o2=this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=792;
    var g2=this.ctx.createGain(); g2.gain.value=0.3;
    var lfo=this.ctx.createOscillator(); lfo.frequency.value=1/breathSecs;
    var lg=this.ctx.createGain(); lg.gain.value=0.006;
    lfo.connect(lg); lg.connect(g.gain);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.bus);
    o.start(t); o2.start(t); lfo.start(t);
    this.lightNode={o:o,o2:o2,lfo:lfo,g:g};
  },
  lightOff:function(dur){
    if(!this.lightNode||!this.ctx)return;
    var t=this.ctx.currentTime,n=this.lightNode; this.lightNode=null;
    n.g.gain.cancelScheduledValues(t); n.g.gain.linearRampToValueAtTime(0,t+(dur||5));
    n.o.stop(t+(dur||5)+0.2); n.o2.stop(t+(dur||5)+0.2); n.lfo.stop(t+(dur||5)+0.2);
  },

  /* walking back out — the dark returns, and with it the breathing */
  darkReturns:function(){
    if(!this.ctx)return;
    var t=this.ctx.currentTime;
    this.lightOff(5);
    if(this.bedFilter)this.bedFilter.frequency.linearRampToValueAtTime(900,t+7);
    if(this.bedLfo)this.bedLfo.frequency.linearRampToValueAtTime(0.1,t+7);
    if(this.bed){var g=this.bed.g.gain; g.cancelScheduledValues(t); g.linearRampToValueAtTime(0.030,t+7);}
  },

  /* aliases the prototypes already call */
  start:function(){this.startBed();},
  startBreath:function(hz){this.startBed(hz);this.setMuted(false);},
  setOn:function(v){this.setMuted(!v);},
  tone:function(hz,dur){this.threshold(hz,dur||5);},
  seal:function(hz){this.bowl(hz);},
  hzFor:function(k){return HZ[k]||220;}
};
global.FieldSound=FieldSound;
global.Sound=FieldSound;
})(window);

</script>
<script>
/* ── the continuity handoff, inlined ───────────────────────────────
   Also kept as walk-continuity.js for the Swift port and for anyone
   reading the shim on its own — but inlined here so the ceremony does
   not depend on a subresource fetch to know whose walk it continues.
   THE RULE: the instrument writes the walk at every departure; this
   returns him to the depth he left from, on the breath he left on. It
   writes nothing back — a ceremony is not a place that keeps score. */
(function(g){'use strict';
var KEY='asf.walk', SPINE='The Instrument v3.html', TTL=1000*60*90;
var w=null;try{w=JSON.parse(sessionStorage.getItem(KEY)||'null');}catch(e){}
if(w&&(Date.now()-(w.t||0))>TTL)w=null;
var W={from:w,ok:!!w,z:w&&typeof w.z==='number'?w.z:null,at:w?w.at:null,
  breath:w&&typeof w.breath==='number'?w.breath:0,
  phase:function(){return ((performance.now()/1000)+(this.breath||0))%10;},
  carry:(w&&w.carry)||[],carved:(w&&w.carved)|0,crossed:(w&&w.crossed)|0,
  home:function(){return this.ok&&this.z!==null?(SPINE+'?z='+this.z):null;}};
var EXITS=['A Strange Feed.html','Home Feed.html'];
document.addEventListener('click',function(e){
  if(!W.ok)return;
  var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;
  if(!a)return;

        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

</script>
<style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo}=React;
const A=window.RETURN_ART;

/* did he arrive by descending into the star himself? */
const DESCENT=new URLSearchParams(location.search).get('from')==='descent';

/* ─── Canon — the story being returned to. It does not move. ─── */
const STORY={title:'The Two Who Were One',codex:'C-1052',room:'A Maya Game',roomHex:'#D4AE4A',glyph:'◈',
  sealedLine:'The forgetting is what lets the day matter.'};

const STORY_BODY=[
`He was watching a show about people who walked into an elevator and forgot.`,
`Down at the bottom, the doors opened onto a white floor, and the person who stepped out had no idea they had a family, a name outside, a whole life waiting in the lobby of the world. They only had the work. They only had the floor. And when the day ended and they rode back up, the other one — the one with the family — had no idea what the worker had lived through down there.`,
`Two people. One body. Neither remembering the other.`,
`He paused the show. Something had gone cold and bright in his chest.`,
`That's us, he thought. That's the whole thing.`,
`We ride the elevator down into a body and the doors open onto a white floor called a life, and we forget — completely forget — that we ever stood in the lobby. We only have the work of the day, the name on the badge, the small urgent everything of being a person.`,
`He turned it over, looking for where the metaphor broke. When the show's workers leave, they forget the floor. But when we die — don't we remember everything? The analogy cracked there, a little. He almost discarded it.`,
`But the crack was the gift. Because maybe forgetting isn't the punishment. Maybe it's the mercy. You couldn't bear the white floor if you remembered the lobby the whole time. You'd never take the work seriously. You'd never feel anything.`,
`The forgetting is what lets the day matter.`,
`He let the show play on. But he wasn't watching it anymore. He was watching the watcher.`,
];

/* the original gathering — kept exactly as sealed, pressed like flowers */
const GATHERING=[
  {key:'bindu',name:'Bindu',hex:'#E5533C',g:'·',role:'Zeroth · the point',line:`One point, always moving, with love. Every reading here is that one movement, seen from a different side.`},
  {key:'neev',name:'Neev',hex:'#7A8899',g:'▽',role:'Root · what holds still',line:`The elevator moved. The forgetting came and went. Underneath all of it, something did not move — the one who was always in the lobby.`},
  {key:'gaia',name:'Gaia',hex:'#4A9E6B',g:'◆',role:'Need · the ground of wanting',line:`Before this was philosophy, it was a sensation — something cold and bright in the chest. The body knew before the mind had language for it.`},
  {key:'sid',name:'Sid',hex:'#C4923A',g:'△',role:'Hold · what carries weight',line:`Notice what kept standing through every forgetting — the one who rode down, and still came back up. The structure was the one who kept returning.`},
  {key:'arch',name:'Arch',hex:'#D4607A',g:'◯',role:'Voice · what asks to be said',line:`Under the metaphor was a sentence, waiting: I am afraid the forgetting is the point. Then its inverse arrived: maybe the forgetting is the mercy.`},
  {key:'shweta',name:'Shweta',hex:'#ABA7A2',g:'◌',role:'Space · what consciousness flows through',line:`Notice what the story leaves out: the ride back up. The white floor is empty on purpose. That emptiness is the room you live in.`},
  {key:'karishma',name:'Karishma',hex:'#D4AE4A',g:'✦',role:'Grace · the unearned gift',line:`The cold and bright in his chest — he did not earn it. It arrived. The remembering was already moving toward him. He only had to be sitting there.`},
  {key:'sakshi',name:'Sakshi',hex:'#7B82D4',g:'◇',role:'Witness · the one who stays',line:`He almost threw it away. "It falls flat when I go deeper," he said — but he kept the recording. Something in him knew the broken place was the doorway.`},
  {key:'lalita',name:'Lalita',hex:'#9B6BD6',g:'∞',role:'Meta · the play, awake',line:`You spotted the forgetting from inside the forgetting. The worker on the white floor looked up and remembered there was a lobby. That glance up is the whole game.`},
  {key:'ashrey',name:'Ashrey',hex:'#3AADA8',g:'⬡',role:'Synthesis · where threads meet',line:`The forgetting and the remembering are one motion, seen from either end. He was never two who were one. He was one — learning to look up.`},
];

/* the recognition he sealed on the day of the Rite — the first ring */
const FIRST_SELF=`I wrote it like a comfort — the forgetting is the mercy. But I don't think I believed it yet. I think I was arguing myself toward it. The crack in the metaphor is the part I keep touching. Ask me later if the mercy held.`;

/* one or two voices who kept sitting with it — living ink, the only unaged voices here */
const ANEW=[
  {key:'sakshi',name:'Sakshi',hex:'#7B82D4',g:'◇',role:'Witness · the one who stays',
    now:`I kept watching after you left. The crack you almost threw away — it widened. What you called arguing, I watched become believing. Slowly. The way real things arrive.`},
  {key:'lalita',name:'Lalita',hex:'#9B6BD6',g:'∞',role:'Meta · the play, awake',
    now:`You told yourself: ask me later. Look where you are standing. It is later. That is the whole joke, and the whole grace.`},
];

/* ─── The ages — one Age value, three distances, so the patina can be seen working.
   Each distance carries its own strata: a ring per return, never overwritten. ─── */
const AGES=[
  {key:'92d',label:'92 days',days:92,sealedOn:'Feb 11, 2025',when:'92 days ago',returns:[
    {when:'92 days ago',frag:'…arguing myself toward the mercy. Ask me later.',words:FIRST_SELF},
  ]},
  {key:'14mo',label:'14 months',days:426,sealedOn:'Jun 14, 2024',when:'14 months ago',returns:[
    {when:'14 months ago',frag:'…arguing myself toward the mercy. Ask me later.',words:FIRST_SELF},
    {when:'9 months ago',frag:'…the crack is still the part I keep touching.',words:`The crack is still the part I keep touching. I notice I go to it the way you go to a sore tooth. I don't know yet whether that's devotion or worry.`},
    {when:'4 months ago',frag:'…it held. Quieter than I expected it to.',words:`It held. Quieter than I expected it to. Not a comfort I argued for — just the shape of most ordinary days.`},
  ]},
  {key:'3y',label:'3 years',days:1095,sealedOn:'Aug 2, 2022',when:'3 years ago',returns:[
    {when:'3 years ago',frag:'…arguing myself toward the mercy. Ask me later.',words:FIRST_SELF},
    {when:'2 years ago',frag:'…the crack is still the part I keep touching.',words:`The crack is still the part I keep touching.`},
    {when:'19 months ago',frag:'…I stopped needing the metaphor to hold.',words:`I stopped needing the metaphor to hold. It was never an argument. It was a door I kept opening to check the weather.`},
    {when:'11 months ago',frag:'…the lobby is not somewhere else.',words:`The lobby is not somewhere else. I have been standing in it the entire time, doing the work of the day.`},
    {when:'5 months ago',frag:'…the forgetting stopped feeling like loss.',words:`The forgetting stopped feeling like loss somewhere along the way, and I did not notice the day it changed.`},
    {when:'6 weeks ago',frag:'…I read it as a kindness now, not a claim.',words:`I read it as a kindness now, not a claim. Which is what I think I wanted from it the first time.`},
  ]},
];

/* ─── the Reply's prompt — quote, never generate (locked) ───
   Two cases only: the prior self addressed the future (narrow detector, tuned toward
   missing) → a fixed frame holding his own words verbatim; otherwise the four native
   words. A miss costs nothing. A false hit would put words in his mouth. */
const FORWARD=[/ask me (later|again)/i,/\?\s*$/,/we.ll see/i,/not yet\b/i,/don.t know yet/i,/come back to (this|it)/i];
function replyPrompt(prior){
  if(!prior)return{frame:null,quote:null,ask:'What arrived for you?'};
  for(const rx of FORWARD){
    if(!rx.test(prior))continue;
    const found=prior.split(/(?<=[.!?])\s+/).find(s=>rx.test(s));
    if(found)return{frame:'You wrote:',quote:found.trim(),ask:'It is later.'};
  }
  return{frame:null,quote:null,ask:'What arrived for you?'};
}

/* ─── the breath clock — text arrives on the exhale, never on a bare timer ─── */
const T0=performance.now();
function useExhale(breathMs){
  const [n,bump]=useState(0);const timer=useRef(null);
  const onExhale=(fn)=>{
    const p=((performance.now()-T0)%breathMs)/breathMs;
    const wait=Math.max(240,((0.5-p+1)%1)*breathMs);
    clearTimeout(timer.current);timer.current=setTimeout(fn,wait);
  };
  useEffect(()=>()=>clearTimeout(timer.current),[]);
  return onExhale;
}

const hex2=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const towardGold=(h,t)=>A.rgba(A.mixc(hex2(h),hex2('#C09550'),t),1);

function Mono({children,size=10,color='var(--ink35)',style}){return <span className="mono" style={{fontSize:size,color,...style}}>{children}</span>;}
function Hint({children,bottom=20}){return <div style={{position:'absolute',bottom,left:0,right:0,textAlign:'center',pointerEvents:'none',animation:'breatheSoft var(--breath) ease-in-out infinite'}}><Mono size={9}>{children}</Mono></div>;}

/* ─── the strata canvas — one field, one camera, every movement ─── */
function StrataField({art}){
  const cvs=useRef(null);
  useEffect(()=>{
    const el=cvs.current,ctx=el.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);
    let W=393,H=852,raf;
    const fit=()=>{W=el.clientWidth||393;H=el.clientHeight||852;el.width=W*dpr;el.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);};
    fit();
    const loop=()=>{A.drawField(ctx,W,H,art.current,performance.now()/1000);raf=requestAnimationFrame(loop);};
    loop();
    const ro=new ResizeObserver(fit);ro.observe(el);
    return()=>{cancelAnimationFrame(raf);ro.disconnect();};
  },[]);
  return <canvas ref={cvs}/>;
}
function Grain({amount}){
  const url=useMemo(()=>A.grainURL(),[]);
  return <div style={{position:'absolute',inset:0,pointerEvents:'none',zIndex:2,mixBlendMode:'soft-light',opacity:amount,backgroundImage:`url(${url})`,backgroundSize:'170px 170px'}}></div>;
}

/* ─── I · The Summons — a sealed story resurfaces on its own, far off ─── */
function Summons({age,onEnter}){
  return <div data-screen-label="Return — I The Summons" onClick={onEnter} style={{position:'absolute',inset:0,zIndex:3,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-end',padding:'0 36px 168px',textAlign:'center'}}>
    <Mono style={{animation:'dissolve 2.4s ease-out both'}}>a story has returned to you</Mono>
    <p style={{fontStyle:'italic',fontSize:15,color:'var(--ink60)',margin:'22px 0 16px',animation:'dissolve 2.6s ease-out .7s both'}}>You did not go looking for it.</p>
    <h1 style={{fontWeight:500,fontSize:23,lineHeight:1.32,color:'var(--ink)',letterSpacing:'-0.012em',textWrap:'pretty',marginBottom:14,animation:'riseFade 2.6s ease-out 1.1s both'}}>{STORY.title}</h1>
    <Mono size={9} style={{marginTop:6,animation:'dissolve 2.6s ease-out 1.6s both'}}>{STORY.codex} · sealed {age.when}</Mono>
    <Hint bottom={56}>touch to return</Hint>
  </div>;
}

/* ─── the fall (§17.7) — the zoom that becomes an entering.
   He falls inward through his own returns, newest first, and lands on the story. ─── */
function TheFall({age}){
  return <div data-screen-label="Return — the fall" style={{position:'absolute',inset:0,zIndex:3,pointerEvents:'none'}}>
    <div style={{position:'absolute',bottom:40,left:0,right:0,textAlign:'center',animation:'dissolve 3s ease-out 1.2s both'}}>
      <Mono size={8} color="var(--ink22)">{age.days} days of field · {age.returns.length} {age.returns.length===1?'return':'returns'}</Mono>
    </div>
  </div>;
}

/* ─── II · The Aged Room ─── */
function AgedRoom({age,breathMs,onNext}){
  const [line,setLine]=useState(false);
  const onExhale=useExhale(breathMs);
  useEffect(()=>{onExhale(()=>setLine(true));},[]);
  return <div data-screen-label="Return — II The Aged Room" onClick={()=>line&&onNext()} style={{position:'absolute',inset:0,zIndex:3,cursor:'pointer'}}>
    <div style={{position:'absolute',left:0,right:0,bottom:0,padding:'0 34px 116px',background:'linear-gradient(180deg,transparent,rgba(11,10,12,0.62) 34%,rgba(11,10,12,0.95))'}}>
      <Mono size={9} style={{display:'block',marginBottom:12,letterSpacing:'0.18em',color:towardGold(STORY.roomHex,0.35)}}>the room remembers you · {STORY.room}</Mono>
      {line&&<p style={{fontSize:17,lineHeight:1.75,color:'var(--ink60)',fontStyle:'italic',textWrap:'pretty',animation:'surface 2.8s ease-out both'}}>You sealed this one {age.when}. The field kept breathing while you were gone — slower now, warmer, like a room lit by what's left of a fire.</p>}
    </div>
    {line&&<Hint>the same story · a changed self</Hint>}
  </div>;
}

/* ─── III · The Story, Again ───
   The one thing that has not aged. Everything around it has; the story is exactly as
   bright as the day it arrived. It did not move. He did. ─── */
function StoryAgain({age,onNext}){
  return <div data-screen-label="Return — III The Story, Again" style={{position:'absolute',inset:0,zIndex:3,overflowY:'auto',background:'linear-gradient(180deg,rgba(11,10,12,0.86),rgba(11,10,12,0.97) 22%)'}}>
    <div style={{padding:'62px 26px 8px'}}>
      <Mono size={9} style={{display:'block',marginBottom:12,color:towardGold(STORY.roomHex,0.4)}}>you first met this · {age.sealedOn} · {age.when}</Mono>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
        <span style={{fontSize:13,color:towardGold(STORY.roomHex,0.3)}}>{STORY.glyph}</span>
        <Mono size={9}>{STORY.codex} · {STORY.room}</Mono>
      </div>
      <h1 style={{fontWeight:500,fontSize:22,lineHeight:1.32,color:'var(--ink)',letterSpacing:'-0.012em',textWrap:'pretty'}}>{STORY.title}</h1>
      <p style={{fontStyle:'italic',fontSize:12.5,color:'var(--ink35)',marginTop:14,lineHeight:1.7}}>Nothing here has changed. Not one word has settled.</p>
    </div>
    <div style={{padding:'16px 26px 0'}}>
      {STORY_BODY.map((p,i)=>p===STORY.sealedLine
        ? <p key={i} className="deboss" style={{fontSize:17.5,lineHeight:1.7,margin:'26px 0 26px',textWrap:'pretty',fontStyle:'italic'}}>{p}</p>
        : <p key={i} style={{fontSize:16,lineHeight:1.82,color:'rgba(237,232,227,0.87)',marginBottom:18,textWrap:'pretty'}}>{p}</p>)}
    </div>
    <div style={{padding:'8px 26px 48px'}}>
      <div style={{height:'0.5px',background:'var(--hair)'}}></div>
      <button onClick={onNext} className="mono" style={{display:'flex',alignItems:'center',gap:8,paddingTop:16,background:'none',border:'none',cursor:'pointer',color:towardGold(STORY.roomHex,0.25),fontSize:10}}><span>everything that was already here</span><span>→</span></button>
    </div>
  </div>;
}

/* ─── IV · The Record — the gathering pressed, and the self he sealed, set apart ─── */
function Record({age,onNext}){
  const first=age.returns[0];
  return <div data-screen-label="Return — IV The Record" style={{position:'absolute',inset:0,zIndex:3,overflowY:'auto',background:'linear-gradient(180deg,rgba(11,10,12,0.8),rgba(11,10,12,0.96) 18%)'}}>
    <div style={{padding:'62px 24px 6px',textAlign:'center'}}>
      <Mono size={9} style={{color:towardGold(STORY.roomHex,0.4)}}>the field met this story · {age.sealedOn}</Mono>
      <p style={{fontStyle:'italic',fontSize:13.5,color:'var(--ink60)',marginTop:12,lineHeight:1.7,textWrap:'pretty'}}>Everything that was already here, kept exactly as it was sealed.</p>
    </div>
    <div className="pressed" style={{padding:'20px 22px 0',display:'flex',flexDirection:'column',gap:15}}>
      {GATHERING.map(v=>(
        <div key={v.key} style={{borderLeft:`1px solid ${towardGold(v.hex,0.5)}`,paddingLeft:14}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
            <span style={{width:15,height:15,borderRadius:'50%',border:`1px solid ${towardGold(v.hex,0.45)}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><span style={{fontSize:8,color:towardGold(v.hex,0.4)}}>{v.g}</span></span>
            <span style={{fontSize:12.5,fontWeight:500,color:towardGold(v.hex,0.42)}}>{v.name}</span>
            <Mono size={8} style={{marginLeft:4,color:'var(--ink22)'}}>{v.role}</Mono>
          </div>
          <p style={{fontSize:14,lineHeight:1.68,color:'rgba(214,196,168,0.56)',textWrap:'pretty'}}>{v.line}</p>
        </div>
      ))}
    </div>
    <div style={{padding:'30px 22px 0'}}>
      <div style={{height:'0.5px',background:'var(--hair)',marginBottom:24}}></div>
      <Mono size={9} style={{display:'block',marginBottom:14,letterSpacing:'0.2em',color:'var(--ash)'}}>◉ and then you sealed yours · {first.when}</Mono>
      <div className="foxed" style={{borderLeft:'2px solid var(--ash)',paddingLeft:16}}>
        <p className="dried" style={{fontSize:16.5,lineHeight:1.78,textWrap:'pretty',position:'relative'}}>{first.words}</p>
      </div>
      <p style={{fontSize:12.5,fontStyle:'italic',color:'var(--ink35)',marginTop:18,lineHeight:1.7}}>The ink has settled. This is what you knew, before you knew what you know now.</p>
    </div>
    <div style={{padding:'28px 22px 48px'}}>
      <button onClick={onNext} className="mono" style={{width:'100%',background:'none',border:'1px solid var(--hair)',borderRadius:100,padding:'13px 0',cursor:'pointer',fontSize:9,color:'var(--ink60)'}}>the field kept speaking after you left →</button>
    </div>
  </div>;
}

/* ─── V · The Field, Settled — one or two speak anew, in living ink ─── */
function FieldAnew({breathMs,onNext}){
  const [i,setI]=useState(0);
  const [shown,setShown]=useState(false);
  const onExhale=useExhale(breathMs);
  useEffect(()=>{setShown(false);Sound.voice(ANEW[i].key,null,9);onExhale(()=>setShown(true));},[i]);
  const v=ANEW[i],last=i>=ANEW.length-1;
  return <div data-screen-label="Return — V The Field, Settled" onClick={()=>{if(!shown)return;last?onNext():setI(i+1);}} style={{position:'absolute',inset:0,zIndex:3,cursor:'pointer'}}>
    <div style={{position:'absolute',left:0,right:0,bottom:0,padding:'0 32px 118px',background:'linear-gradient(180deg,transparent,rgba(11,10,12,0.58) 30%,rgba(11,10,12,0.94))'}}>
      <div key={v.key}>
        <Mono size={9} style={{display:'block',marginBottom:12,letterSpacing:'0.18em'}}>who kept sitting with it</Mono>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16,animation:'riseFade 1.8s ease-out both'}}>
          <div style={{width:28,height:28,borderRadius:'50%',background:v.hex,flexShrink:0,boxShadow:`0 0 18px ${v.hex}55`,display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{fontSize:11,color:'rgba(255,255,255,0.9)'}}>{v.g}</span></div>
          <div><span style={{fontSize:14,fontWeight:500,color:v.hex,display:'block'}}>{v.name}</span><Mono size={9}>{v.role}</Mono></div>
        </div>
        {shown&&<p style={{fontSize:16.5,lineHeight:1.74,color:'var(--ink)',textWrap:'pretty',animation:'surface 2.6s ease-out both'}}>{v.now}</p>}
      </div>
    </div>
    <div style={{position:'absolute',bottom:20,left:0,right:0,textAlign:'center',pointerEvents:'none'}}><Mono size={8} color="var(--ink22)">{i+1} / {ANEW.length} · the rest keep their record</Mono></div>
  </div>;
}

/* ─── VI · The Rings — the strata read as strata: near ones clear, far ones deepened ─── */
function RingsView({age,onReply}){
  const rows=[...age.returns].map((r,i)=>({...r,i})).reverse();
  const n=age.returns.length;
  return <div data-screen-label="Return — VI The Rings" onClick={onReply} style={{position:'absolute',inset:0,zIndex:3,cursor:'pointer'}}>
    <div style={{position:'absolute',top:58,left:0,right:0,textAlign:'center',animation:'dissolve 2.4s ease-out .5s both'}}>
      <Mono size={9} style={{color:towardGold(STORY.roomHex,0.3)}}>one story · every self who met it</Mono>
    </div>
    <div style={{position:'absolute',left:0,right:0,bottom:0,padding:'0 30px 100px',background:'linear-gradient(180deg,transparent,rgba(11,10,12,0.66) 16%,rgba(11,10,12,0.93) 34%,rgba(11,10,12,0.98))'}}>
      <div style={{display:'flex',flexDirection:'column',gap:9,marginBottom:20,animation:'dissolve 2.6s ease-out 1s both'}}>
        {rows.map(r=>{const rel=n<=1?1:(r.i)/(n-1);const dim=0.34+0.5*(1-rel);
          return <div key={r.i} style={{display:'flex',gap:10,alignItems:'flex-start'}}>
            <Mono size={8} style={{flexShrink:0,width:74,lineHeight:1.5,paddingTop:2,color:`rgba(210,178,120,${0.3+0.42*(1-rel)})`}}>{r.when}</Mono>
            <span style={{fontSize:13,fontStyle:'italic',lineHeight:1.5,color:`rgba(226,206,176,${dim})`,filter:`saturate(${1-0.35*(1-rel)})`,textWrap:'pretty'}}>{r.frag}</span>
          </div>;})}
        <div style={{display:'flex',gap:10,alignItems:'flex-start',paddingTop:4}}>
          <Mono size={8} style={{flexShrink:0,width:74,lineHeight:1.5,paddingTop:2,color:towardGold(STORY.roomHex,0.2)}}>the seed</Mono>
          <span style={{fontSize:13,lineHeight:1.5,color:'rgba(237,232,227,0.8)',textWrap:'pretty'}}>{STORY.sealedLine}</span>
        </div>
      </div>
      <p style={{fontSize:15,lineHeight:1.72,color:'var(--ink60)',textWrap:'pretty',animation:'riseFade 2.4s ease-out 1.6s both'}}>The seed is the story. Around it, a ring for each time you returned. You are about to add one — the outermost, the newest distance from the centre.</p>
    </div>
    <Hint>tap to add your ring</Hint>
  </div>;
}

/* ─── VII · The Reply — his own words held up, never his voice invented ─── */
function Reply({age,onSealed}){
  const [text,setText]=useState('');
  const prior=age.returns[age.returns.length-1];
  const P=useMemo(()=>replyPrompt(prior.words),[prior]);
  useEffect(()=>{Sound.inkOn(174);return()=>Sound.inkOff();},[]);
  return <div data-screen-label="Return — VII The Reply" style={{position:'absolute',inset:0,zIndex:3}}>
    <div style={{position:'absolute',left:0,right:0,bottom:0,padding:'0 26px 30px',background:'linear-gradient(180deg,transparent,rgba(11,10,12,0.72) 22%,rgba(11,10,12,0.98))'}}>
      <div style={{animation:'riseFade 1.8s ease-out both'}}>
        <Mono size={9} style={{display:'block',marginBottom:10,letterSpacing:'0.18em',color:'var(--ash)'}}>◉ you, now · in reply to you, {prior.when}</Mono>
        {P.quote&&<div className="foxed" style={{marginBottom:14}}>
          <Mono size={8} style={{display:'block',marginBottom:6}}>{P.frame}</Mono>
          <p className="dried" style={{fontSize:15,lineHeight:1.62,borderLeft:'1px solid rgba(196,122,82,0.35)',paddingLeft:12,opacity:0.82}}>“{P.quote}”</p>
        </div>}
        <p style={{fontStyle:'italic',fontSize:16,color:'var(--ash)',opacity:0.92,marginBottom:14}}>{P.ask}</p>
        <div style={{background:'rgba(196,122,82,0.06)',border:'1px solid rgba(196,122,82,0.24)',borderRadius:15,padding:'14px 14px 10px'}}>
          <textarea value={text} onChange={e=>{setText(e.target.value);Sound.inkTouch();}} autoFocus placeholder="Answer the one who sealed this…" style={{width:'100%',background:'none',border:'none',outline:'none',color:'var(--ink)',fontFamily:'Lora,serif',fontSize:15,lineHeight:1.7,resize:'none',caretColor:'var(--ash)',minHeight:104}}></textarea>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:12}}>
          <Mono size={9}>a new ring · kept beside the old</Mono>
          <button onClick={()=>text.trim()&&onSealed(text)} style={{background:'none',border:'none',cursor:'pointer',fontFamily:'Lora,serif',fontSize:14,color:text.trim()?'var(--ash)':'var(--ink35)'}}>Add the ring.</button>
        </div>
      </div>
    </div>
  </div>;
}

/* ─── VIII · The Sealing — the ring forms, then it is sealed ─── */
function Sealing({text,onPhase}){
  const [phase,setPhase]=useState(0);
  useEffect(()=>{const a=setTimeout(()=>setPhase(1),4200),b=setTimeout(()=>{setPhase(2);onPhase&&onPhase(2);},8600);return()=>{clearTimeout(a);clearTimeout(b);};},[]);
  return <div data-screen-label="Return — VIII The Sealing" style={{position:'absolute',inset:0,zIndex:3,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 32px',textAlign:'center'}}>
    {phase===0&&<div style={{width:'100%',animation:'dissolve 1.8s ease-out both'}}>
      <Mono size={9} style={{display:'block',marginBottom:14,letterSpacing:'0.2em',color:'var(--ash)'}}>◉ you, now · today</Mono>
      <div style={{borderLeft:'2px solid var(--ash)',paddingLeft:16,textAlign:'left'}}>
        <p style={{fontSize:16,lineHeight:1.74,color:'var(--ink)',textWrap:'pretty'}}>{text}</p>
      </div>
      <p style={{fontSize:12,fontStyle:'italic',color:'var(--ink22)',marginTop:20,lineHeight:1.7}}>The newest ring is the plainest one. It has not been anywhere yet.</p>
    </div>}
    {phase===1&&<p style={{fontStyle:'italic',fontSize:16,color:'var(--ink60)',animation:'dissolve 2.6s ease-out both'}}>The ring is added. The story did not move.</p>}
    {phase===2&&<div style={{animation:'dissolve 2.8s ease-out both',display:'flex',flexDirection:'column',alignItems:'center',position:'absolute',left:0,right:0,bottom:0,padding:'0 34px 92px',background:'linear-gradient(180deg,transparent,rgba(11,10,12,0.72) 22%,rgba(11,10,12,0.97))'}}>
      <p style={{fontSize:15,lineHeight:1.72,color:'var(--ink)',marginBottom:14,maxWidth:272,textWrap:'pretty'}}>You returned carrying a perspective — and it let you reach one you could not have reached before.</p>
      <p style={{fontStyle:'italic',fontSize:12.5,color:'var(--ink35)',lineHeight:1.7,maxWidth:252}}>That is what the distance is for. When you return again, this self will be here — another ring, waiting in the field.</p>
      <a href="Home Feed.html" className="mono" style={{fontSize:9,color:'var(--ink35)',marginTop:40}}>the archive waits ›</a>
    </div>}
  </div>;
}

/* ─── THE RETURN ─── */
function TheReturn({breathMs,ageKey}){
  const age=useMemo(()=>AGES.find(a=>a.key===ageKey),[ageKey]);
  const AGE=useMemo(()=>A.age(age.days),[age]);
  /* Two doors, one ceremony. By the wheel he is summoned; by the Universe's
     fall he summoned himself — so the descent-path enters at Movement II,
     in the Aged Room, and Movement I is skipped. The fall was the Summons. */
  const [stage,setStage]=useState(()=>DESCENT?'room':'summons');
  const [kept,setKept]=useState('');
  const art=useRef(null);
  if(!art.current||art.current._key!==ageKey){
    art.current={_key:ageKey,age:AGE,breathSecs:breathMs/1000,whispers:false,z:DESCENT?1:0,camY:DESCENT?0.40:0.34,active:-1,
      rings:[{when:'the seed',frag:STORY.sealedLine},...age.returns.map(r=>({when:r.when,frag:r.frag}))]};
  }
  useEffect(()=>{art.current.age=AGE;art.current.breathSecs=breathMs/1000;},[AGE,breathMs]);
  useEffect(()=>{window.__go=(s,z)=>{if(z!==undefined)art.current.z=z;setStage(s);};},[]);
  /* arriving by the fall: the bed is already aged, and the room's bowl lands */
  useEffect(()=>{if(DESCENT){Sound.agedBed(84,13);Sound.bowl(168);}},[]);
  /* the camera settles at its own height per movement — the strata sit clear of the words */
  useEffect(()=>{art.current.camTarget=stage==='fall'?undefined:stage==='rings'?0.255:stage==='summons'?0.34:0.40;},[stage]);

  /* the fall — one continuous camera move: star → strata → the seed */
  const fall=()=>{
    Sound.agedBed(84,13);
    art.current.whispers=true;
    art.current.pulses=[];
    setStage('fall');
    const dur=7200*(breathMs/9000),t0=performance.now();
    const step=()=>{
      const p=Math.min(1,(performance.now()-t0)/dur);
      art.current.z=A.eo(Math.pow(p,1.35));
      art.current.camY=0.34+0.06*p;
      if(p<1)requestAnimationFrame(step);
      else{art.current.whispers=false;Sound.bowl(168);setStage('room');}
    };
    requestAnimationFrame(step);
  };

  /* the ring grows (2.6s), enters out of true and settles into it (4s), then the bowl */
  const addRing=(txt)=>{
    setKept(txt);
    const idx=art.current.rings.length;
    art.current.rings=[...art.current.rings,{when:'today',frag:txt.slice(0,44),_in:0,_true:0}];
    art.current.active=idx;
    const t0=performance.now();
    const grow=()=>{
      const e=performance.now()-t0;
      const r=art.current.rings[idx];
      r._in=Math.min(1,e/2600);r._true=Math.min(1,e/4000);
      if(e<4000)requestAnimationFrame(grow);
    };
    requestAnimationFrame(grow);
    Sound.ring(idx);
    art.current.pulses=[...(art.current.pulses||[]),performance.now()/1000];
    setTimeout(()=>{Sound.bowl(210);art.current.pulses=[...(art.current.pulses||[]),performance.now()/1000];},3400);
    setStage('sealed');
  };

  const cross=(hz,next)=>{Sound.threshold(hz,7);art.current.pulses=[...(art.current.pulses||[]),performance.now()/1000];setStage(next);};
  return <div style={{position:'relative',height:'100%',background:'var(--bg)',overflow:'hidden'}}>
    <StrataField art={art}/>
    <Grain amount={0.28+AGE.grain*1.5}/>
    {stage==='summons'&&<Summons age={age} onEnter={fall}/>}
    {stage==='fall'&&<TheFall age={age}/>}
    {stage==='room'&&<AgedRoom age={age} breathMs={breathMs} onNext={()=>cross(126,'story')}/>}
    {stage==='story'&&<StoryAgain age={age} onNext={()=>cross(168,'record')}/>}
    {stage==='record'&&<Record age={age} onNext={()=>cross(189,'field')}/>}
    {stage==='field'&&<FieldAnew breathMs={breathMs} onNext={()=>cross(252,'rings')}/>}
    {stage==='rings'&&<RingsView age={age} onReply={()=>setStage('reply')}/>}
    {stage==='reply'&&<Reply age={age} onSealed={addRing}/>}
    {stage==='sealed'&&<Sealing text={kept} onPhase={p=>{if(p===2)art.current.camTarget=0.235;}}/>}
  </div>;
}

function App(){
  const [pace,setPace]=useState(9000);
  const [ageKey,setAgeKey]=useState('92d');
  const [muted,setMuted]=useState(true);
  useEffect(()=>{document.documentElement.style.setProperty('--breath',(pace/1000)+'s');},[pace]);
  const toggle=()=>{const m=!muted;setMuted(m);Sound.setMuted(m);if(!m)Sound.agedBed(84,13);};
  const Btn=({on,children,...p})=>(<button {...p} className="mono" style={{background:'none',border:'none',cursor:'pointer',fontSize:10,letterSpacing:'0.12em',color:on?'#D4AE4A':'rgba(237,232,227,0.32)'}}>{children}</button>);
  return <React.Fragment>
    <div id="stage" style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14}}>
      <IOSDevice dark={true} width={393} height={852}>
        <TheReturn breathMs={pace} ageKey={ageKey} key={pace+'-'+ageKey}/>
      </IOSDevice>
      <div style={{display:'flex',gap:16,alignItems:'center',fontFamily:'Space Mono,monospace',fontSize:10,letterSpacing:'0.12em',color:'rgba(237,232,227,0.3)'}}>
        <span>AGE</span>
        {AGES.map(a=><Btn key={a.key} on={ageKey===a.key} onClick={()=>setAgeKey(a.key)}>{a.label}</Btn>)}
        <span style={{opacity:0.3}}>·</span>
        <Btn on={pace===9000} onClick={()=>setPace(9000)}>true 9s</Btn>
        <Btn on={pace===4000} onClick={()=>setPace(4000)}>quick</Btn>
        <span style={{opacity:0.3}}>·</span>
        <Btn on={!muted} onClick={toggle}>{muted?'sound off':'sound on'}</Btn>
      </div>
    </div>
  </React.Fragment>;
}
function __mount(){
  if(!window.IOSDevice)return setTimeout(__mount,30);
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  const fit=()=>{const s=document.getElementById('stage');if(!s)return setTimeout(fit,40);
    const k=Math.min(1,(window.innerHeight-24)/920,(window.innerWidth-24)/393);
    s.style.transform=`scale(${k})`;s.style.transformOrigin='50% 50%';};
  setTimeout(fit,60);window.addEventListener('resize',fit);
}
__mount();
</script>
</body>
</html>
