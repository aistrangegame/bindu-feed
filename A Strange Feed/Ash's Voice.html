<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Strange Feed — Ash's Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Space+Mono&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; min-height: 100%;
      background: #06050A;
      display: flex; align-items: center; justify-content: center;
    }

    #root {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 100vh;
      padding: 40px 20px;
    }

    :root {
      --bg:    #0E0C12;
      --card:  #171420;
      --hair:  rgba(255,255,255,0.06);
      --ink:   #EDE8E3;
      --ink60: rgba(237,232,227,0.60);
      --ink35: rgba(237,232,227,0.35);
      --a:     #C47A52;
      --a08:   rgba(196,122,82,0.08);
      --a20:   rgba(196,122,82,0.20);
    }

    @keyframes dissolve { from { opacity: 0; } to { opacity: 1; } }
    @keyframes riseIn   {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    div::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ─── Ash's record ───────────────────────────────────────── */

const ENTRIES = [
  {
    id: 'e4',
    storyTitle: 'The Two Who Were One',
    storyHref: 'Story Detail.html',
    community: { name: 'A Maya Game', color: '#D4AE4A' },
    date: 'Feb 11, 2025',
    body: `I went back out after the eggs. It was still there.`,
    thread: 'In reply to Sakshi',
    threadBody: `Yes. I keep coming back to that pause.`,
  },
  {
    id: 'e3',
    storyTitle: 'Still Life with Cold Coffee',
    storyHref: null,
    community: { name: 'A Maya Game', color: '#D4AE4A' },
    date: 'Jan 22, 2025',
    body: `I didn't throw it away. It had gone cold but I kept it in frame, kept it in my peripheral. Like I was afraid that if I looked directly at it, it would just be a cup.`,
  },
  {
    id: 'e2',
    storyTitle: 'The One Who Sees',
    storyHref: null,
    community: { name: 'The Watcher', color: '#7B82D4' },
    date: 'Jan 14, 2025',
    body: `I think the person on the other side was me. But from before I knew what watching was.`,
  },
  {
    id: 'e1',
    storyTitle: 'The Smile While Making Eggs',
    storyHref: null,
    community: { name: 'The Garden', color: '#4A9E6B' },
    date: 'Dec 29, 2024',
    body: `The smile was real before the reason existed. I've been thinking about that order of things — feeling first, then the story. Maybe the story is always just catching up.`,
  },
];

const STATS = [
  { value: '4',     label: 'entries\nleft'      },
  { value: '3',     label: 'fields\nentered'    },
  { value: "Oct '24", label: 'first\nword'      },
];

/* ─── Primitives ─────────────────────────────────────────── */

function HR({ mx = 0 }) {
  return <div style={{ height: '0.5px', background: 'var(--hair)', margin: `0 ${mx}px` }} />;
}

function Stat({ value, label }) {
  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
      <span style={{
        fontFamily: 'Lora, serif', fontWeight: 500,
        fontSize: 18, color: 'var(--a)',
        letterSpacing: '-0.01em', lineHeight: 1,
      }}>{value}</span>
      <span style={{
        fontFamily: 'Space Mono, monospace',
        fontSize: 9, color: 'var(--ink35)',
        letterSpacing: '0.07em', textTransform: 'uppercase',
        textAlign: 'center', lineHeight: 1.5,
        whiteSpace: 'pre-line',
      }}>{label}</span>
    </div>
  );
}

/* ─── Community tag ──────────────────────────────────────── */

function Tag({ c }) {
  return (
    <span style={{
      fontFamily: 'Lora, serif', fontSize: 11,
      color: c.color, opacity: 0.75,
      letterSpacing: '0.01em',
    }}>{c.name}</span>
  );
}

/* ─── Single entry card ──────────────────────────────────── */

function Entry({ e, delay }) {
  return (
    <div style={{
      margin: '0 16px',
      background: 'var(--a08)',
      borderRadius: 16,
      border: `1px solid rgba(196,122,82,0.14)`,
      padding: '14px 15px 15px',
      opacity: 0,
      animation: `riseIn 0.9s ease-out ${delay}s both`,
    }}>

      {/* meta: story + date */}
      <div style={{
        display: 'flex', alignItems: 'baseline',
        justifyContent: 'space-between', gap: 8, marginBottom: 10,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, minWidth: 0 }}>
          {e.storyHref
            ? <a href={e.storyHref} style={{
                fontFamily: 'Lora, serif', fontSize: 12,
                color: 'var(--a)', textDecoration: 'none',
                display: 'flex', alignItems: 'center', gap: 4,
                opacity: 0.9,
              }}>
                <span style={{ fontSize: 9, opacity: 0.55 }}>↗</span>
                {e.storyTitle}
              </a>
            : <span style={{
                fontFamily: 'Lora, serif', fontSize: 12,
                color: 'var(--a)', opacity: 0.72,
                display: 'flex', alignItems: 'center', gap: 4,
              }}>
                <span style={{ fontSize: 9, opacity: 0.55 }}>↗</span>
                {e.storyTitle}
              </span>
          }
          <span style={{
            fontFamily: 'Space Mono, monospace', fontSize: 9,
            color: 'var(--ink35)', opacity: 0.6,
          }}>·</span>
          <Tag c={e.community} />
        </div>
        <span style={{
          fontFamily: 'Space Mono, monospace', fontSize: 10,
          color: 'var(--ink35)', whiteSpace: 'nowrap', flexShrink: 0,
        }}>{e.date}</span>
      </div>

      {/* thread context — if this was a reply */}
      {e.thread && (
        <div style={{
          marginBottom: 10, paddingLeft: 10,
          borderLeft: `1.5px solid rgba(196,122,82,0.25)`,
        }}>
          <span style={{
            fontFamily: 'Space Mono, monospace', fontSize: 9,
            color: 'var(--ink35)', display: 'block', marginBottom: 4,
            letterSpacing: '0.04em',
          }}>{e.thread}</span>
          <p style={{
            fontFamily: 'Lora, serif', fontStyle: 'italic',
            fontSize: 13, lineHeight: 1.58,
            color: 'var(--ink35)',
          }}>{e.threadBody}</p>
        </div>
      )}

      {/* Ash's own words */}
      <p style={{
        fontFamily: 'Lora, serif', fontSize: 16,
        lineHeight: 1.74, color: 'var(--a)',
        textWrap: 'pretty',
      }}>{e.body}</p>

    </div>
  );
}

/* ─── Ash's Voice screen ─────────────────────────────────── */

function AshVoice() {
  return (
    <div style={{ background: 'var(--bg)', minHeight: '100%', paddingBottom: 60 }}>

      {/* ── header ── */}
      <div style={{
        position: 'relative',
        background: `radial-gradient(ellipse 100% 60% at 50% 0%, rgba(196,122,82,0.18) 0%, rgba(196,122,82,0.05) 55%, transparent 80%)`,
        paddingTop: 64, paddingBottom: 28,
      }}>

        {/* back */}
        <button style={{
          position: 'absolute', top: 68, left: 14,
          width: 36, height: 36, borderRadius: '50%',
          background: 'rgba(14,12,18,0.55)',
          backdropFilter: 'blur(14px)',
          WebkitBackdropFilter: 'blur(14px)',
          border: '1px solid rgba(255,255,255,0.10)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          cursor: 'pointer', color: 'var(--ink60)', fontSize: 20, lineHeight: 1,
        }}>‹</button>

        {/* avatar + identity */}
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>

          {/* Ash's avatar — warmer, heavier, more earthed than archetype avatars */}
          <div style={{
            width: 96, height: 96, borderRadius: '50%',
            background: `radial-gradient(circle at 38% 38%, rgba(220,160,120,0.9), var(--a) 60%)`,
            boxShadow: `0 0 36px rgba(196,122,82,0.38), 0 0 14px rgba(196,122,82,0.22), inset 0 1px 0 rgba(255,255,255,0.12)`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            marginBottom: 18,
          }}>
            <span style={{ fontSize: 40, color: 'rgba(255,255,255,0.88)', lineHeight: 1, userSelect: 'none' }}>◉</span>
          </div>

          <h1 style={{
            fontFamily: 'Lora, serif', fontWeight: 500,
            fontSize: 26, color: 'var(--ink)',
            letterSpacing: '-0.012em', marginBottom: 7,
          }}>Ash</h1>

          <span style={{
            fontFamily: 'Space Mono, monospace',
            fontSize: 11, color: 'var(--ink60)',
            letterSpacing: '0.12em', textTransform: 'uppercase',
          }}>Physical Synthesis</span>
        </div>
      </div>

      {/* ── stats ── */}
      <div style={{
        display: 'flex', padding: '22px 24px 24px',
        animation: 'dissolve 0.8s ease-out 0.15s both',
      }}>
        {STATS.map((s, i) => (
          <React.Fragment key={i}>
            <Stat value={s.value} label={s.label} />
            {i < STATS.length - 1 && (
              <div style={{ width: '0.5px', background: 'var(--hair)', margin: '4px 0', alignSelf: 'stretch' }} />
            )}
          </React.Fragment>
        ))}
      </div>

      <HR mx={20} />

      {/* ── section label ── */}
      <div style={{
        padding: '20px 20px 16px',
        animation: 'dissolve 0.8s ease-out 0.3s both',
      }}>
        <p style={{
          fontFamily: 'Lora, serif', fontStyle: 'italic',
          fontSize: 13, color: 'var(--ink35)',
          lineHeight: 1.6, letterSpacing: '0.01em',
        }}>Every time you chose to enter the room. Newest first.</p>
      </div>

      {/* ── entries ── */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        {ENTRIES.map((e, i) => (
          <Entry key={e.id} e={e} delay={0.4 + i * 0.18} />
        ))}
      </div>

      {/* ── quiet end ── */}
      <div style={{
        padding: '36px 20px 0',
        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10,
        opacity: 0,
        animation: `dissolve 1s ease-out ${0.4 + ENTRIES.length * 0.18 + 0.3}s both`,
      }}>
        <div style={{ width: 1, height: 32, background: `rgba(196,122,82,0.18)` }} />
        <span style={{
          fontFamily: 'Lora, serif', fontStyle: 'italic',
          fontSize: 12, color: 'var(--a)', opacity: 0.4,
          letterSpacing: '0.02em',
        }}>this is where you began</span>
      </div>

    </div>
  );
}

/* ─── App ────────────────────────────────────────────────── */

function App() {
  return (
    <IOSDevice dark={true} width={393} height={852}>
      <AshVoice />
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
