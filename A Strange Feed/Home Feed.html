<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Strange Feed — Home Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Space+Mono&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; min-height: 100%;
      background: #06050A;
      display: flex; align-items: center; justify-content: center;
    }

    #root {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 100vh;
      padding: 40px 20px;
    }

    :root {
      --bg:    #0E0C12;
      --card:  #171420;
      --hair:  rgba(255,255,255,0.06);
      --ink:   #EDE8E3;
      --ink60: rgba(237,232,227,0.60);
      --ink35: rgba(237,232,227,0.35);
      --lalita: #9B6BD6;
      --ash:   #C47A52;
    }

    /* one breath of light — the living thread */
    @keyframes livePulse {
      0%   { box-shadow: none; border-color: rgba(255,255,255,0.06); }
      45%  { box-shadow: 0 0 28px rgba(155,107,214,0.13); border-color: rgba(155,107,214,0.26); }
      100% { box-shadow: none; border-color: rgba(255,255,255,0.06); }
    }

    @keyframes dissolve {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    div::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ─── Archetype palette ──────────────────────────────────── */

const ARCH = {
  gaia:     { color: '#4A9E6B', g: '◆' },
  sakshi:   { color: '#7B82D4', g: '◇' },
  lalita:   { color: '#9B6BD6', g: '✦' },
  bindu:    { color: '#E5533C', g: '·'  },
  sid:      { color: '#C4923A', g: '△' },
  arch:     { color: '#D4607A', g: '◯' },
  karishma: { color: '#D4AE4A', g: '✦' },
  ashrey:   { color: '#3AADA8', g: '⬡' },
};

const ASH = { color: '#C47A52', g: '◉' };

/* ─── Games ─────────────────────────────────────────────── */

const GAMES = [
  { id: 'maya',    name: 'A Maya Game', color: '#D4AE4A', glyph: '◈' },
  { id: 'garden',  name: 'The Garden',  color: '#4A9E6B', glyph: '◆' },
  { id: 'watcher', name: 'The Watcher', color: '#7B82D4', glyph: '◇' },
  { id: 'descent', name: 'The Descent', color: '#E5533C', glyph: '·'  },
  { id: 'return',  name: 'The Return',  color: '#9B6BD6', glyph: '✦' },
];

/* ─── Stories ────────────────────────────────────────────── */

const STORIES = [
  {
    id: 'c1052', game: 'maya',
    community: { name: 'A Maya Game', color: '#D4AE4A', glyph: '◈' },
    codexId: 'C-1052',
    title: 'The Two Who Were One',
    excerpt: 'He was watching a show about people who walked into an elevator and forgot. Down at the bottom, the doors opened onto a white floor, and the person who stepped out had no idea they had a family.',
    resonance: 89, comments: 14,
    archetypes: ['sakshi', 'lalita', 'gaia'],
    pulse: true,
    href: 'Story Detail.html',
  },
  {
    id: 'c1061', game: 'maya',
    community: { name: 'A Maya Game', color: '#D4AE4A', glyph: '◈' },
    codexId: 'C-1061',
    title: 'Still Life with Cold Coffee',
    excerpt: 'I noticed the cup before I noticed I was noticing it. It had been sitting there for an hour, maybe longer. At some point I had stopped drinking it and started watching it go cold.',
    resonance: 34, comments: 6,
    archetypes: ['sakshi', 'sid', 'lalita'],
    pulse: false,
    href: null,
  },
  {
    id: 'c1047', game: 'garden',
    community: { name: 'The Garden', color: '#4A9E6B', glyph: '◆' },
    codexId: 'C-1047',
    title: 'The Smile While Making Eggs',
    excerpt: 'It happened between the eggs and the butter, in the moment when I wasn\'t thinking about anything. The smile arrived before the reason for it. Then the reason never came.',
    resonance: 52, comments: 8,
    archetypes: ['gaia', 'karishma', 'bindu'],
    pulse: false,
    href: null,
  },
  {
    id: 'c1038', game: 'watcher',
    community: { name: 'The Watcher', color: '#7B82D4', glyph: '◇' },
    codexId: 'C-1038',
    title: 'The One Who Sees',
    excerpt: 'Something happened in the meditation this morning. I reached the edge of the thing I usually reach — and instead of stopping, I kept going. There was someone on the other side, watching.',
    resonance: 67, comments: 11,
    archetypes: ['sakshi', 'lalita', 'ashrey'],
    pulse: false,
    href: null,
  },
];

/* ─── Primitives ─────────────────────────────────────────── */

function CommunityPill({ c }) {
  return (
    <div style={{
      display: 'inline-flex', alignItems: 'center', gap: 5,
      background: `${c.color}14`,
      border: `1px solid ${c.color}28`,
      borderRadius: 100, padding: '3px 10px 3px 7px',
    }}>
      <span style={{ fontSize: 10, color: c.color, lineHeight: 1 }}>{c.glyph}</span>
      <span style={{ fontSize: 11, color: c.color, fontFamily: 'Lora, serif', letterSpacing: '0.02em' }}>
        {c.name}
      </span>
    </div>
  );
}

/* ─── Overlapping archetype avatars ──────────────────────── */

function AvatarStack({ archetypes }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center' }}>
      {archetypes.map((key, i) => {
        const d = ARCH[key];
        return (
          <div key={key} style={{
            width: 22, height: 22, borderRadius: '50%',
            background: d.color,
            border: '2px solid var(--card)',
            boxShadow: `0 0 8px ${d.color}42`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            marginLeft: i > 0 ? -7 : 0,
            zIndex: archetypes.length - i,
            flexShrink: 0,
            position: 'relative',
          }}>
            <span style={{ fontSize: 7, color: 'rgba(255,255,255,0.88)', lineHeight: 1, userSelect: 'none' }}>
              {d.g}
            </span>
          </div>
        );
      })}
    </div>
  );
}

/* ─── Story card ─────────────────────────────────────────── */

function StoryCard({ story }) {
  const inner = (
    <div style={{
      background: 'var(--card)',
      borderRadius: 18,
      border: '1px solid var(--hair)',
      padding: '16px 16px 15px',
      cursor: story.href ? 'pointer' : 'default',
      animation: story.pulse ? 'livePulse 4.5s ease-in-out 1.2s 1 forwards' : 'none',
      transition: 'opacity 0.15s ease',
      WebkitTapHighlightColor: 'transparent',
    }}>

      {/* meta row */}
      <div style={{
        display: 'flex', alignItems: 'center',
        justifyContent: 'space-between',
        marginBottom: 12,
      }}>
        <CommunityPill c={story.community} />
        <span style={{
          fontFamily: 'Space Mono, monospace',
          fontSize: 10, color: 'var(--ink35)',
          letterSpacing: '0.06em',
        }}>{story.codexId}</span>
      </div>

      {/* title */}
      <h2 style={{
        fontFamily: 'Lora, serif', fontWeight: 500,
        fontSize: 19, lineHeight: 1.32,
        color: 'var(--ink)', marginBottom: 9,
        letterSpacing: '-0.012em', textWrap: 'pretty',
      }}>{story.title}</h2>

      {/* excerpt — 2 lines */}
      <p style={{
        fontFamily: 'Lora, serif', fontSize: 14,
        lineHeight: 1.62, color: 'var(--ink60)',
        display: '-webkit-box',
        WebkitLineClamp: 2,
        WebkitBoxOrient: 'vertical',
        overflow: 'hidden',
        marginBottom: 16,
        textWrap: 'pretty',
      }}>{story.excerpt}</p>

      {/* footer: stats + avatar stack */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <span style={{
            fontFamily: 'Space Mono, monospace',
            fontSize: 10, color: 'var(--ink35)',
            letterSpacing: '0.02em',
          }}>♡ {story.resonance}</span>
          <span style={{
            fontFamily: 'Space Mono, monospace',
            fontSize: 10, color: 'var(--ink35)',
            letterSpacing: '0.02em',
          }}>↳ {story.comments}</span>
        </div>
        <AvatarStack archetypes={story.archetypes} />
      </div>
    </div>
  );

  if (story.href) {
    return (
      <a href={story.href} style={{ display: 'block', margin: '0 16px', textDecoration: 'none' }}>
        {inner}
      </a>
    );
  }

  return <div style={{ margin: '0 16px' }}>{inner}</div>;
}

/* ─── Game filter pill ───────────────────────────────────── */

function GamePill({ game, active, onTap }) {
  return (
    <button
      onClick={() => onTap(game.id)}
      style={{
        display: 'inline-flex', alignItems: 'center', gap: 6,
        padding: '7px 14px',
        borderRadius: 100,
        border: active ? `1px solid ${game.color}38` : '1px solid transparent',
        background: active ? `${game.color}16` : 'none',
        cursor: 'pointer', whiteSpace: 'nowrap',
        boxShadow: active ? `0 0 14px ${game.color}18` : 'none',
        transition: 'background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease',
        WebkitTapHighlightColor: 'transparent',
      }}
    >
      <span style={{
        fontSize: 11,
        color: active ? game.color : 'var(--ink35)',
        transition: 'color 0.35s ease',
        lineHeight: 1,
      }}>{game.glyph}</span>
      <span style={{
        fontFamily: 'Lora, serif', fontSize: 13,
        color: active ? game.color : 'var(--ink35)',
        opacity: active ? 1 : 0.55,
        letterSpacing: '0.01em',
        transition: 'color 0.35s ease, opacity 0.35s ease',
      }}>{game.name}</span>
    </button>
  );
}

/* ─── Game filter bar ────────────────────────────────────── */

function GameFilter({ activeId, onSelect }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center',
      overflowX: 'auto', padding: '0 12px',
      gap: 2, msOverflowStyle: 'none', scrollbarWidth: 'none',
    }}>
      {GAMES.map(g => (
        <GamePill key={g.id} game={g} active={activeId === g.id} onTap={onSelect} />
      ))}
    </div>
  );
}

/* ─── Home Feed screen ───────────────────────────────────── */

function HomeFeed() {
  const [activeGame, setActiveGame]   = React.useState('maya');
  const [dissolving, setDissolving]   = React.useState(false);
  const [currentGame, setCurrentGame] = React.useState('maya');

  function handleSelect(id) {
    if (id === activeGame) return;
    setDissolving(true);
    setTimeout(() => {
      setCurrentGame(id);
      setActiveGame(id);
      setDissolving(false);
    }, 280);
  }

  const visible = STORIES.filter(s => s.game === currentGame);

  return (
    <div style={{ background: 'var(--bg)', minHeight: '100%', paddingBottom: 60 }}>

      {/* header */}
      <div style={{
        padding: '66px 20px 0',
        display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start',
      }}>
        <div>
          <h1 style={{
            fontFamily: 'Lora, serif', fontWeight: 500,
            fontSize: 22, lineHeight: 1.2,
            color: 'var(--ink)', marginBottom: 5,
            letterSpacing: '-0.012em',
          }}>A Strange Feed</h1>
          <p style={{
            fontFamily: 'Lora, serif', fontStyle: 'italic',
            fontSize: 13, color: 'var(--ink60)',
            letterSpacing: '0.01em',
          }}>the field reads the Codex back</p>
        </div>

        {/* Ash avatar — tap for your voice screen */}
        <div style={{
          width: 36, height: 36, borderRadius: '50%',
          background: ASH.color, marginTop: 2,
          boxShadow: `0 0 16px ${ASH.color}40`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          flexShrink: 0, cursor: 'pointer',
        }}>
          <span style={{ fontSize: 14, color: 'rgba(255,255,255,0.88)', lineHeight: 1 }}>
            {ASH.g}
          </span>
        </div>
      </div>

      {/* game filter */}
      <div style={{ marginTop: 22, marginBottom: 22 }}>
        <GameFilter activeId={activeGame} onSelect={handleSelect} />
      </div>

      {/* hairline */}
      <div style={{ height: '0.5px', background: 'var(--hair)', margin: '0 16px 22px' }} />

      {/* story cards */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 14,
        opacity: dissolving ? 0 : 1,
        transition: dissolving ? 'opacity 0.28s ease' : 'opacity 0.4s ease',
      }}>
        {visible.length > 0
          ? visible.map(s => <StoryCard key={s.id} story={s} />)
          : (
            <div style={{
              padding: '48px 20px',
              textAlign: 'center',
              fontFamily: 'Lora, serif', fontStyle: 'italic',
              fontSize: 14, lineHeight: 1.7,
              color: 'var(--ink35)',
            }}>
              The field is quiet here.
            </div>
          )
        }
      </div>

    </div>
  );
}

/* ─── App ────────────────────────────────────────────────── */

function App() {
  return (
    <IOSDevice dark={true} width={393} height={852}>
      <HomeFeed />
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
