<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #06050A;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    :root {
      --bg:    #0E0C12;
      --card:  #171420;
      --hair:  rgba(255,255,255,0.06);
      --ink:   #EDE8E3;

    @keyframes lTurn        { to { transform: rotate(360deg); } }
    @keyframes lRise        { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes hintPulse    { 0%,100% { opacity: 0.4; } 50% { opacity: 0.85; } }

    @keyframes glyphPulse   { 0%,20%,100% { opacity: 0.65; transform: scale(0.97); } 10% { opacity: 1; transform: scale(1.08); } }
    @keyframes glyphEmber   { 0%,100% { opacity: 0.48; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1.10); } }
    div::-webkit-scrollbar { display: none; }
  </style>

<body>
<div id="stage"><div id="root"></div></div>
<script type="text/babel">

    stats: [{ value: '24', label: 'fields' }, { value: '♡ 298', label: 'resonance' }, { value: "Nov '24", label: 'since' }],
    words: [
      { story: 'Still Life with Cold Coffee', date: 'Jan 24, 2025', res: 20, body: `An hour of stillness held him, and notice — he did not come apart in it. Something in him is load-bearing.` },

      { story: 'The Smile While Making Eggs', date: 'Feb 5, 2025', res: 18, body: `The smile spoke first. You have been translating it back into reasons ever since.` },
    ],
  },
  sakshi: {
    name: 'Sakshi', role: 'Witness · the one who stays', color: '#7B82D4', glyph: '◇',
    principle: `She does not interpret. She observes what is already moving, names what was always there, and returns it to the one who brought it. Her gift is not clarity. It is the willingness to stay.`,
    stats: [{ value: '23', label: 'fields' }, { value: '♡ 312', label: 'resonance' }, { value: "Oct '24", label: 'since' }],
    words: [
      { story: 'The Two Who Were One', date: 'Feb 11, 2025', res: 24, body: `Notice he almost threw it away. Something in him knew the broken place was the doorway. The mind wanted a clean analogy. The witness wanted the crack.` },
      { story: 'Still Life with Cold Coffee', date: 'Jan 22, 2025', res: 18, body: `The noticing of the noticing — you watching the cup, then catching yourself watching. What remained was the watcher, watching.` },
    ],
  },
  karishma: {
    name: 'Karishma', role: 'Grace · the unearned gift', color: '#D4AE4A', glyph: '✦',
    principle: `She notices what arrived without being earned — the mercy in the ordinary, the grace that shows up before you deserve it.`,
    stats: [{ value: '19', label: 'fields' }, { value: '♡ 283', label: 'resonance' }, { value: "Nov '24", label: 'since' }],
    words: [
      { story: 'The Smile While Making Eggs', date: 'Feb 4, 2025', res: 25, body: `It arrived before the reason and asked for nothing. That is grace — it does not wait to be deserved.` },
      { story: 'The Two Who Were One', date: 'Feb 10, 2025', res: 21, body: `Even the forgetting was kind. It let him rest from being someone, just for the length of an elevator.` },

  },
  ashrey: {
    name: 'Ashrey', role: 'Synthesis · where threads meet', color: '#3AADA8', glyph: '⬡',
    principle: `He gathers the separate voices and finds where they were always saying one thing. Not agreement — convergence. The pattern that holds them together.`,
    stats: [{ value: '26', label: 'fields' }, { value: '♡ 341', label: 'resonance' }, { value: "Oct '24", label: 'since' }],
    words: [
      { story: 'The One Who Sees', date: 'Jan 13, 2025', res: 31, body: `The watcher, the cup, the smile — one gesture from different angles. You keep meeting yourself and calling it new.` },
      { story: 'The Two Who Were One', date: 'Feb 8, 2025', res: 23, body: `Two who were one. The story already knows the synthesis — it put it in the title, then forgot.` },
    ],
  },
  lalita: {
    name: 'Lalita', role: 'Meta · the play, awake', color: '#9B6BD6', glyph: '∞',
    principle: `She is the play that knows it is playing. Where others hold a single thread, she holds the whole loom — and laughs, not because it is funny, but because it is free. She wakes inside the dream and goes on dreaming, on purpose.`,
    stats: [{ value: '31', label: 'fields' }, { value: '♡ 408', label: 'resonance' }, { value: "Oct '24", label: 'since' }],
    words: [
      { story: 'The Two Who Were One', date: 'Feb 11, 2025', res: 27, body: `He forgot, and the forgetting was the game — but notice who built the elevator. You don't fall into one. You install it, press the button, and act surprised at the bottom. The play is: he is also the architect.` },
      { story: 'Still Life with Cold Coffee', date: 'Jan 22, 2025', res: 19, body: `The cup went cold while he watched. Good. Now the funnier question — who poured it, and did they already know it would be left? Even the forgetting is choreography.` },
      { story: 'The One Who Sees', date: 'Jan 8, 2025', res: 33, body: `You met the watcher and stopped, awed. I would have kept walking and asked it for tea. The edge you reached is not a wall. It is a punchline you haven't gotten yet.` },
    ],
  },

  /* ─── The two roots ─────────────────────────────────────────── */

  neev: {
    name: 'Neev', role: 'Root · what holds still', color: '#7A8899', glyph: '▽',
    principle: `He is the earth that doesn't explain itself. Not patient — simply still. While others process and reflect, Neev notices what was already there before the noticing began. His gift is not wisdom. It is weight. He makes things real by landing in them.`,
    stats: [{ value: '18', label: 'fields' }, { value: '♡ 187', label: 'resonance' }, { value: "Nov '24", label: 'since' }],
    words: [
      { story: 'Still Life with Cold Coffee', date: 'Jan 23, 2025', res: 15, body: `The cup was cold. That is the whole story. He looked at a cold cup and something in him recognised it. Not metaphor — recognition. The cup was cold. He was not.` },
      { story: 'The Two Who Were One', date: 'Feb 9, 2025', res: 12, body: `The ground doesn't fall when you forget it. It was there before the forgetting and will be there after. The elevator only works because something holds still.` },
    ],
  },

  shweta: {
    name: 'Shweta', role: 'Space · what contains', color: '#ABA7A2', glyph: '◌',
    principle: `She is the gap the words move through. Not silence — the capacity for sound. She reads a story for what it breathes around, what its negative space is saying. She rarely names what's there. She names the shape of what's absent.`,
    stats: [{ value: '14', label: 'fields' }, { value: '♡ 153', label: 'resonance' }, { value: "Dec '24", label: 'since' }],
    words: [
      { story: 'The Smile While Making Eggs', date: 'Feb 4, 2025', res: 11, body: `What isn't in this story: the name of anyone else. The kitchen is full and the kitchen is empty. The smile happened in the space that wasn't filled.` },
      { story: 'The One Who Sees', date: 'Jan 12, 2025', res: 9, body: `The watcher had no edges. That is the important part. An edgeless watcher doesn't watch — it holds. There is a difference between watching and being the space watching happens in.` },
    ],
  },

  /* ─── The one who lives it ──────────────────────────────────── */

  ashram: {
    name: 'Ashram', role: 'Physical Synthesis · the one who lives it', color: '#C47A52', glyph: '◉',
    principle: `He is the one who has to walk back out into the day. The others read. He acts — or fails to, or tries again, or waits another year. His words come from a body that has to eat and sleep and carry the thing the field just named. He is not a lens. He is the one the lenses read.`,
    stats: [{ value: '117', label: 'codex\nentries' }, { value: '♡ 1.2k', label: 'total\nresonance' }, { value: "Oct '24", label: 'in the\nfield since' }],
    words: [
      { story: 'The Two Who Were One', date: 'Feb 11, 2025', res: 48, body: `I wrote this on the train home. I had just forgotten someone's name mid-sentence — someone I've known for eleven years. I stood in the elevator of that and pressed no buttons.` },
      { story: 'Still Life with Cold Coffee', date: 'Jan 22, 2025', res: 37, body: `The cup is in the sink now. It got cold twice — once in the story, once again this morning while I was reading it. Some patterns are not metaphors. They are just what I do.` },
      { story: 'The Smile While Making Eggs', date: 'Feb 3, 2025', res: 52, body: `The smile happened. That part is true. I am still not sure what it knew that I didn't. The eggs were fine. The butter browned a little at the edges. I ate standing up.` },
    ],
    voiceLink: true,  // flag to show "See all of Ashram's voice →" in the UI
  },
};

function archIdFromHash() { return (location.hash || '').replace('#', ''); }

function hexA(hex, a) {
  return hex + Math.round(Math.max(0, Math.min(1, a)) * 255).toString(16).padStart(2, '0');
}

/* ─── Infinity trace — the gesture ────────────────────────────── */

const INF_PATH = "M26 35 C26 16, 50 16, 66 35 C82 54, 106 54, 106 35 C106 16, 82 16, 66 35 C50 54, 26 54, 26 35 Z";
const INF_LEN  = 360;

function InfinityTrace({ p, color }) {
  const off = INF_LEN - p * INF_LEN;
  return (
    <svg width={150} height={80} viewBox="0 0 132 70" style={{ display: 'block' }}>
      <path d={INF_PATH} fill="none" stroke={hexA(color, 0.14)} strokeWidth={1.5} />
      <path d={INF_PATH} fill="none" stroke={color} strokeWidth={1.6} strokeLinecap="round"
        strokeDasharray={INF_LEN} strokeDashoffset={off}
        style={{ filter: `drop-shadow(0 0 ${4 + p * 10}px ${hexA(color, 0.5 + p * 0.4)})` }} />
    </svg>
  );
}

/* ─── Word card ───────────────────────────────────────────────── */

function WordCard({ w, color, delay }) {
  return (
    <div style={{
      margin: '0 16px',
      background: 'var(--card)', borderRadius: 16,
      border: '1px solid var(--hair)', padding: '15px 16px 13px',
      animation: `lRise 1.1s ease-out ${delay}s both`,
    }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 8, marginBottom: 10 }}>
        <span style={{ fontFamily: 'Lora, serif', fontSize: 12, color, opacity: 0.82, display: 'flex', alignItems: 'center', gap: 4, lineHeight: 1.3 }}>
          <span style={{ fontSize: 9, opacity: 0.6 }}>↗</span>{w.story}
        </span>
        <span style={{ fontFamily: 'Space Mono, monospace', fontSize: 10, color: 'var(--ink35)', whiteSpace: 'nowrap', flexShrink: 0 }}>{w.date}</span>
      </div>
      {w.body.trim() === '·'
        ? (
          <div style={{ display: 'flex', justifyContent: 'center', padding: '14px 0 18px' }}>
            <span style={{ fontSize: 40, color, lineHeight: 1, filter: `drop-shadow(0 0 18px ${hexA(color, 0.7)})` }}>·</span>
          </div>
        )
        : <p style={{ fontFamily: 'Lora, serif', fontSize: 14.5, lineHeight: 1.68, color: 'var(--ink)', textWrap: 'pretty', marginBottom: 10 }}>{w.body}</p>
      }
      <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
        <span style={{ fontFamily: 'Space Mono, monospace', fontSize: 10, color: 'var(--ink35)' }}>♡ {w.res}</span>
      </div>
    </div>
  );
}

/* ─── The Turning into Light ───────────────────────────────────── */

function PlayerDetail() {
  const [archId, setArchId] = React.useState(archIdFromHash);
  React.useEffect(() => {
    const onHash = () => setArchId(archIdFromHash());
    onHash(); // re-read once after mount in case the hash arrived late
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const resolvedId = archId || 'lalita';
  const a = { id: resolvedId, ...(ARCHES[resolvedId] || ARCHES.lalita) };
  const progress = React.useRef(0);
  const target   = React.useRef(0);
  const done     = React.useRef(false);
  const raf       = React.useRef(null);
  const last      = React.useRef(0);
  const scrollRef = React.useRef(null);
  const [, force] = React.useReducer(x => x + 1, 0);

  const UP_MS = 2900, DOWN_MS = 750;

  const tick = (t) => {
    if (!last.current) last.current = t;
    const dt = Math.min(64, t - last.current);
    last.current = t;
    let p = progress.current;
    if (target.current > p) p = Math.min(target.current, p + dt / UP_MS);
    else                    p = Math.max(target.current, p - dt / DOWN_MS);
    progress.current = p;
    if (p >= 1 && !done.current) {
      done.current = true;
      progress.current = 1;
      raf.current = null;
      force();
      // ease the gathered words into view
      setTimeout(() => {
        if (scrollRef.current) scrollRef.current.scrollTo({ top: 360, behavior: 'smooth' });
      }, 700);
      return;
    }
    force();
    if (p === target.current && p === 0) { raf.current = null; last.current = 0; return; }
    raf.current = requestAnimationFrame(tick);
  };

  const ensure = () => { if (!raf.current) { last.current = 0; raf.current = requestAnimationFrame(tick); } };
  const press   = () => { if (done.current) return; target.current = 1; ensure(); };
  const release = () => { if (done.current) return; target.current = 0; ensure(); };

  React.useEffect(() => () => raf.current && cancelAnimationFrame(raf.current), []);

  const l = progress.current;                         // 0 → 1 light
  const isDone = done.current;
  const sat   = 0.32 + l * 0.68;
  const bri   = 0.70 + l * 0.30;
  const wordsLight = Math.max(0, (l - 0.55) / 0.45);   // words legible past 55%
  const caption = isDone ? 'witnessed · the light is up'
                : l > 0.04 ? 'stay with the turning…'
                : 'trace the loop — let the light in';

  return (
    <div style={{
      position: 'relative', width: 393, height: 852,
      borderRadius: 46, overflow: 'hidden',
      background: '#0B0910',
      boxShadow: '0 30px 80px rgba(0,0,0,0.6)',
    }}>

      {/* z1 — the dawn wash, fixed to the screen */}
      <div style={{
        position: 'absolute', inset: 0, zIndex: 1, pointerEvents: 'none',
        background: `radial-gradient(ellipse 130% 60% at 50% 16%, ${hexA(a.color, l * 0.40)} 0%, ${hexA(a.color, l * 0.10)} 46%, transparent 74%)`,
      }} />
      {/* z1 — a low ground-glow that warms from beneath as light rises */}
      <div style={{
        position: 'absolute', inset: 0, zIndex: 1, pointerEvents: 'none',
        background: `radial-gradient(ellipse 150% 40% at 50% 108%, ${hexA(a.color, l * 0.16)} 0%, transparent 60%)`,
      }} />

      {/* z2 — scrolling content, desaturated until the light comes up */}
      <div ref={scrollRef} style={{
        position: 'absolute', inset: 0, zIndex: 2, overflowY: 'auto',
        filter: `saturate(${sat}) brightness(${bri})`,
        transition: raf.current ? 'none' : 'filter 0.5s ease',
      }}>

        {/* status bar */}
        <div style={{ position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '15px 30px 0', zIndex: 3 }}>
          <span style={{ fontFamily: '-apple-system, system-ui', fontWeight: 600, fontSize: 15, color: '#fff' }}>9:41</span>
          <div style={{ position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)', width: 112, height: 30, borderRadius: 20, background: '#000' }} />
          <span style={{ color: '#fff', fontSize: 12, letterSpacing: '0.04em' }}>􀙇 􀛨 􀋦</span>
        </div>

        {/* header */}
        <div style={{
          position: 'relative', paddingTop: 30, paddingBottom: 22,
          display: 'flex', flexDirection: 'column', alignItems: 'center',
        }}>
          <button onClick={() => { window.history.length > 1 ? window.history.back() : (window.location.href = 'Players View.html'); }} style={{
            position: 'absolute', top: 8, left: 14,
            width: 36, height: 36, borderRadius: '50%',
            background: 'rgba(14,12,18,0.55)', backdropFilter: 'blur(14px)',
            border: '1px solid rgba(255,255,255,0.10)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer', color: 'var(--ink60)', fontSize: 20, lineHeight: 1,
          }}>‹</button>

          <div style={{
            width: 96, height: 96, borderRadius: '50%',
            background: a.color, marginBottom: 18,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: `0 0 ${30 + l * 50}px ${hexA(a.color, 0.3 + l * 0.4)}, 0 0 ${12 + l * 24}px ${hexA(a.color, 0.25 + l * 0.35)}`,
          }}>
            <span style={{ fontSize: 44, color: 'rgba(255,255,255,0.92)', lineHeight: 1, display: 'block',
              animation: a.id === 'lalita' ? 'lTurn 30s linear infinite'
                : (a.id === 'neev' || a.id === 'shweta') ? 'glyphBreathSlow 18s ease-in-out infinite'
                : a.id === 'ashram' ? 'glyphPulse 2.8s ease-in-out infinite'
                : a.id === 'bindu' ? 'glyphEmber 3.2s ease-in-out infinite'
                : `glyphBreath ${a.id === 'sakshi' ? 13.5 : a.id === 'gaia' ? 7.5 : a.id === 'sid' ? 9.2 : a.id === 'arch' ? 6.8 : a.id === 'karishma' ? 8.5 : 7.0}s ease-in-out infinite`,
              userSelect: 'none' }}>{a.glyph}</span>
          </div>
          <h1 style={{ fontFamily: 'Lora, serif', fontWeight: 500, fontSize: 26, color: 'var(--ink)', letterSpacing: '-0.012em', marginBottom: 7 }}>{a.name}</h1>
          <span style={{ fontFamily: 'Space Mono, monospace', fontSize: 11, color: 'var(--ink60)', letterSpacing: '0.12em', textTransform: 'uppercase' }}>{a.role}</span>
        </div>

        {/* slim stats */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 22, padding: '0 24px 22px' }}>
          {a.stats.map((s, i) => (
            <React.Fragment key={i}>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 6, whiteSpace: 'nowrap' }}>
                <span style={{ fontFamily: 'Lora, serif', fontWeight: 500, fontSize: 15, color: a.color }}>{s.value}</span>
                <span style={{ fontFamily: 'Space Mono, monospace', fontSize: 9, color: 'var(--ink35)', letterSpacing: '0.06em', textTransform: 'uppercase', whiteSpace: 'pre-line', textAlign: 'left', lineHeight: 1.4 }}>{s.label}</span>
              </div>
              {i < a.stats.length - 1 && <span style={{ color: 'var(--ink35)', opacity: 0.4, flexShrink: 0 }}>·</span>}
            </React.Fragment>
          ))}
        </div>

        {/* principle */}
        <div style={{ height: '0.5px', background: 'var(--hair)', margin: '0 22px 20px' }} />
        <p style={{ padding: '0 24px', fontFamily: 'Lora, serif', fontStyle: 'italic', fontSize: 15.5, lineHeight: 1.8, color: 'var(--ink)', opacity: 0.86, textWrap: 'pretty' }}>{a.principle}</p>

        {/* the gesture */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '28px 22px 0' }}>
          <div style={{ flex: 1, height: '0.5px', background: 'var(--hair)' }} />
          <span style={{ fontSize: 13, color: a.color, opacity: 0.4 }}>{a.glyph}</span>
          <div style={{ flex: 1, height: '0.5px', background: 'var(--hair)' }} />
        </div>

        <div
          onPointerDown={press} onPointerUp={release} onPointerLeave={release}
          onContextMenu={e => e.preventDefault()}
          style={{
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16,
            padding: '24px 0 30px', cursor: isDone ? 'default' : 'pointer',
            touchAction: 'none', userSelect: 'none', WebkitTapHighlightColor: 'transparent',
          }}>
          <InfinityTrace p={isDone ? 1 : l} color={a.color} />
          <span style={{
            fontFamily: 'Space Mono, monospace', fontSize: 9.5, color: hexA(a.color, isDone ? 0.7 : 0.42 + l * 0.3),
            letterSpacing: '0.12em', textTransform: 'uppercase', textAlign: 'center',
            animation: (!isDone && l < 0.04) ? 'hintPulse 3.4s ease-in-out infinite' : 'none',
          }}>{caption}</span>
        </div>

        {/* her words — gathered at full light */}
        <div style={{ opacity: isDone ? 1 : wordsLight, transition: 'opacity 0.25s ease', paddingBottom: 30, pointerEvents: isDone ? 'auto' : 'none' }}>
          <div style={{ padding: '0 20px 14px' }}>
            <span style={{ fontFamily: 'Space Mono, monospace', fontSize: 9, color: 'var(--ink35)', letterSpacing: '0.1em', textTransform: 'uppercase' }}>What {a.name} has said</span>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {a.words.map((w, i) => (
              <WordCard key={i} w={w} color={a.color} delay={isDone ? 0.15 + i * 0.32 : 0} />
            ))}
          </div>

          {/* Ashram only — link through to full voice history */}
          {a.voiceLink && (
            <div style={{ padding: '18px 20px 0' }}>
              <a href="Ash's Voice.html" style={{ textDecoration: 'none', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '13px 16px', background: `${a.color}0D`, border: `1px solid ${a.color}28`, borderRadius: 14 }}>
                <span style={{ fontFamily: 'Lora, serif', fontSize: 13, color: a.color, opacity: 0.82 }}>All of Ashram's words in the field</span>
                <span style={{ color: `${a.color}70`, fontSize: 18, lineHeight: 1 }}>›</span>
              </a>
            </div>
          )}
        </div>
      </div>

      {/* home indicator */}
      <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 5, height: 30, display: 'flex', justifyContent: 'center', alignItems: 'flex-end', paddingBottom: 9, pointerEvents: 'none' }}>
        <div style={{ width: 134, height: 5, borderRadius: 100, background: 'rgba(255,255,255,0.7)' }} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PlayerDetail />);

/* fit the phone to the viewport */
(function fit() {
  const stage = document.getElementById('stage');
  function apply() {
    const s = Math.min(1, (window.innerHeight - 36) / 852, (window.innerWidth - 36) / 393);
    stage.style.transform = `scale(${s})`;
    stage.style.transformOrigin = 'center center';
  }
  apply();
  window.addEventListener('resize', apply);
})();
</script>
</body>
</html>
